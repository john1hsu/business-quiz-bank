topic: 'DuPont Analysis: Decomposing Return on Equity'
topic_type: Framework
true_statement: In the three-step DuPont formula, ROE equals profit margin times total asset turnover times the equity multiplier, total assets over shareholders' equity.
false_statement: In the three-step DuPont formula, ROE equals profit margin times total asset turnover times the debt ratio, total liabilities over total assets.
explanation: 'Sales and total assets cancel across the three ratios, leaving net income over equity. The equity multiplier is the leverage term: the more assets financed by liabilities, the higher it is.'
