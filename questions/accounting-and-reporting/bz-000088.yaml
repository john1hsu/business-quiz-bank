true_statement: The SEC recognized FASB pronouncements as authoritative US GAAP in Accounting Series Release No. 150 in December 1973.
false_statement: The SEC recognized FASB pronouncements as authoritative US GAAP in Accounting Series Release No. 150 in December 1959.
explanation: The SEC had let the profession set standards since 1938, first through the Committee on Accounting Procedure and from 1959 the Accounting Principles Board. The FASB replaced the APB after the Wheat Commission urged a full-time independent body.
