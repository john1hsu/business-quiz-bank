topic: 'International Financial Reporting Standards (IFRS): Global Rules Set by the IASB'
topic_type: Framework
true_statement: IFRS prohibits LIFO inventory costing and allows certain impairment losses to be reversed, two fundamental differences from US GAAP.
false_statement: IFRS permits LIFO inventory costing and forbids any reversal of impairment losses, two fundamental differences from US GAAP.
explanation: The SEC staff listed these among the gaps analysts must adjust for when comparing an IFRS reporter with a US peer. IFRS is also more principles-based, with less industry-specific guidance than GAAP.
