true_statement: 'Robin Cooper and Robert Kaplan crystallised the case for activity-based costing in a 1988 HBR article, Measure Costs Right: Make the Right Decisions.'
false_statement: 'Robin Cooper and Robert Kaplan crystallised the case for activity-based costing in a 1998 HBR article, Measure Costs Right: Make the Right Decisions.'
explanation: By the late 1980s automation had shrunk labour and swollen overhead, so labour-hour allocation distorted product costs. Cooper and Kaplan argued ABC could run alongside the official cost system rather than replace it.
