id: bz-000298
area: accounting-and-reporting
kind: mechanism
topic: Revenue from Contracts with Customers
topic_type: Regulation
true_statement: In the fourth step of the ASC 606 and IFRS 15 model, the transaction price is allocated to performance obligations in proportion to their stand-alone selling prices.
false_statement: In the fourth step of the ASC 606 and IFRS 15 model, the transaction price is allocated to performance obligations in proportion to their cost to deliver.
explanation: Allocation by stand-alone selling price splits a bundle as if each good or service had been sold separately. Revenue then arrives only at step five, when each obligation is satisfied.
