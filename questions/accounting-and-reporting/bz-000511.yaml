topic: 'Working Capital: Current Assets Minus Current Liabilities'
topic_type: Metric
true_statement: Marc Deloof's study of 1,009 large Belgian firms in 1992-1996 found that less profitable firms took longer to pay their suppliers.
false_statement: Marc Deloof's study of 1,009 large Belgian firms in 1992-1996 found that more profitable firms took longer to pay their suppliers.
explanation: Deloof also found firms could lift profitability by cutting receivable and inventory days, but long payables periods tracked weaker performance. That suggests slow supplier payment is often a symptom of financial strain rather than a smart working capital strategy.
