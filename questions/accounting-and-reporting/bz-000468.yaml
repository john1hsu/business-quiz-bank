topic: 'EBITDA: Earnings Before Interest, Taxes, Depreciation and Amortization'
topic_type: Metric
true_statement: EBITDA spread during the leveraged-buyout boom of the 1980s, when sponsors argued that depreciation and amortization are non-cash and so free to pay lenders.
false_statement: EBITDA spread during the conglomerate merger wave of the 1960s, when acquirers argued that depreciation and amortization are non-cash and so free to pay lenders.
explanation: Before the 1980s credit analysts mostly judged debt capacity on EBIT; buyout sponsors popularised EBITDA because adding back non-cash charges made more cash look available for heavy debt service. Its use then widened to acquisitions with goodwill, distressed firms and eventually companies of every kind.
