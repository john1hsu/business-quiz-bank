area: accounting-and-reporting
kind: origin
topic: 'International Financial Reporting Standards (IFRS): Global Rules Set by the IASB'
topic_type: Framework
true_statement: In November 2007 the SEC let foreign private issuers file IFRS statements without reconciling to US GAAP, but only if they used IFRS as issued by the IASB.
false_statement: In November 2007 the SEC let foreign private issuers file IFRS statements without reconciling to US GAAP, including national variants of IFRS adopted locally.
explanation: Requiring the IASB's own version discouraged countries from tailoring IFRS and undermining comparability. Domestic US companies still report under US GAAP.
