area: accounting-and-reporting
kind: application
topic: Revenue from Contracts with Customers
topic_type: Regulation
true_statement: When Microsoft adopted the new revenue standard in 2017, Windows 10 revenue once spread over a device's life was instead recognised mainly at billing and delivery.
false_statement: When Microsoft adopted the new revenue standard in 2017, Windows 10 revenue once recognised at billing and delivery was instead spread over a device's life.
explanation: Microsoft reported a material effect on its income statements and balance sheets but none on cash flows. The lesson is that the timing of reported revenue can shift sharply while cash and underlying economics stay the same.
