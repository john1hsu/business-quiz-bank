topic: 'DuPont Analysis: Decomposing Return on Equity'
topic_type: Framework
true_statement: Donaldson Brown devised DuPont's return-on-investment measure in 1914 and, after moving to General Motors in 1921, adapted it into a target-return pricing method.
false_statement: Donaldson Brown devised General Motors' return-on-investment measure in 1914 and, after moving to DuPont in 1921, adapted it into a target-return pricing method.
explanation: Brown combined earnings, working capital and plant investment into one ROI figure at DuPont. At GM each division set a target return and standard volume, then worked out the price needed to hit it.
