id: bz-000171
area: accounting-and-reporting
kind: mechanism
topic: Goodwill
topic_type: Concept
true_statement: Under IAS 36, a cash-generating unit's recoverable amount is the higher of its fair value less costs of disposal and its value in use.
false_statement: Under IAS 36, a cash-generating unit's recoverable amount is the lower of its fair value less costs of disposal and its value in use.
explanation: Goodwill has no cash flows of its own, so it is tested within cash-generating units, which are impaired only when their carrying amount exceeds this recoverable amount. Value in use is the present value of expected cash flows, and any loss reduces goodwill first.
