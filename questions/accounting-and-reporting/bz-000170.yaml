id: bz-000170
area: accounting-and-reporting
kind: definition
topic: Goodwill
topic_type: Concept
true_statement: Goodwill is recognized only when a company acquires a business; goodwill a company builds internally is never put on its balance sheet.
false_statement: Goodwill is recognized only when a company builds it internally; goodwill acquired in a business purchase is never put on its balance sheet.
explanation: 'Goodwill is measured as a residual: the price paid above the fair value of the identifiable net assets acquired, covering things like an assembled workforce and expected synergies. Recording only purchased goodwill is one reason the asset is so contested.'
