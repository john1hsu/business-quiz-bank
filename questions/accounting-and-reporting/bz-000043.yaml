topic: FASB Conceptual Framework
topic_type: Framework
true_statement: 'FASB Concepts Statements are nonauthoritative: they guide the Board when it writes standards but do not themselves establish GAAP.'
false_statement: 'FASB Concepts Statements are authoritative: they sit in the Codification and establish GAAP that preparers must apply directly.'
explanation: The framework explains why standards look the way they do, but companies apply the standards, not the concepts. ASU 2024-02 even stripped remaining references to the Concepts Statements out of the Codification to keep that line clear.
