kind: evidence
topic: 'EBITDA: Earnings Before Interest, Taxes, Depreciation and Amortization'
topic_type: Metric
true_statement: In nearly 4,000 US syndicated loans from 2000 to 2016, more permissive covenant EBITDA definitions went with fewer covenant violations and higher credit spreads.
false_statement: In nearly 4,000 US syndicated loans from 2000 to 2016, more permissive covenant EBITDA definitions went with more covenant violations and lower credit spreads.
explanation: Generous add-backs inflate covenant EBITDA, so borrowers trip covenants less often, while lenders price in the weaker protection with spreads about 43 basis points higher per standard deviation of permissiveness. Badawi and co-authors also found definitions grew looser over time, especially in private-equity-sponsored deals.
