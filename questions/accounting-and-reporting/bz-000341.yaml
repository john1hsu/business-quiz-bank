id: bz-000341
area: accounting-and-reporting
kind: mechanism
topic: 'Activity-Based Costing: Assigning Overhead by Activities'
topic_type: Practice
true_statement: Switching to activity-based costing usually raises the unit cost of low-volume products, because batch- and product-level costs like setups are spread over few units.
false_statement: Switching to activity-based costing usually lowers the unit cost of low-volume products, because batch- and product-level costs like setups are spread over many units.
explanation: A single labour-hour rate lets high-volume products subsidize low-volume ones. ABC assigns setup and engineering costs to the products that cause them, revealing losses the old system hid.
