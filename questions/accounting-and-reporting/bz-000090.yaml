id: bz-000090
area: accounting-and-reporting
kind: application
topic: US GAAP
topic_type: Framework
true_statement: Regulation G requires any public non-GAAP measure to be accompanied by the most directly comparable GAAP figure and a quantitative reconciliation.
false_statement: Regulation G requires any public non-GAAP measure to replace the most directly comparable GAAP figure, with no reconciliation needed.
explanation: Adjusted metrics such as EBITDA are allowed, but readers must be able to see how they differ from GAAP. For analysts, that reconciliation is usually where judgment about true performance begins.
