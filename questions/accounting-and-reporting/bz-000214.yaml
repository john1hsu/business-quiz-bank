id: bz-000214
area: accounting-and-reporting
kind: evidence
topic: Sarbanes-Oxley Act of 2002
topic_type: Regulation
true_statement: Iliev found that filing the SOX Section 404 management report made small firms' reported earnings more conservative but, on net, lowered their market value.
false_statement: Iliev found that filing the SOX Section 404 management report made small firms' reported earnings more conservative and, on net, raised their market value.
explanation: Comparing firms just above and below the $75 million public-float cutoff in 2004, Iliev found the report roughly doubled audit fees, a cost that outweighed the gain in earnings quality for small firms. Defenders counter that benefits such as lower fraud risk accrue over the long run.
