topic: 'International Financial Reporting Standards (IFRS): Global Rules Set by the IASB'
topic_type: Framework
true_statement: Daske, Hail, Leuz and Verdi found the capital-market benefits of mandatory IFRS appeared only where firms had incentives to be transparent and enforcement was strong.
false_statement: Daske, Hail, Leuz and Verdi found the capital-market benefits of mandatory IFRS appeared evenly across countries, regardless of firms' incentives or legal enforcement.
explanation: Liquidity generally rose around adoption, but gains clustered where institutions supported honest reporting. Because enforcement reforms happened at the same time, the authors warned against crediting the accounting switch alone.
