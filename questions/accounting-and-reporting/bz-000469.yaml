id: bz-000469
area: accounting-and-reporting
kind: mechanism
topic: 'EBITDA: Earnings Before Interest, Taxes, Depreciation and Amortization'
topic_type: Metric
true_statement: SEC staff require a company presenting EBITDA as a performance measure to reconcile it to net income rather than to operating income.
false_statement: SEC staff require a company presenting EBITDA as a performance measure to reconcile it to operating income rather than to net income.
explanation: EBITDA adds back interest and income taxes, items that sit below operating income, so net income is the GAAP figure it is actually built from. The same guidance bars EBITDA per share and requires a distinct label, such as Adjusted EBITDA, for any variant computed differently.
