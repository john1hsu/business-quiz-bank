topic: Goodwill
topic_type: Concept
true_statement: Li and Sloan (2017) found that after SFAS 142, managers appear to have delayed goodwill write-downs, temporarily propping up earnings and share prices.
false_statement: Li and Sloan (2017) found that after SFAS 142, managers appear to have accelerated goodwill write-downs, temporarily depressing earnings and share prices.
explanation: SFAS 142 replaced amortization with a fair-value impairment test whose discretion let goodwill balances become inflated and write-downs untimely. Investors did not fully anticipate the delay, which is the 'too little, too late' critique of impairment-only accounting.
