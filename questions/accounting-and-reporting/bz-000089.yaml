true_statement: A 2003 SEC staff study argued that bright-line GAAP thresholds let preparers engineer transactions to land on the preferred side of a line.
false_statement: A 2003 SEC staff study argued that bright-line GAAP thresholds stop preparers from engineering transactions to land on the preferred side of a line.
explanation: 'Lease tests at 75% and 90% were a classic example: deals could be structured just under a threshold. The study recommended objectives-oriented standards grounded in a conceptual framework, not a swing to pure principles.'
