topic: 'DuPont Analysis: Decomposing Return on Equity'
topic_type: Framework
true_statement: Nissim and Penman argued the standard DuPont identity mixes operating and financing activities, so they split ROE into operating return plus a leverage-times-spread term.
false_statement: Nissim and Penman argued the standard DuPont identity overstates operating returns, so they replaced ROE with return on total assets plus a leverage-times-spread term.
explanation: Their 2001 analysis treats operations as the source of value and separates out how borrowing adds or subtracts from it. They found return on total assets actually understates operating profitability because it blends in financial items.
