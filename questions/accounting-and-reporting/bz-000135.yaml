id: bz-000135
area: accounting-and-reporting
kind: definition
topic: Free Cash Flow
topic_type: Metric
true_statement: Unlike free cash flow, EBITDA makes no deduction for capital expenditures or changes in working capital.
false_statement: Unlike EBITDA, free cash flow makes no deduction for capital expenditures or changes in working capital.
explanation: Free cash flow starts from operating cash flow, which already reflects working-capital changes, and then subtracts capital spending. That makes it a closer gauge of cash a business can actually return or redeploy than EBITDA.
