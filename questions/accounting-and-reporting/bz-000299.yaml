id: bz-000299
area: accounting-and-reporting
kind: evidence
topic: Revenue from Contracts with Customers
topic_type: Regulation
true_statement: A study of 2016-2019 adoption found that US software firms, not electronic-computer makers, gained comparability and a tighter link between revenue accruals and cash under ASC 606.
false_statement: A study of 2016-2019 adoption found that US electronic-computer makers, not software firms, gained comparability and a tighter link between revenue accruals and cash under ASC 606.
explanation: Software firms bundle several deliverables across periods, so the new model changed them most; their average adoption adjustment was 4.4% of assets against 1.6% for computer firms. The effects were concentrated rather than universal.
