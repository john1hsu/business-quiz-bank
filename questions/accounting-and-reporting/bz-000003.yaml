topic: Accrual Accounting
topic_type: Concept
true_statement: The 2017 Tax Cuts and Jobs Act let most taxpayers under a $25 million average annual gross receipts test use the cash method.
false_statement: The 2017 Tax Cuts and Jobs Act let most taxpayers under a $50 million average annual gross receipts test use the cash method.
explanation: The 2017 law raised the Sec. 448(c) gross receipts threshold for the cash method from $5 million to $25 million, widening who can skip accrual accounting for tax. $50 million was never the test.
