topic: Accrual Accounting
topic_type: Concept
true_statement: Richard Sloan's 1996 study found that the accrual part of earnings persists less into future earnings than the cash flow part.
false_statement: Richard Sloan's 1996 study found that the accrual part of earnings persists more into future earnings than the cash flow part.
explanation: Sloan showed accruals are the less persistent piece of earnings, yet prices treated both pieces alike; a long low-accrual, short high-accrual portfolio earned about 10.4% in year one. That gap is the 'accrual anomaly' analysts now screen for.
