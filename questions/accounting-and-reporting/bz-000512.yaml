topic: 'Working Capital: Current Assets Minus Current Liabilities'
topic_type: Metric
true_statement: In the decade before its 2008 bankruptcy, Circuit City had a stronger average current ratio than Best Buy but a much longer cash conversion cycle.
false_statement: In the decade before its 2008 bankruptcy, Circuit City had a stronger average current ratio than Best Buy and a much shorter cash conversion cycle.
explanation: 'Cagle, Campbell and Jones used the comparison to show that static ratios can mislead: Circuit City looked more liquid on its balance sheet, yet its cash stayed tied up in operations far longer than Best Buy''s. They recommend reading the cycle alongside the current and quick ratios rather than relying on either alone.'
