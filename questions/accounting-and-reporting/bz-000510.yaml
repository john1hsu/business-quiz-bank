topic: 'Working Capital: Current Assets Minus Current Liabilities'
topic_type: Metric
true_statement: The cash conversion cycle adds the inventory conversion period to the receivables collection period and subtracts the payables deferral period.
false_statement: The cash conversion cycle adds the inventory conversion period to the payables deferral period and subtracts the receivables collection period.
explanation: 'The cycle counts the days cash is tied up in operations: money is locked in inventory and then in receivables, while supplier credit covers part of that time, so payables come off. Paying suppliers more slowly shortens the cycle; collecting from customers more slowly lengthens it.'
