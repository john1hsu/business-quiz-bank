kind: evidence
topic: 'Activity-Based Costing: Assigning Overhead by Activities'
topic_type: Practice
true_statement: Kaplan and Anderson argued conventional ABC's employee time surveys implicitly assumed staff were fully utilised, hiding idle capacity that time-driven ABC exposes.
false_statement: Kaplan and Anderson argued conventional ABC's employee time surveys implicitly assumed staff were half idle, overstating unused capacity that time-driven ABC corrects.
explanation: When people report how they split their time, the shares add up to 100%, so slack disappears. Time-driven ABC uses capacity cost per minute and activity times, so unused capacity shows up explicitly.
