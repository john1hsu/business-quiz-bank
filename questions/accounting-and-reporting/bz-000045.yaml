topic: FASB Conceptual Framework
topic_type: Framework
true_statement: The FASB framework treats investors, lenders and other creditors as primary users because they usually cannot demand information directly from the company.
false_statement: The FASB framework treats regulators and tax authorities as primary users because they usually cannot demand information directly from the company.
explanation: Chapter 1 sets the objective of general purpose reporting as helping capital providers decide whether to supply resources. Regulators can compel information, so they do not depend on general purpose reports the way outside capital providers do.
