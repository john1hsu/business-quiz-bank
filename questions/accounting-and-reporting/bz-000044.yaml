true_statement: The FASB completed its rebuilt conceptual framework in July 2024 by issuing Chapter 6 of Concepts Statement No. 8, on measurement.
false_statement: The FASB completed its rebuilt conceptual framework in July 2024 by issuing Chapter 6 of Concepts Statement No. 8, on presentation.
explanation: Measurement was the last piece of the project the Board reopened in 2014. Presentation was Chapter 7, issued earlier in December 2021 alongside Chapter 4 on the elements of financial statements.
