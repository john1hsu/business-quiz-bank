topic: Deferred Revenue
topic_type: Concept
true_statement: Salesforce reported unearned revenue of $24.3 billion at the end of FY2026 (31 January 2026), up from $20.7 billion a year earlier.
false_statement: Salesforce reported unearned revenue of $20.7 billion at the end of FY2026 (31 January 2026), down from $24.3 billion a year earlier.
explanation: The balance grew because Salesforce bills subscriptions ahead and recognizes them ratably over contracts of typically 12 to 36 months. Heavy fourth-quarter invoicing swells the year-end balance, which is why analysts watch it alongside revenue.
