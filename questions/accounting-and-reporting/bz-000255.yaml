id: bz-000255
area: accounting-and-reporting
kind: definition
topic: Deferred Revenue
topic_type: Concept
true_statement: A contract liability is an obligation to perform for consideration already received or due, whereas a receivable is an unconditional right to cash awaiting only the passage of time.
false_statement: A receivable is an obligation to perform for consideration already received or due, whereas a contract liability is an unconditional right to cash awaiting only the passage of time.
explanation: 'Deferred revenue sits on the liability side because the company still owes the customer goods, services or a refund. A receivable is the opposite position: the work is done and the firm is simply waiting to be paid.'
