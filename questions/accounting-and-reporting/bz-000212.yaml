topic: Sarbanes-Oxley Act of 2002
topic_type: Regulation
true_statement: President George W. Bush signed the Sarbanes-Oxley Act on July 30, 2002, after the collapses of Enron and WorldCom shook confidence in financial reporting.
false_statement: President George W. Bush signed the Sarbanes-Oxley Act on July 30, 2010, after the collapses of Enron and WorldCom shook confidence in financial reporting.
explanation: SOX was the 2002 response to Enron and WorldCom, ending the audit profession's self-regulation by creating the PCAOB. 2010 is the year of the Dodd-Frank Act, which later amended SOX with a small-company exemption.
