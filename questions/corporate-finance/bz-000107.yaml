topic: Arbitrage
topic_type: Concept
true_statement: Shleifer and Vishny argued arbitrage can fail in extremes because investors pull money from arbitrageurs showing losses just as a mispricing widens.
false_statement: Shleifer and Vishny argued arbitrage is strongest in extremes because investors pour money into arbitrageurs just as a mispricing widens.
explanation: Arbitrage is done mostly by specialists managing other people's money, and outside investors judge them on recent returns. The resulting withdrawals can force selling at the worst moment and even amplify price shocks.
