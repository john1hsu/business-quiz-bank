topic: Dividend Policy
topic_type: Practice
true_statement: Miller and Modigliani's 1961 paper argued that, with investment policy held fixed, a firm's dividend payout does not change what the firm is worth.
false_statement: Miller and Modigliani's 1958 paper argued that, with investment policy held fixed, a firm's dividend payout does not change what the firm is worth.
explanation: The 1961 paper, 'Dividend Policy, Growth, and the Valuation of Shares', extended their 1958 capital-structure result to payouts. A bigger dividend must be funded by issuing more shares, so shareholders just swap cash for a smaller claim on the firm.
