true_statement: 'Tests of the CAPM found the return-beta line too flat: low-beta stocks earned more, and high-beta stocks less, than the model predicts.'
false_statement: 'Tests of the CAPM found the return-beta line too steep: low-beta stocks earned less, and high-beta stocks more, than the model predicts.'
explanation: In Fama and French's beta-sorted portfolios for 1928–2003, the lowest-beta group beat its prediction while the highest-beta group fell short. Returns rose with beta, just much less steeply than theory says.
