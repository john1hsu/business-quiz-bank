topic: Modigliani-Miller Theorem
topic_type: Theory
true_statement: Under MM Proposition II, a levered firm's expected return on equity rises linearly with its debt-to-equity ratio.
false_statement: Under MM Proposition II, a levered firm's expected return on equity falls linearly as its debt-to-equity ratio rises.
explanation: Adding debt makes the remaining equity riskier, so shareholders demand more. The higher cost of equity exactly offsets the cheaper debt, which is why the overall cost of capital stays the same.
