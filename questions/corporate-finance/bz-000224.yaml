true_statement: The semi-strong form of market efficiency concerns all public information, and event studies showed prices adjusting quickly to news such as earnings announcements.
false_statement: The weak form of market efficiency concerns all public information, and event studies showed prices adjusting quickly to news such as earnings announcements.
explanation: 'Fama sorted efficiency tests by information set: the weak form covers only past prices and returns, the semi-strong form all public information, and the strong form any information, including private. Event studies of splits, earnings and offerings were the semi-strong tests.'
