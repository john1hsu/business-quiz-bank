true_statement: Jensen argued in 2005 that overvalued equity creates its own agency costs, as managers unable to justify an inflated share price may make value-destroying acquisitions or manage earnings.
false_statement: Jensen argued in 2005 that undervalued equity creates its own agency costs, as managers unable to lift a depressed share price may make value-destroying acquisitions or manage earnings.
explanation: An inflated price sets expectations the business cannot meet, and big equity stakes make managers reluctant to let it correct. This revised his earlier enthusiasm for heavy equity-based pay.
