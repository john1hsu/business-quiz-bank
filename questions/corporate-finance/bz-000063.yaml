topic: Leveraged Buyout
topic_type: Practice
true_statement: In the RJR Nabisco buyout, the roughly $10 billion premium paid to public shareholders shows that sellers can capture much of an LBO's gains when sponsors bid aggressively.
false_statement: In the RJR Nabisco buyout, the roughly $10 billion premium paid to public shareholders shows that sponsors keep most of an LBO's gains even when they bid aggressively.
explanation: Value created by the buyout has to be split between the sellers and the sponsor. In KKR's 1988 deal, the bidding war pushed much of that value to RJR's public shareholders through the premium.
