topic: 'Asset Pricing: Valuing Risky Payoffs with Stochastic Discount Factors'
topic_type: Field
true_statement: Harrison and Kreps formalised the link between no arbitrage and consistent prices in multiperiod markets in a 1979 paper, the basis for risk-neutral valuation of derivatives.
false_statement: Hansen and Jagannathan formalised the link between no arbitrage and consistent prices in multiperiod markets in a 1979 paper, the basis for risk-neutral valuation of derivatives.
explanation: Harrison and Kreps's Journal of Economic Theory paper on martingales and arbitrage underpins the field's dependence on the no-arbitrage principle. Hansen and Jagannathan came later, around 1990-1991, with bounds that security market data place on any candidate discount factor.
