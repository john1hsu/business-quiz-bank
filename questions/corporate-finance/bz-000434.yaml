topic: 'Net Present Value: Discounting Future Cash Flows to Evaluate Investments'
topic_type: Metric
true_statement: Irving Fisher's The Theory of Interest (1930) argued that borrowing and lending reshape the timing of an income stream but not its present value.
false_statement: Irving Fisher's The Theory of Interest (1930) argued that borrowing and lending reshape the present value of an income stream but not its timing.
explanation: Because financing only shifts when money arrives, an owner should first pick the use with the highest present worth and finance it separately. That separation underlies the modern NPV rule.
