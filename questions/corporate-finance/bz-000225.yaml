topic: Efficient Market Hypothesis
topic_type: Theory
true_statement: Every test of market efficiency also tests an assumed model of expected returns, so an apparent anomaly may reflect a bad risk model rather than an inefficient market.
false_statement: Every test of market efficiency also tests an assumed model of expected returns, so an apparent anomaly proves an inefficient market whatever risk model is used.
explanation: 'This is Fama''s joint-hypothesis problem: returns are only ''abnormal'' relative to a model such as CAPM. If that model misprices risk, an anomaly can be a modelling error, so no single test settles efficiency.'
