true_statement: Froot and Dabora found that each of the Royal Dutch and Shell twin shares moved with the market where it traded most, despite pooled cash flows.
false_statement: Froot and Dabora found that each of the Royal Dutch and Shell twin shares moved with its own company's earnings, despite pooled cash flows.
explanation: Because the twins shared cash flows at a fixed ratio, their prices should have moved in lockstep. The persistent, location-driven gaps are a classic anomaly for efficient markets and a showcase for the limits of arbitrage.
