topic: Weighted Average Cost of Capital
topic_type: Metric
true_statement: In Graham and Harvey's February 1999 survey of 392 CFOs, 73.5% always or almost always used CAPM to estimate the cost of equity.
false_statement: In Graham and Harvey's February 1999 survey of 392 CFOs, 73.5% always or almost always used a constant-growth dividend model to estimate the cost of equity.
explanation: CAPM gave firms a common way to estimate the equity term, which helped make WACC standard practice. The constant-growth dividend model is an alternative input, and in OpenStax's example switching to it moved WACC by more than half a point.
