true_statement: Graham and Harvey's CFO survey found financial flexibility and credit ratings were the main concerns when issuing debt, while EPS dilution weighed most when issuing equity.
false_statement: Graham and Harvey's CFO survey found EPS dilution was the main concern when issuing debt, while financial flexibility and credit ratings weighed most when issuing equity.
explanation: Executives care about keeping spare borrowing capacity and protecting their rating when they borrow, and about diluting earnings per share when they sell stock. The survey also found little sign that CFOs consciously weigh many mechanisms in academic models.
