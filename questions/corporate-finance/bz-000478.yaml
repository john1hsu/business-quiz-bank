id: bz-000478
area: corporate-finance
kind: mechanism
topic: 'Discounted Cash Flow (DCF) Valuation: Valuing a Firm from Its Expected Future Cash Flows'
topic_type: Framework
true_statement: A firm-level DCF discounts free cash flow to the firm at the WACC, while an equity DCF discounts free cash flow to equity at the cost of equity.
false_statement: A firm-level DCF discounts free cash flow to the firm at the cost of equity, while an equity DCF discounts free cash flow to equity at the WACC.
explanation: Cash flow to the firm is measured before debt payments and so belongs to all capital providers, which is why it takes the blended WACC; cash flow to equity is what remains after debt, so it takes the cost of equity. Done consistently, both routes reach the same equity value once debt is subtracted from firm value.
