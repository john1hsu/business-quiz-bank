topic: 'Capital Asset Pricing Model: Pricing Systematic Risk'
topic_type: Theory
true_statement: In the CAPM, only systematic risk earns a reward, because company-specific risk cancels out in a diversified portfolio.
false_statement: In the CAPM, only company-specific risk earns a reward, because systematic risk cancels out in a diversified portfolio.
explanation: Diversification can wash out risks peculiar to one firm but not market-wide swings, so investors are paid only for bearing the latter. Beta measures that market exposure, which is why it is the model's single risk input.
