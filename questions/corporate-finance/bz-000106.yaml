id: bz-000106
area: corporate-finance
kind: mechanism
topic: Arbitrage
topic_type: Concept
true_statement: Black-Scholes combines a stock and its options into a riskless portfolio that must earn the risk-free rate, so no estimate of a risk premium is needed.
false_statement: Black-Scholes combines a stock and its options into a riskless portfolio that must earn the market's expected return, so an estimate of the risk premium is needed.
explanation: If the hedged portfolio earned more than the risk-free rate, arbitrage would erase the excess. Continuous rebalancing turns that argument into a differential equation whose solution is the formula, with no view on investors' risk attitudes required.
