kind: mechanism
topic: 'Net Present Value: Discounting Future Cash Flows to Evaluate Investments'
topic_type: Metric
true_statement: NPV and IRR give the same accept-or-reject answer for independent projects, but can rank mutually exclusive projects differently.
false_statement: NPV and IRR give the same ranking for mutually exclusive projects, but can disagree on whether to accept independent projects.
explanation: A positive NPV always means the IRR exceeds the discount rate, so single go/no-go decisions agree. When choosing one of several projects, NPV counts dollars of value and IRR a percentage, so a big project and a small one can swap places.
