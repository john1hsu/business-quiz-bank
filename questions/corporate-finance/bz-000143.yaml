id: bz-000143
area: corporate-finance
kind: mechanism
topic: Weighted Average Cost of Capital
topic_type: Metric
true_statement: In the WACC formula, the cost of debt is multiplied by (1 − T) because interest is tax-deductible, making borrowing cheaper than its stated rate.
false_statement: In the WACC formula, the cost of equity is multiplied by (1 − T) because dividends are tax-deductible, making equity cheaper than its stated rate.
explanation: The tax adjustment applies only to the debt term, since interest payments reduce taxable income. Common equity enters at its full required return, with the debt, preferred and equity weights summing to 100%.
