topic: 'Capital Asset Pricing Model: Pricing Systematic Risk'
topic_type: Theory
true_statement: William Sharpe published the capital asset pricing model in The Journal of Finance in 1964, building on portfolio theory Harry Markowitz introduced in 1952.
false_statement: William Sharpe published the capital asset pricing model in The Journal of Finance in 1964, building on portfolio theory Merton Miller introduced in 1952.
explanation: Markowitz's 1952 portfolio theory showed how diversification reduces risk; Sharpe asked what that implies for prices in equilibrium. Miller shared the 1990 Nobel with both men, but for corporate finance work, not portfolio theory.
