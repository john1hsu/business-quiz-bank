true_statement: Modigliani and Miller argued that once asset returns are uncertain, profit maximization loses operational meaning, so they proposed market-value maximization as the criterion.
false_statement: Modigliani and Miller argued that once asset returns are uncertain, market-value maximization loses operational meaning, so they proposed profit maximization as the criterion.
explanation: Under uncertainty there is no single profit figure to maximize, but a market value prices that uncertainty. Their 1958 article made value maximization the workable objective that modern corporate finance still uses.
