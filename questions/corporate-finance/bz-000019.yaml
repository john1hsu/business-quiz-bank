true_statement: Franco Modigliani and Merton Miller published their capital structure irrelevance result in the American Economic Review in 1958.
false_statement: Franco Modigliani and Merton Miller published their capital structure irrelevance result in the American Economic Review in 1972.
explanation: Their June 1958 paper on the cost of capital launched modern corporate finance; follow-up essays came in 1963 and 1966. Modigliani won the Nobel prize in 1985 and Miller shared it in 1990.
