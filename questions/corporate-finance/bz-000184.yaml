true_statement: In 2024, S&P 500 companies spent a record $942.5 billion on buybacks, well above the $629.6 billion they paid out in dividends.
false_statement: In 2024, S&P 500 companies paid out a record $942.5 billion in dividends, well above the $629.6 billion they spent on buybacks.
explanation: Large U.S. firms now return more cash through repurchases than through dividends, a combined $1.572 trillion in 2024. This fits survey evidence that firms keep a stable dividend they are reluctant to cut and flex buybacks with cash flow and valuation.
