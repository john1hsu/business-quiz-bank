topic: 'Net Present Value: Discounting Future Cash Flows to Evaluate Investments'
topic_type: Metric
true_statement: Christensen, Kaufman and Shih argued NPV as commonly used understates innovation's value, since the do-nothing baseline wrongly assumes current performance will persist.
false_statement: Christensen, Kaufman and Shih argued NPV as commonly used overstates innovation's value, since the do-nothing baseline wrongly assumes current performance will decline.
explanation: If rivals keep moving, not investing usually means falling behind, not standing still. Comparing a new project with an unrealistically healthy status quo makes the project look worse than it is.
