true_statement: In 1990 Jensen and Kevin Murphy estimated a typical CEO's wealth moved only $3.25 for each $1,000 change in shareholder wealth, and urged more equity pay.
false_statement: In 1990 Jensen and Kevin Murphy estimated a typical CEO's wealth moved about $325 for each $1,000 change in shareholder wealth, and urged less equity pay.
explanation: They judged such weak sensitivity too small to motivate value creation. Murphy later recalled that firms layered options on top of salary rather than swapping one for the other, which drove CEO pay sharply higher.
