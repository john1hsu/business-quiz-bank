id: bz-000021
area: corporate-finance
kind: application
topic: Modigliani-Miller Theorem
topic_type: Theory
true_statement: MM implies that a debt-funded recapitalization adds value only through a friction such as a tax shield or lower agency costs, not through leverage itself.
false_statement: MM implies that a debt-funded recapitalization adds value through leverage itself, because debt is cheaper than equity.
explanation: In MM's frictionless world, investors can create leverage themselves, so they won't pay a premium for a firm doing it. Practitioners use the theorem to demand that any value claim name the imperfection responsible, such as taxes, distress costs or agency effects.
