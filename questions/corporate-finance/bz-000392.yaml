topic: 'Capital Structure: The Mix of Debt and Equity Financing'
topic_type: Concept
true_statement: Under the pecking order theory, firms use internal funds first, then debt, and issue equity last, since investors read a stock issue as a sign of overvalued shares.
false_statement: Under the pecking order theory, firms use internal funds first, then equity, and issue debt last, since investors read a bond issue as a sign of overvalued shares.
explanation: 'Myers tied the ordering to asymmetric information: managers know more than outsiders, so selling stock signals they think it is overpriced. A firm''s debt ratio then reflects its past need for outside money, not a target.'
