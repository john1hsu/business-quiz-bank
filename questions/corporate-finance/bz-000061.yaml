true_statement: In buyouts, governance engineering means installing smaller, more active boards and replacing underperforming executives quickly.
false_statement: In buyouts, operational engineering means installing smaller, more active boards and replacing underperforming executives quickly.
explanation: Sponsors are said to add value through financial, governance and operational engineering. Board and executive changes are governance engineering; operational engineering, more prominent since the 2000s, means bringing industry and operating expertise to the business.
