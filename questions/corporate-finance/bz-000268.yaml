true_statement: Graham and Harvey's 2001 CFO survey found that smaller firms lean more on the payback period, while large firms rely heavily on present-value methods.
false_statement: Graham and Harvey's 2001 CFO survey found that large firms lean more on the payback period, while smaller firms rely heavily on present-value methods.
explanation: Payback ignores cash flows after the cutoff and the time value of money, yet it is simple, so smaller firms with less finance staff used it more. Large firms were closer to textbook practice, though many still used one company-wide discount rate.
