true_statement: The 2013 Nobel committee noted that asset prices are essentially unpredictable over days or weeks but show predictable patterns over several years.
false_statement: The 2013 Nobel committee noted that asset prices are essentially unpredictable over several years but show predictable patterns over days or weeks.
explanation: Short-run unpredictability supports Fama, while Shiller showed that high price-to-dividend ratios tend to precede weak returns over long horizons. Researchers still disagree whether that long-run pattern reflects time-varying risk or psychology and limits to arbitrage.
