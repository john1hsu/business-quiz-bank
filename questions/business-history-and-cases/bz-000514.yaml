true_statement: Takahiro Fujimoto argued Toyota's 2010 recall defects were mainly design-quality problems, so they did not discredit the Toyota Production System itself.
false_statement: Takahiro Fujimoto argued Toyota's 2010 recall defects were mainly manufacturing-quality problems, so they discredited the Toyota Production System itself.
explanation: Fujimoto traced the problems to Toyota taking on more lines, global models and complex vehicles than its capabilities could handle, and to managers drifting from the Toyota Way. Because the faults lay in design rather than on the shop floor, the production system was not the culprit.
