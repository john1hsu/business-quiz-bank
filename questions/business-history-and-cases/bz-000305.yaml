true_statement: From 1982 to 2002, Walmart accounted for almost half the productivity growth in U.S. general merchandise retailing, by Emek Basker's figures.
false_statement: From 1982 to 2002, Walmart accounted for almost a tenth of the productivity growth in U.S. general merchandise retailing, by Emek Basker's figures.
explanation: Sales per worker rose 54.5 log points at Walmart U.S. versus 18.5 for the rest of the sector. Basker credits technology such as bar-code readers and Retail Link, plus scale.
