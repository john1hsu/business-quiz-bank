topic: Apple iPhone Launch
topic_type: Case
true_statement: Because it planned free future software features, Apple recognized iPhone revenue straight-line over an estimated 24-month life rather than at the point of sale.
false_statement: Because it planned free future software features, Apple recognized iPhone revenue at the point of sale rather than straight-line over an estimated 24-month life.
explanation: Apple used subscription accounting because buyers would receive future features at no charge, so part of the sale was not yet delivered. Spreading handset revenue and cost of sales over 24 months matched them to that ongoing obligation.
