true_statement: The Intel Inside program, launched in 1991, subsidized PC makers that put the Intel logo on their machines and in their advertising.
false_statement: The Intel Inside program, launched in 1991, charged PC makers a fee to put the Intel logo on their machines and in their advertising.
explanation: Intel was known to manufacturers but invisible to consumers, so it paid co-op subsidies to get its brand in front of buyers. By the end of 1992 over 500 OEMs had joined, making it the textbook case of ingredient branding.
