topic: 'Blockbuster: Rise and Fall of the Video Rental Chain'
topic_type: Case
true_statement: Birger Wernerfelt uses Blockbuster and Netflix to argue an underdog wins when its model does not provoke imitation and the incumbent reacts slowly and invests less.
false_statement: Birger Wernerfelt uses Blockbuster and Netflix to argue an underdog wins when its model provokes fast imitation and the incumbent overinvests in copying it.
explanation: Netflix's store-free, mail-based subscription model was awkward for a chain built on stores and new releases to copy, so Blockbuster moved late and cautiously. Wernerfelt's advice to incumbents is to test alternative models in small parts of the business.
