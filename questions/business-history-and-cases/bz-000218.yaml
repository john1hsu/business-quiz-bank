true_statement: Southwest Airlines, founded by Rollin King and Herb Kelleher, began scheduled service in 1971 with three Boeing 737s linking Dallas, Houston and San Antonio.
false_statement: Southwest Airlines, founded by Rollin King and Herb Kelleher, began scheduled service in 1981 with three Boeing 737s linking Dallas, Houston and San Antonio.
explanation: Founded in 1966, Southwest started as an intrastate Texas carrier from Dallas's Love Field after legal battles with incumbents delayed its 1971 launch. It expanded beyond Texas only after federal deregulation in 1978.
