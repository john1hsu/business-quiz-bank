topic: 'Scientific Management: Taylor''s System of Task Study and Standardized Work'
topic_type: Practice
true_statement: Taylor saw soldiering, the deliberate holding down of output, mainly as workers' systematic defence against piece-rate cuts and job losses.
false_statement: Taylor saw soldiering, the deliberate holding down of output, mainly as workers' natural laziness rather than a defence against piece-rate cuts.
explanation: Taylor granted some natural inclination to take it easy, but blamed most restriction of output on workers protecting themselves from rate cuts and layoffs. That is why he argued higher productivity had to benefit both employer and employee.
