true_statement: Critics argue IBM's turnaround looks less impressive than Gerstner's memoir suggests, since a pension-plan change and large buybacks flattered results.
false_statement: Critics argue IBM's turnaround looks more impressive than Gerstner's memoir suggests, since a pension-plan change and large buybacks depressed results.
explanation: The case leans heavily on insider accounts such as Who Says Elephants Can't Dance?. Skeptics add that shareholder-return figures look large partly because 1993 was such a low starting point.
