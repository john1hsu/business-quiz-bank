true_statement: Intel regained manufacturing parity with Japanese chipmakers by the early 1990s by adopting Japanese production methods and standardizing its factories.
false_statement: Intel regained manufacturing parity with Japanese chipmakers by the early 1990s by outsourcing wafer fabrication to Japanese partners.
explanation: Lécuyer shows that after 1985 management treated manufacturing weakness as a survival threat. Engineers adopted Japanese routines, put fabrication on a more scientific footing and improved transfer from development to production, a reform that took most of a decade.
