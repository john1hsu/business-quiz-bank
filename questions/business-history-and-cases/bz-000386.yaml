topic: 'Enron Scandal: Off-Balance-Sheet Fraud and the 2001 Collapse of Enron'
topic_type: Case
true_statement: The SEC alleged that Enron's CFO used special purpose entities he secretly controlled so that Enron overstated net income and understated debt.
false_statement: The SEC alleged that Enron's CFO used special purpose entities he secretly controlled so that Enron understated net income and overstated debt.
explanation: A properly independent SPE can keep assets and debt off the sponsor's balance sheet. Because Fastow controlled vehicles like Chewco and LJM, or they were guaranteed against loss, they were not truly independent, so the deals flattered profits and hid borrowing.
