topic: Kodak Decline
topic_type: Case
true_statement: Kodak engineer Steven Sasson built a digital camera prototype in 1975, which Kodak patented in 1978 but never produced.
false_statement: Fujifilm engineer Steven Sasson built a digital camera prototype in 1975, which Fujifilm patented in 1978 but never produced.
explanation: The device stored 100 × 100 pixel black-and-white images on cassette tape and took about 23 seconds per shot. That Kodak invented the technology that undermined it is why the case is a strategy-teaching staple.
