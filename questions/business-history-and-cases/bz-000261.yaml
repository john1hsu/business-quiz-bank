topic: Netflix's Shift from DVD Rental to Streaming
topic_type: Case
true_statement: Netflix began in 1997 as an online DVD rental service charging per rental, and by 2000 it offered unlimited rentals for a flat fee with no late fees.
false_statement: Netflix began in 1997 as an online DVD rental service charging a flat fee, and by 2000 it had switched to charging per rental with no late fees.
explanation: The move from per-rental pricing to a flat subscription with no due dates or late fees is the change usually credited with disrupting Blockbuster's store model. That subscription relationship later carried over to streaming.
