topic: Kodak Decline
topic_type: Case
true_statement: Kodak's 2007 move into consumer inkjet printers bet that people would keep printing photos even from digital cameras.
false_statement: Kodak's 2007 move into consumer inkjet printers bet that people would stop printing photos and view them on screens instead.
explanation: The bet extended Kodak's prints-and-consumables model into the digital era. Funding inkjet while closing film plants strained cash before the 2012 bankruptcy, and the assumption failed as photos moved to screens.
