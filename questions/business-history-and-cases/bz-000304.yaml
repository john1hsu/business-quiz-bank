kind: mechanism
topic: Walmart
topic_type: Company
true_statement: Thomas Holmes inferred the value of store density from how much sales cannibalization among neighbouring stores Walmart accepted, and found benefits well beyond cheaper trucking.
false_statement: Thomas Holmes inferred the value of store density from how much sales cannibalization among neighbouring stores Walmart accepted, and found benefits limited mainly to cheaper trucking.
explanation: Walmart kept opening stores close to existing ones even though they took sales from each other, which only makes sense if clustering saves a lot. Holmes concluded those density savings were large and broad, not just shorter delivery routes.
