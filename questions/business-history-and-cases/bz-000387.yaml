topic: 'Enron Scandal: Off-Balance-Sheet Fraud and the 2001 Collapse of Enron'
topic_type: Case
true_statement: A 2002 Senate subcommittee found Enron's board had waived its code of conduct so CFO Andrew Fastow could run the LJM partnerships.
false_statement: A 2002 Senate subcommittee found Enron's board had waived its code of conduct so CEO Jeffrey Skilling could run the LJM partnerships.
explanation: Letting the finance chief run funds that traded with Enron was a glaring conflict of interest. The subcommittee cited it among the board's failures of fiduciary duty and rejected directors' claims that they had simply relied on advisers.
