true_statement: On September 5, 2007, about ten weeks after the U.S. launch, Apple cut the 8GB iPhone's price from $599 to $399.
false_statement: On September 5, 2007, about ten weeks after the U.S. launch, Apple cut the 8GB iPhone's price from $599 to $499.
explanation: Apple dropped the 8GB model by $200 and let the $499 4GB model sell out, expecting its one-millionth sale within the month. Critics count cutting price so soon after a premium launch among the launch's missteps.
