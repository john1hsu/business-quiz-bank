topic: Netflix's Shift from DVD Rental to Streaming
topic_type: Case
true_statement: After Netflix split DVD and streaming into separate plans in 2011, it announced a separate DVD brand, Qwikster, then withdrew it after a very negative reaction and significant cancellations.
false_statement: After Netflix split DVD and streaming into separate plans in 2011, it launched a separate DVD brand, Qwikster, and kept it running until it stopped mailing discs in 2023.
explanation: The price rise and the brand split landed in the same quarter, and researchers put the subscriber loss above 800,000. Netflix instead let DVD shrink inside a separate segment until it ended mailing discs in September 2023.
