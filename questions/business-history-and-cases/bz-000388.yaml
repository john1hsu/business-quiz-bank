true_statement: By an October 2000 Enron presentation, about $27 billion of its roughly $60 billion in assets sat with unconsolidated affiliates.
false_statement: By an October 2000 Enron presentation, about $7 billion of its roughly $60 billion in assets sat with unconsolidated affiliates.
explanation: Nearly half of Enron's assets were held outside its consolidated statements, and its annual reports listed almost 3,000 related entities. That scale is why off-balance-sheet vehicles were central to the fraud.
