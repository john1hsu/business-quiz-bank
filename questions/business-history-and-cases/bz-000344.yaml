true_statement: Frederick Taylor began timing shop tasks with a stopwatch at Midvale Steel in 1881, work that became the base of scientific management.
false_statement: Frederick Taylor began timing shop tasks with a stopwatch at Bethlehem Steel in 1881, work that became the base of scientific management.
explanation: Taylor joined Midvale as a laborer in 1878 and started his time studies there. Bethlehem Steel came later, as his biggest consulting client, where he ran the shoveling and pig-iron studies.
