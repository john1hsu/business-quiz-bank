true_statement: Burgelman found that Intel's resource-allocation rules shifted fab capacity toward microprocessors before top management formally changed strategy.
false_statement: Burgelman found that Intel's top management formally changed strategy toward microprocessors before its resource-allocation rules shifted any fab capacity.
explanation: Allocating scarce capacity by profitability moved the firm out of DRAMs from the middle up, while the stated strategy lagged. That made Intel a standard example of strategy emerging bottom-up through an internal selection environment.
