true_statement: Gittell's nine-site study of flight departures linked stronger relational coordination across functions to fewer complaints, late arrivals and lost bags.
false_statement: Gittell's nine-site study of flight departures linked stronger centralized supervision of each function to fewer complaints, late arrivals and lost bags.
explanation: Relational coordination means shared goals, shared knowledge and mutual respect across functions, and it also went with less staff time per passenger. Gittell offers it as a people-based complement to Porter's activity-system account of Southwest's advantage.
