id: bz-000263
area: business-history-and-cases
kind: figure
topic: Netflix's Shift from DVD Rental to Streaming
topic_type: Case
true_statement: Netflix's fixed-fee content licensing commitments grew from about $3.9 billion at the end of 2011 to $21.7 billion at the end of 2023.
false_statement: Netflix's fixed-fee content licensing commitments shrank from about $21.7 billion at the end of 2011 to $3.9 billion at the end of 2023.
explanation: Streaming replaced owned DVD inventory with multi-year licensing obligations, so the model's payoff became exposed to content costs the disc business never carried. The rising commitments are the economic critique of the shift.
