topic: Kodak Decline
topic_type: Case
true_statement: Vinokurova and Kapoor argue Kodak saw digital coming and invested in it, but film's exceptional profitability set aspirations few new ventures could meet.
false_statement: Vinokurova and Kapoor argue Kodak ignored digital and never invested in it, because film's exceptional profitability made new ventures seem unnecessary.
explanation: Kodak tried Photo CD, APS, digital cameras and inkjet. Uncertain timing of consumer adoption and an illusion of resilience from strong film sales made unprofitable digital bets hard to sustain, a richer story than simple myopia.
