true_statement: In 2025 the Toyota group sold a record 11.3 million vehicles, staying the world's top-selling automaker for a sixth consecutive year.
false_statement: In 2025 the Toyota group sold a record 11.3 million vehicles, regaining the title of world's top-selling automaker from Volkswagen Group.
explanation: The calendar-2025 group total counts Daihatsu and Hino and put Toyota well ahead of Volkswagen Group's just under 9 million. Toyota first passed General Motors as the largest automaker in 2008, and by 2025 it had led for six straight years.
