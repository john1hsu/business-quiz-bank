topic: 'Toyota: From Automatic Looms to the World''s Largest Automaker'
topic_type: Company
true_statement: Researchers credit NUMMI's turnaround less to copying Japan than to a hybrid culture of job security, flat wages and a gradual rollout of Toyota's system.
false_statement: Researchers credit NUMMI's turnaround less to a hybrid culture of job security and flat wages than to replacing GM's former workforce with new hires.
explanation: Toyota ran the reopened Fremont plant largely with GM's old workforce, yet reached Toyota's quality level by 1987. The researchers point to a no-layoff policy, a flat wage structure, interdependence built into the production system and a deliberately gradual rollout.
