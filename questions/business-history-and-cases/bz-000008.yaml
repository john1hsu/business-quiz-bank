topic: Ford Model T
topic_type: Case
true_statement: After Ford's 1914 five-dollar day, annual worker turnover fell from 370 percent in 1913 to 54 percent in 1914.
false_statement: After Ford's 1914 five-dollar day, annual worker turnover rose from 54 percent in 1913 to 370 percent in 1914.
explanation: In 1913 Ford hired over 50,000 men to keep about 13,600 on the payroll. Raff and Summers found the near-doubled wage slashed turnover and absenteeism, which is why the case is classic evidence for efficiency-wage theory.
