topic: Ford Model T
topic_type: Case
true_statement: In the 1920s General Motors overtook the Model T by offering annual model changes, trade-ins and installment buying.
false_statement: In the 1920s General Motors overtook the Model T by offering a single unchanging model at an ever-lower price.
explanation: Ford bet on one nearly unchanged car built at huge volume; that was Ford's strategy, not GM's. Under Alfred Sloan, GM competed on variety and novelty, and Chevrolet was outselling the Model T by early 1927.
