topic: Apple iPhone Launch
topic_type: Case
true_statement: West and Mace argue the iPhone succeeded by extending the existing wired internet to phones, making real web browsing central to its strategy.
false_statement: West and Mace argue the iPhone succeeded by adopting the operators' walled-garden model of mobile data, making carrier-curated services central to its strategy.
explanation: In their peer-reviewed study, iPhone owners used mobile web browsing far more than other phone owners in the U.S. and Europe. Treating the phone as a window onto the real internet challenged the operator-led walled garden the industry had pursued for two decades.
