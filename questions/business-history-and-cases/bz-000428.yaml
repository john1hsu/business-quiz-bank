true_statement: Under Alfred Sloan, GM's car divisions each targeted a different price band and ran their own operations, while a strong head office set company-wide policy.
false_statement: Under Alfred Sloan, GM's car divisions each targeted a different price band and set company-wide policy, while a small head office ran their day-to-day operations.
explanation: Sloan paired operating autonomy in the divisions with central financial and policy control. Chandler later held up this design as the model multidivisional form, freeing top executives for long-range planning.
