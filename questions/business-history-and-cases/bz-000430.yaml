true_statement: GM's share of the U.S. vehicle market fell from 62.6 percent in 1980 to 19.8 percent in 2009, the year it filed for Chapter 11.
false_statement: GM's share of the U.S. vehicle market fell from 42.6 percent in 1980 to 29.8 percent in 2009, the year it filed for Chapter 11.
explanation: The collapse spans three decades of losing ground to rivals with better operating practices. GM filed in June 2009, and the U.S. Treasury took a 60.8 percent stake in the new company that bought most of its assets.
