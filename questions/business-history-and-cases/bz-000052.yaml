true_statement: In 1993 Gerstner reversed IBM's move toward autonomous, spin-off-ready business units and kept the company whole as an integrated IT provider.
false_statement: In 1993 Gerstner accelerated IBM's move toward autonomous, spin-off-ready business units and broke the company into independent firms.
explanation: He reasoned that customers needed someone to assemble systems from many vendors, and IBM's breadth suited that role. He later called keeping IBM together his most important decision.
