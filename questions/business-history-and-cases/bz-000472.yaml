true_statement: Blockbuster dropped late fees at its U.S. company stores from January 1, 2005, giving up an estimated $400-450 million of revenue for 2005.
false_statement: Blockbuster dropped late fees at its U.S. company stores from January 1, 2005, giving up an estimated $40-45 million of revenue for 2005.
explanation: Late fees were a major profit stream, also worth an estimated $250-300 million of 2005 operating income, which shows how costly it was to answer Netflix's no-late-fee subscription. Blockbuster budgeted about $50 million just to launch the change.
