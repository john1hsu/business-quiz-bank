topic: Ford Model T
topic_type: Case
true_statement: By early 1914, Ford's moving assembly lines finished a Model T chassis every 93 minutes, versus about 12½ hours with stationary assembly.
false_statement: By early 1914, Ford's moving assembly lines finished a Model T chassis every 93 minutes, versus about 3 hours with stationary assembly.
explanation: Moving the work to the worker, tried first on flywheel magnetos in 1913 and then the whole chassis, cut assembly time roughly eightfold. The savings funded price cuts that expanded demand.
