true_statement: Historian Charles Wrege argued that Taylor's assistants largely ran the pig-iron studies and that Morris L. Cooke substantially drafted Taylor's 1911 book.
false_statement: Historian Charles Wrege argued that Taylor's assistants largely ran the pig-iron studies and that Henry Gantt substantially drafted Taylor's 1911 book.
explanation: After decades in the Taylor archives, Wrege concluded the famous anecdotes in The Principles of Scientific Management were embellished and the text owed much to Cooke. Gantt was a Taylor associate known for his progress chart, not for writing the book.
