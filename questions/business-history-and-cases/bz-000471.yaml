topic: 'Blockbuster: Rise and Fall of the Video Rental Chain'
topic_type: Case
true_statement: Former Blockbuster CEO John Antioco disputed in 2022 the story that the chain spurned buying Netflix for $50 million around 2002, saying serious merger talks came only in early 2007.
false_statement: Netflix co-founder Reed Hastings disputed in 2022 the story that Blockbuster spurned buying Netflix for $50 million around 2002, saying serious merger talks came only in early 2007.
explanation: Hastings is the one who tells the $50 million story; Antioco says no serious talks happened then and that discussions came after Total Access had taken share from Netflix. The dispute complicates the simple tale that Blockbuster just missed the internet.
