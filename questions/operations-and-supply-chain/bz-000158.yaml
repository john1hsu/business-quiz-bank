topic: Material Requirements Planning
topic_type: Practice
true_statement: 'MRP was designed for dependent demand: once finished-goods quantities are fixed, the quantity of every component follows by calculation.'
false_statement: 'MRP was designed for independent demand: once finished-goods quantities are fixed, the quantity of every component follows by calculation.'
explanation: Independent demand is customer orders and forecasts, captured in the master production schedule. Component needs depend on that schedule through the bill of materials, which is why they can be calculated rather than forecast.
