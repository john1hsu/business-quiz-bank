true_statement: 'Ohno distinguished three forms of loss: muda is waste, muri is overburden and mura is unevenness.'
false_statement: 'Ohno distinguished three forms of loss: muda is waste, muri is unevenness and mura is overburden.'
explanation: Muda covers activities that add no value, such as the seven wastes. Muri is straining people or machines beyond capacity, and mura is irregular flow; uneven loads tend to create both overburden and waste.
