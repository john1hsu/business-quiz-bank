id: bz-000516
area: operations-and-supply-chain
kind: mechanism
topic: 'Just-in-Time (JIT): Synchronizing Supply with Demand to Minimize Inventory'
topic_type: Practice
true_statement: In just-in-time, takt time sets the pace of work to the rate of customer demand, while production leveling (heijunka) keeps the load on each process smooth.
false_statement: In just-in-time, takt time sets the pace of work to the full capacity of the machines, while production leveling (heijunka) keeps the load on each process smooth.
explanation: JIT builds to the pace of sales, so takt time is derived from demand, not from how fast equipment can run; running to capacity would just pile up inventory. Heijunka is the foundation under pull, flow and takt because it evens out the demand each step sees.
