area: operations-and-supply-chain
kind: mechanism
topic: 'Mass Production: Interchangeable Parts, the Moving Assembly Line and High-Volume Standardization'
topic_type: Practice
true_statement: Piore and Sabel describe mass production as building precision into special-purpose machines rather than workers, so it pays off only with a large, stable market.
false_statement: Piore and Sabel describe mass production as building precision into highly skilled workers rather than machines, so it pays off even in small, unstable markets.
explanation: 'Product-specific machines run by low-skill workers are a bet on volume: the tooling only earns back its cost if demand is big and steady. That is why they treat market size as the binding limit on the division of labour, and why craft skill is the opposite of the mass-production logic.'
