true_statement: Sabel and Zeitlin argue mass production was not industrialization's inevitable endpoint, since craft districts like Lyon silk competed through flexible specialization.
false_statement: Sabel and Zeitlin argue mass production was industrialization's inevitable endpoint, since craft districts like Lyon silk lost out once flexible specialization appeared.
explanation: The historians point to flexible, craft-based districts such as Lyon silk and Solingen cutlery that competed successfully, and conclude that mass production's dominance reflected political and strategic choices as much as pure efficiency.
