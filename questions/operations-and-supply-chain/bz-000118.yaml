true_statement: The term enterprise resource planning was coined by research firm Gartner in the early 1990s for integrated software reaching beyond the factory.
false_statement: The term enterprise resource planning was coined by software maker SAP in the early 1970s for integrated software reaching beyond the factory.
explanation: ERP grew out of MRP in the 1970s and MRP II after it, but the name came later, from an analyst firm describing cross-functional packages. SAP was founded in 1972, and its R/3 system arrived in 1992.
