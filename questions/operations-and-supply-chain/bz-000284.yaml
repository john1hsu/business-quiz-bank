true_statement: Ohno never used the word lean; John Krafcik coined it in 1988, and later writers generalized the Toyota Production System under that name.
false_statement: Ohno coined the word lean in his 1978 book Toyota Production System, and later writers generalized the system under that name.
explanation: The label came from Krafcik, not from Toyota. Scholars such as Michael Cusumano warn that generalizing TPS into lean can drift from Ohno's intent, for example by pushing zero buffer inventory into volatile settings.
