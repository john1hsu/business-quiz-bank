topic: 'Inventory Management: Order Quantities, Reorder Points and Safety Stock'
topic_type: Practice
true_statement: Chen, Frank and Wu found U.S. manufacturers with abnormally high inventories earned poor long-run stock returns, while the leanest firms earned only ordinary returns.
false_statement: Chen, Frank and Wu found U.S. manufacturers with abnormally high inventories earned poor long-run stock returns, while the leanest firms earned abnormally high returns.
explanation: Bloated stock was penalized, but going leanest did not earn a premium, which suggests cutting inventory pays only up to a point. The same 1981 to 2000 study found holding periods fell mostly through less work in process.
