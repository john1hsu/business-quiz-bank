topic: Bullwhip Effect in Supply Chains
topic_type: Concept
true_statement: The name bullwhip effect came from Procter & Gamble logistics executives who saw order swings for Pampers diapers grow at each step up the chain.
false_statement: The name bullwhip effect came from Hewlett-Packard logistics executives who saw order swings for Pampers diapers grow at each step up the chain.
explanation: P&G noticed that modest retail swings in Pampers sales became bigger swings in distributor orders and bigger still in P&G's own orders to suppliers. HP saw a similar cascade with printers, but the name came from P&G.
