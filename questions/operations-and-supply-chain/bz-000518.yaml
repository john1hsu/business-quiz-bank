id: bz-000518
area: operations-and-supply-chain
kind: application
topic: 'Just-in-Time (JIT): Synchronizing Supply with Demand to Minimize Inventory'
topic_type: Practice
true_statement: After the 2011 earthquake, Toyota asked suppliers to hold two to six months of semiconductors, which helped it keep building cars in the 2021 chip shortage.
false_statement: After the 2011 earthquake, Toyota asked suppliers to hold two to six days of semiconductors, which left it idling plants in the 2021 chip shortage.
explanation: Toyota flagged about 500 parts and materials as needing secure supply and kept strategic stock of long-lead chips. Mature JIT users buffer single-source, long-lead items rather than applying minimal inventory everywhere, which is why Toyota kept running while rivals idled.
