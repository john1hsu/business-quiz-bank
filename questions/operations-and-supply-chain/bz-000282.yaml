true_statement: Jidoka, one of the two pillars of the Toyota Production System, means machines stop and signal when they detect a defect.
false_statement: Just-in-time, one of the two pillars of the Toyota Production System, means machines stop and signal when they detect a defect.
explanation: Jidoka, automation with a human touch, keeps defects from flowing downstream. Just-in-time, the other pillar, is about producing only what is needed when it is needed.
