area: operations-and-supply-chain
kind: definition
topic: Kanban
topic_type: Practice
true_statement: Kanban is a pull system driven by actual consumption, in contrast to the forecast-driven push logic of material requirements planning.
false_statement: Kanban is a push system driven by a forecast schedule, much like the forecast-driven logic of material requirements planning.
explanation: Kanban orders replacement parts only as parts are used, so production follows real demand. MRP pushes work through the plant from a forecast-based plan; single-card kanban systems sit between the two.
