topic: Bullwhip Effect in Supply Chains
topic_type: Concept
true_statement: Cachon, Randall and Schmidt (2007) found that U.S. wholesale industries amplify volatility, while most retail and manufacturing industries do not.
false_statement: Cachon, Randall and Schmidt (2007) found that U.S. retail and manufacturing industries amplify volatility, while most wholesale industries do not.
explanation: 'Their industry-level data complicated the textbook story: seasonality matters, since highly seasonal industries tend to smooth production rather than amplify demand. Aggregate data can hide amplification individual firms still feel.'
