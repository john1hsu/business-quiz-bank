topic: Bullwhip Effect in Supply Chains
topic_type: Concept
true_statement: In the rationing game, buyers inflate orders when scarce supply is allocated in proportion to orders, so orders overstate true demand.
false_statement: In the rationing game, buyers shrink orders when scarce supply is allocated in proportion to orders, so orders understate true demand.
explanation: If a supplier hands out a shortage pro rata to orders, each buyer orders more than it needs to secure its share, sending a false signal upstream. Allocating by past sales instead of current orders removes the incentive.
