topic: 'Mass Production: Interchangeable Parts, the Moving Assembly Line and High-Volume Standardization'
topic_type: Practice
true_statement: Ford's first moving line, for flywheel magnetos in April 1913, cut the labour per unit from about 20 minutes to five minutes after successive adjustments.
false_statement: Ford's first moving line, for complete engines in April 1913, cut the labour per unit from about 20 minutes to five minutes after successive adjustments.
explanation: Highland Park tried the moving line first on a small subassembly, the flywheel magneto, before extending it to engines, transmissions and, in August 1913, the whole chassis. Starting small let Ford refine the method before scaling it.
