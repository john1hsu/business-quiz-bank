topic: 'Total Quality Management: Companywide Quality as a Management System'
topic_type: Practice
true_statement: Powell's 1995 study found TQM's visible tools, like quality training and benchmarking, generally gave no competitive advantage, while open culture, empowerment and executive commitment did.
false_statement: Powell's 1995 study found TQM's visible tools, like quality training and benchmarking, gave competitive advantage, while open culture, empowerment and executive commitment generally did not.
explanation: Tools are easy to copy, so they cannot set a firm apart; tacit cultural resources are hard to imitate. Powell concluded firms with those resources could outperform with or without the TQM label.
