topic: Malcolm Baldrige National Quality Award
topic_type: Award
true_statement: The US national quality award created by a 1987 law is named after Commerce Secretary Malcolm Baldrige, who died weeks before President Reagan signed the bill.
false_statement: The US national quality award created by a 1987 law is named after Treasury Secretary Malcolm Baldrige, who died weeks before President Reagan signed the bill.
explanation: Baldrige was Commerce Secretary and died in a rodeo accident in July 1987, so Congress renamed the proposed award for him. It answered a quality gap with Japanese manufacturers, and Motorola was among the first winners for 1988.
