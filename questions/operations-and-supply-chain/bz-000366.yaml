topic: 'Toyota Production System (TPS): Waste Elimination Through Just-in-Time Flow and Built-in Quality'
topic_type: Framework
true_statement: Spear and Bowen argued that TPS's tightly specified work makes it flexible, because each specification acts as a hypothesis that exposes problems.
false_statement: Spear and Bowen argued that TPS's loosely specified work makes it flexible, because workers are free to improvise around problems as they arise.
explanation: After studying over 40 plants, they said the system's real engine is four unwritten rules. Scripting work precisely means any deviation is visible at once, so it can be fixed and the standard improved.
