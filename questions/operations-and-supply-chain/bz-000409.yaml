topic: 'Lean Manufacturing: Eliminating Waste Across the Value Stream'
topic_type: Framework
true_statement: A study of 351 pharmaceutical plants found hard lean practices like just-in-time improved performance directly, while soft practices acted only as moderators.
false_statement: A study of 351 pharmaceutical plants found soft lean practices like empowerment improved performance directly, while hard practices acted only as moderators.
explanation: Just-in-time, TQM and total productive maintenance raised operational results on their own. Empowerment and visual management amplified those gains, whereas rigid standardization and heavy goal setting seemed to weaken them.
