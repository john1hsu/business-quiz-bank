true_statement: Hitt, Wu and Zhou found that ERP adopters' productivity rose during implementation and dipped afterwards.
false_statement: Hitt, Wu and Zhou found that ERP adopters' productivity dipped during implementation and rose afterwards.
explanation: Their 2002 study of SAP R/3 adopters also found higher productivity and a Tobin's q about 13% above non-adopters. The authors cautioned that long-run effects needed more post-implementation data and that the sample covered only one vendor.
