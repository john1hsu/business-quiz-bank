id: bz-000159
area: operations-and-supply-chain
kind: mechanism
topic: Material Requirements Planning
topic_type: Practice
true_statement: In MRP's offsetting step, each order is released one planned lead time before it is needed, and those releases become the next level's gross requirements.
false_statement: In MRP's netting step, each order is released one planned lead time before it is needed, and those releases become the next level's gross requirements.
explanation: MRP runs explosion, netting, lot sizing and offsetting level by level. Netting subtracts on-hand and scheduled inventory to get net requirements; offsetting is the step that shifts orders back in time by lead time.
