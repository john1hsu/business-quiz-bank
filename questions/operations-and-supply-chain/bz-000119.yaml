true_statement: Of the three ERP implementation activities, tailoring with custom code is the costliest and riskiest, so firms tend to favor process adaptation and configuration.
false_statement: Of the three ERP implementation activities, configuring parameters is the costliest and riskiest, so firms tend to favor tailoring with custom code.
explanation: Lorenzo, Kawalek and Wood-Harper distinguish redesigning processes, configuring the package and tailoring it. Custom code is expensive to build and maintain, which is why adopters usually bend their processes to the standard software instead.
