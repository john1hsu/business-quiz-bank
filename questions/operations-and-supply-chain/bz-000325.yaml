topic: 'Total Quality Management: Companywide Quality as a Management System'
topic_type: Practice
true_statement: The label Total Quality Management was first used by the U.S. Naval Air Systems Command to describe its Japanese-style improvement approach.
false_statement: The label Total Quality Management was first used by Japan's Union of Scientists and Engineers to describe its companywide improvement approach.
explanation: JUSE invited Deming to lecture in 1950 and created the Deming Prize, but the Japanese term was companywide quality control. The TQM name came later from the U.S. Navy.
