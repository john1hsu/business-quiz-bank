true_statement: In ABC analysis, about 20% of stock items carry roughly 80% of inventory value, while about half of items account for only around 5% of value.
false_statement: In ABC analysis, about 20% of stock items carry roughly 80% of inventory value, while about 5% of items account for around half of value.
explanation: 'ABC analysis applies the Pareto idea to stock: the few high-value A items get the closest monitoring and the most safety stock, and the many low-value C items get little attention. The point is to spend control effort where the money is.'
