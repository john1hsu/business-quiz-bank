topic: Bill of Materials
topic_type: Concept
true_statement: A 2009 MIT thesis found that inconsistent BOM structures across more than 50 Cisco business units led to product launch delays and higher support costs.
false_statement: A 2009 MIT thesis found that a single standard BOM structure across more than 50 Cisco business units led to product launch delays and higher support costs.
explanation: Each unit had developed product-level BOMs its own way, and the inconsistency carried real costs. The author proposed a standardized, criteria-based workflow, showing that BOM structure is an organizational problem as much as a technical one.
