kind: mechanism
topic: Bill of Materials
topic_type: Concept
true_statement: A summarized BOM collapses the product tree so each item appears once with its total quantity, which suits purchasing and costing.
false_statement: An indented BOM collapses the product tree so each item appears once with its total quantity, which suits purchasing and costing.
explanation: An indented, multilevel BOM keeps the family-tree shape, listing a shared part under every assembly that uses it. Collapsing that tree into totals per item is what makes the summarized view handy for buying and costing a plan.
