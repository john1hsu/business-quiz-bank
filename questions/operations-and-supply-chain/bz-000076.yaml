area: operations-and-supply-chain
kind: definition
topic: Bill of Materials
topic_type: Concept
true_statement: The engineering BOM reflects how parts relate to a product's functional design, while the manufacturing BOM reflects how they are actually assembled.
false_statement: The manufacturing BOM reflects how parts relate to a product's functional design, while the engineering BOM reflects how they are actually assembled.
explanation: The MBOM is derived from the EBOM and defines what to make, while a separate bill of process defines how. Keeping the two in step when designs change is a recurring product-data task.
