kind: mechanism
topic: Kanban
topic_type: Practice
true_statement: In a two-card kanban system, a withdrawal kanban lets the downstream stage take parts, and a production kanban authorizes upstream to replace them.
false_statement: In a two-card kanban system, a production kanban lets the downstream stage take parts, and a withdrawal kanban authorizes upstream to replace them.
explanation: Withdrawal (transport) cards control how much moves downstream; production cards tell the upstream process to make exactly what was removed. Together they pull material through the line and cap work in process.
