true_statement: A 2004 simulation found that with advance demand information, MRP-type push strategies achieved better inventory and service levels than kanban.
false_statement: A 2004 simulation found that with advance demand information, kanban achieved better inventory and service levels than MRP-type push strategies.
explanation: When future demand is visible, planning ahead pays off, and kanban showed significant inefficiencies in that study. The push-versus-pull verdict depends on demand visibility rather than favouring pull in all cases.
