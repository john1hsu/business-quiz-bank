topic: Kanban
topic_type: Practice
true_statement: Taiichi Ohno modelled Toyota's kanban system on American supermarkets, where shelves were refilled as customers took only what they needed.
false_statement: Taiichi Ohno modelled Toyota's kanban system on Ford's assembly lines, where shelves were refilled as workers took only what they needed.
explanation: Ohno went to the U.S. to study Ford's mass production but took his key idea from supermarkets, where restocking matched what was taken. That pull logic is the heart of kanban.
