true_statement: In the third quarter of fiscal 2001, Cisco recorded a $2.25 billion excess inventory charge after a sudden drop in demand left stock above its forecast needs.
false_statement: In the third quarter of fiscal 2001, Cisco recorded a $2.25 billion excess inventory charge after a sudden surge in demand left stock below its forecast needs.
explanation: Demand collapsed faster than Cisco's forecasts anticipated, so the inventory it had built was worth less than its book value; a $187 million benefit the next quarter only partly offset the charge. It shows how much inventory decisions rest on forecast quality.
