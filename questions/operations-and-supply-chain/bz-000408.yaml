topic: 'Lean Manufacturing: Eliminating Waste Across the Value Stream'
topic_type: Framework
true_statement: In Womack and Jones's five lean principles, the customer pulls production wherever continuous flow is not yet possible.
false_statement: In Womack and Jones's five lean principles, a forecast pushes production wherever continuous flow is not yet possible.
explanation: The principles run from specifying value and mapping the value stream to creating flow, then pull, then pursuing perfection. Pull means nothing is made until downstream demand asks for it, which keeps inventory from piling up.
