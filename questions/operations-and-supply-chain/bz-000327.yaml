true_statement: Hendricks and Singhal found quality-award winners showed no stock-price edge during implementation but significantly outperformed controls over the following five years.
false_statement: Hendricks and Singhal found quality-award winners outperformed controls during implementation but showed no stock-price edge over the following five years.
explanation: Mean gains in the later period were roughly 38% to 46% depending on the control group. The lag suggests TQM pays off slowly, which may explain why impatient programs were abandoned.
