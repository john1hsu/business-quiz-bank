topic: 'Business Ecosystem: Co-Evolving Communities of Firms Around a Shared Value Proposition'
topic_type: Concept
true_statement: James F. Moore introduced the business ecosystem in a 1993 Harvard Business Review article, arguing that rivalry increasingly occurs between whole ecosystems rather than single firms.
false_statement: Marco Iansiti introduced the business ecosystem in a 2004 Harvard Business Review article, arguing that rivalry increasingly occurs between whole ecosystems rather than single firms.
explanation: Moore's "Predators and Prey" borrowed from biology and cited contests such as Wal-Mart versus Kmart. Iansiti and Roy Levien came later, in 2004, extending the metaphor with the idea of a keystone firm that stabilizes the ecosystem.
