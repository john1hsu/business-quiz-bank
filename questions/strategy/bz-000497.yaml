topic: 'Resource-Based View: Firm Resources as the Source of Competitive Advantage'
topic_type: Theory
true_statement: In a VRIO analysis of Southwest Airlines, its culture supports a sustained advantage, while its on-time arrival capability is imitable and gives only a temporary edge.
false_statement: In a VRIO analysis of Southwest Airlines, its on-time arrival capability supports a sustained advantage, while its culture is imitable and gives only a temporary edge.
explanation: Southwest's culture passes every VRIO test because its history makes it hard to replicate. On-time performance is valuable and rare, but rivals can copy it, so it fails the imitability test and yields only a temporary advantage.
