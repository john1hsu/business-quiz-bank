topic: 'Business Ecosystem: Co-Evolving Communities of Firms Around a Shared Value Proposition'
topic_type: Concept
true_statement: Adner and Kapoor's study of lithography tools from 1962 to 2005 found hard upstream component challenges amplified early movers' advantages, while hard downstream complementor challenges erased them.
false_statement: Adner and Kapoor's study of lithography tools from 1962 to 2005 found hard downstream complementor challenges amplified early movers' advantages, while hard upstream component challenges erased them.
explanation: When complements downstream lag, adoption is slow and rivals get time to catch up, so being first buys little. Upstream bottlenecks instead reward the firm that solves them first, showing that first-mover value depends on where in the ecosystem the hard problem sits.
