topic: 'Scenario Planning: Strategy for Multiple Plausible Futures'
topic_type: Practice
true_statement: Pierre Wack set out Shell's scenario method in a 1985 Harvard Business Review article, after Shell's early-1970s scenarios had explored producers restricting oil supply.
false_statement: Pierre Wack set out Shell's scenario method in a 1965 Harvard Business Review article, after Shell's early-1960s scenarios had explored producers restricting oil supply.
explanation: Shell began long-term studies in 1965 and ran its first formal scenario round in 1971. When the 1973 oil crisis hit, its managers had already considered a similar world; Wack wrote up the method more than a decade later.
