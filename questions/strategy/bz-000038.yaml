true_statement: Sunk costs deter entry because an incumbent can ignore money already sunk when pricing, while an entrant must still commit it.
false_statement: Sunk costs deter entry because an entrant can ignore money already sunk when pricing, while an incumbent must still commit it.
explanation: The asymmetry means an entrant usually needs to be considerably more efficient than the incumbent to enter profitably. In contestability theory, scale economies deter entry only when combined with sunk costs.
