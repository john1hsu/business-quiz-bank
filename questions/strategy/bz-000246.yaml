true_statement: Bruce Henderson set out the logic of the growth-share matrix in a short 1970 essay, The Product Portfolio, and his core argument was about cash, not accounting profit.
false_statement: Bruce Henderson set out the logic of the growth-share matrix in a short 1970 essay, The Product Portfolio, and his core argument was about accounting profit, not cash.
explanation: Henderson's point was that fast-growing products absorb cash while slow-growing ones should throw it off, so a firm must move cash between them. Profit on paper can coexist with a product that never generates cash, which he considered worthless.
