true_statement: Mintzberg and Waters treated deliberate and emergent strategies as two ends of a continuum, with types such as umbrella and imposed strategies in between.
false_statement: Mintzberg and Waters treated deliberate and emergent strategies as two separate kinds that never mix, rejecting in-between types such as umbrella strategies.
explanation: Their 1985 article argued that real strategies are rarely purely planned or purely emergent. The point undercuts the neat process model, since patterns that form in action also make strategy.
