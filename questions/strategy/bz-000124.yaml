true_statement: Lieberman and Montgomery's 1988 Strategic Management Journal article reviewed both the advantages and disadvantages of pioneering, critiquing the belief that being first pays.
false_statement: Golder and Tellis's 1988 Strategic Management Journal article reviewed both the advantages and disadvantages of pioneering, critiquing the belief that being first pays.
explanation: The Stanford pair popularized the term while questioning an idea business schools had taken for granted. Golder and Tellis came later, in 1993, with a historical study of about 500 brands.
