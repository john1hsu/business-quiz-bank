true_statement: BCG traces the experience curve to a 1966 cost study for a large semiconductor maker, with Bruce Henderson later setting out its strategic implications.
false_statement: BCG traces the experience curve to a 1966 cost study for a large aircraft maker, with Bruce Henderson later setting out its strategic implications.
explanation: Aircraft were the setting of the older learning curve, from T. P. Wright's 1936 paper. BCG's step was to extend the idea from direct labour to a product's total cost and turn it into a strategy tool.
