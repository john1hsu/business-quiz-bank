topic: 'Competitive Advantage: Why Some Firms Persistently Outperform Rivals'
topic_type: Concept
true_statement: Rumelt's 1991 decomposition of business-unit returns found large, stable business-unit effects, small industry effects and negligible corporate-parent effects.
false_statement: Rumelt's 1991 decomposition of business-unit returns found large, stable corporate-parent effects, small industry effects and negligible business-unit effects.
explanation: Using FTC Line of Business data, Rumelt showed most economic rents come from business-specific sources, not from industry membership or the corporate parent. That finding challenged a purely industry-structure view and lent weight to resource-based explanations of advantage.
