topic: Barriers to Entry
topic_type: Concept
true_statement: George Stigler defined an entry barrier narrowly as a cost that entrants must bear but incumbents did not.
false_statement: Joe Bain defined an entry barrier narrowly as a cost that entrants must bear but incumbents did not.
explanation: 'Bain (1956) used the broad test: anything letting incumbents keep above-normal profits without attracting entry. Stigler (1968) narrowed it to cost asymmetries, so scale economies available to all firms wouldn''t count.'
