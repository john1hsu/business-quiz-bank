topic: 'Scenario Planning: Strategy for Multiple Plausible Futures'
topic_type: Practice
true_statement: Wack distinguished predetermined elements, developments already in motion whose consequences can be traced, from critical uncertainties that remain genuinely open.
false_statement: Wack distinguished critical uncertainties, developments already in motion whose consequences can be traced, from predetermined elements that remain genuinely open.
explanation: Demographic or supply trends already under way can be projected; truly open questions cannot. Treating an uncertainty as settled, or hiding it, is what makes plans brittle, so scenarios vary the uncertainties while holding the predetermined elements.
