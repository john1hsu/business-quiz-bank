area: strategy
kind: evidence
topic: First-Mover Advantage
topic_type: Concept
true_statement: Golder and Tellis argued earlier pioneer studies were inflated by survivor bias, since failed pioneers were missing from the data; in their sample 47% of pioneers failed.
false_statement: Golder and Tellis argued earlier pioneer studies were deflated by survivor bias, since failed followers were missing from the data; in their sample 47% of followers failed.
explanation: Databases like PIMS only saw firms still around, so they overstated pioneers' lasting share leads. Golder and Tellis found pioneers averaged about 10% share, versus roughly 30% in earlier work.
