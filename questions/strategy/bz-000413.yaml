true_statement: Dan Schendel and Charles Hofer's 1977 Pittsburgh conference called for strategic management to become an academic discipline grounded in empirical research.
false_statement: Kenneth Andrews and C. Roland Christensen's 1977 Pittsburgh conference called for strategic management to become an academic discipline grounded in empirical research.
explanation: Andrews and Christensen belong to the earlier Harvard business policy tradition built on cases. Schendel and Hofer renamed and rebuilt the field, and Schendel went on to found the Strategic Management Journal in 1980.
