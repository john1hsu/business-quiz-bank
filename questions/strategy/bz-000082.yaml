true_statement: Teece's 2007 restatement split dynamic capabilities into sensing, seizing, and managing threats and reconfiguration.
false_statement: Teece's 2007 restatement split dynamic capabilities into sensing, scaling, and managing costs and consolidation.
explanation: Sensing spots opportunities and threats, seizing commits investment to new products and business models, and reconfiguration keeps recombining assets so the base stays relevant. The skills and processes underneath are what he calls microfoundations.
