topic: 'Resource-Based View: Firm Resources as the Source of Competitive Advantage'
topic_type: Theory
true_statement: Birger Wernerfelt named the resource-based view in a 1984 Strategic Management Journal article, recasting entry barriers as resource position barriers.
false_statement: Jay Barney named the resource-based view in a 1984 Strategic Management Journal article, recasting entry barriers as resource position barriers.
explanation: Wernerfelt coined the view in 1984 by turning product-market tools, such as entry barriers and growth-share matrices, toward resources. Barney came later, in a 1991 Journal of Management article that made it a testable theory of sustained advantage.
