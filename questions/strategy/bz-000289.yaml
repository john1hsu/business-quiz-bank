id: bz-000289
area: strategy
kind: mechanism
topic: Consumer Switching Costs
topic_type: Concept
true_statement: In the bargain-then-ripoff pattern, firms price low, even below cost, to win unattached buyers, then charge more once those buyers are locked in.
false_statement: In the bargain-then-ripoff pattern, firms price high to win unattached buyers, then cut prices once those buyers are locked in to keep them from leaving.
explanation: A locked-in customer tolerates a higher price before leaving, so early share becomes later profit. In the simplest model, competition for new customers passes those later rents back through the early discounts.
