true_statement: 'Apple''s iPod is used to illustrate dynamic capabilities: Apple sensed demand because existing MP3 players were bulky and unattractive, then seized it with a better-designed device.'
false_statement: 'Apple''s iPod is used to illustrate dynamic capabilities: Apple sensed demand because existing MP3 players were too expensive, then seized it with a cheaper device.'
explanation: 'The case maps onto all three clusters: sensing latent demand, seizing it with a smaller, better-designed product and a move into consumer electronics, and transforming the line through the Nano, Touch and iTunes.'
