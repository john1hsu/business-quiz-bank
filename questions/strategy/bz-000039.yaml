area: strategy
kind: application
topic: Barriers to Entry
topic_type: Concept
true_statement: Under the 2023 DOJ and FTC Merger Guidelines, merging firms citing new entry must show it would be timely, likely and sufficient.
false_statement: Under the 2023 DOJ and FTC Merger Guidelines, merging firms citing new entry need only show that some entry is possible.
explanation: Regulators ask not whether a barrier exists in the abstract but whether entry would actually restore competition. A history of absent or failed entry signals that entry will be slow or difficult.
