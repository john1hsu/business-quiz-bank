topic: 'Business Ecosystem: Co-Evolving Communities of Firms Around a Shared Value Proposition'
topic_type: Concept
true_statement: 'Michelin''s PAX run-flat tire illustrates Ron Adner''s adoption-chain risk: its success depended on independent repair garages choosing to change their equipment and practices.'
false_statement: 'Michelin''s PAX run-flat tire illustrates Ron Adner''s co-innovation risk: its success depended on independent repair garages choosing to change their equipment and practices.'
explanation: Adner separates co-innovation risk, whether partners can build what is needed, from adoption-chain risk, whether intermediaries will choose to adopt. Garages deciding whether to re-equip is a question of adoption, so the PAX case is the adoption-chain kind.
