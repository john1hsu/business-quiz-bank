id: bz-000290
area: strategy
kind: definition
topic: Consumer Switching Costs
topic_type: Concept
true_statement: Farrell and Klemperer treat contractual switching costs, such as frequent-flyer programs, as created by firms rather than as real social costs.
false_statement: Farrell and Klemperer treat learning switching costs, such as mastering new software, as created by firms rather than as real social costs.
explanation: A loyalty rebate is a transfer a firm engineers to discourage switching; society would lose nothing if it vanished. Learning costs, by contrast, are real resources spent and are paid once.
