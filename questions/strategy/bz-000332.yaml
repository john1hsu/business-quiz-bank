topic: 'Porter''s Five Forces: Competitive Forces That Shape Industry Profitability'
topic_type: Framework
true_statement: In his 2008 restatement, Porter held that government policy and complementary products matter through their effect on the five forces rather than as forces of their own.
false_statement: In his 2008 restatement, Porter added government policy and complementary products as a sixth force acting alongside the original five.
explanation: 'Porter resisted adding a sixth force: regulation or complements matter because they raise or lower entry barriers, buyer power and the rest. He also warned that fast growth does not guarantee profitability.'
