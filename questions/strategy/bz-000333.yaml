topic: 'Porter''s Five Forces: Competitive Forces That Shape Industry Profitability'
topic_type: Framework
true_statement: McGahan and Porter's 1997 study attributed about 19% of variance in US firms' profitability to industry and about 32% to business-specific effects.
false_statement: McGahan and Porter's 1997 study attributed about 32% of variance in US firms' profitability to industry and about 19% to business-specific effects.
explanation: They were answering Rumelt's 1991 finding that industry effects were small. Their result showed industry matters, more in services than in manufacturing, but firm-level differences matter more, which resource-based critics stress.
