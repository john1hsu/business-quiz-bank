topic: BCG Growth-Share Matrix
topic_type: Framework
true_statement: In Armstrong and Brodie's 1994 experiment, subjects shown the BCG matrix were more likely than those shown net present value to pick a money-losing star over a profitable dog.
false_statement: In Armstrong and Brodie's 1994 experiment, subjects shown net present value were more likely than those shown the BCG matrix to pick a money-losing star over a profitable dog.
explanation: About 63.5% of matrix-trained subjects chose the unprofitable star, versus 37.1% of the NPV group and 44.7% of controls. The labels pulled people away from the cash-flow answer, so the authors advised against matrix methods.
