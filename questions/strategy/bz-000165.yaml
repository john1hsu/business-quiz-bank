topic: David J. Teece
topic_type: Person
true_statement: Teece's 1986 profiting-from-innovation paper argued that imitators, customers and owners of complementary assets such as distribution often capture an innovation's returns.
false_statement: Teece's 1986 profiting-from-innovation paper argued that innovators usually capture an innovation's returns, because imitators and customers lack complementary assets.
explanation: 'Inventing is not enough: who gains depends on how easily the know-how is copied, whether a dominant design has emerged, and who controls scarce manufacturing, distribution and service capacity. Where protection is weak, the innovator may need those assets early.'
