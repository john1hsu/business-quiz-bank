topic: Experience Curve
topic_type: Framework
true_statement: The experience curve lowers unit cost through a firm's cumulative output, whereas economies of scale lower it through the size of current output.
false_statement: The experience curve lowers unit cost through the size of a firm's current output, whereas economies of scale lower it through cumulative output.
explanation: Experience effects come from repetition and improvement as total units produced pile up, so a faster-growing firm moves down the curve faster. Lieberman's data on chemical products separated the two effects and found scale effects small by comparison.
