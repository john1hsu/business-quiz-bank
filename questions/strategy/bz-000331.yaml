topic: 'Porter''s Five Forces: Competitive Forces That Shape Industry Profitability'
topic_type: Framework
true_statement: Michael Porter first set out the five forces in a 1979 Harvard Business Review article, How Competitive Forces Shape Strategy, before developing them in Competitive Strategy (1980).
false_statement: Michael Porter first set out the five forces in his 1980 book Competitive Strategy, before summarizing them in a 1985 Harvard Business Review article, How Competitive Forces Shape Strategy.
explanation: The HBR article came first, in 1979; the 1980 book paired the forces with the generic strategies of cost leadership, differentiation and focus. Porter revisited the framework in HBR in 2008.
