topic: Dynamic Capabilities
topic_type: Theory
true_statement: Eisenhardt and Martin (2000) argued dynamic capabilities share common features across firms, making them more substitutable and closer to best practice than Teece implied.
false_statement: Eisenhardt and Martin (2000) argued dynamic capabilities are unique to each firm, making them less substitutable and further from best practice than Teece implied.
explanation: They treated dynamic capabilities as identifiable processes like product development and alliancing. Teece holds that widely known best practices are not dynamic capabilities because rivals can copy them, so this firm-specific versus best-practice dispute remains a core tension.
