true_statement: A review of 92 quantitative studies found the link between dynamic capabilities and firm performance still unclear, partly because studies define and measure the capabilities differently.
false_statement: A review of 92 quantitative studies found a clear, direct link between dynamic capabilities and firm performance, consistent however studies defined and measured the capabilities.
explanation: Despite the idea's fame, the evidence is contested. Inconsistent definitions make results hard to compare, and the most promising findings are indirect, working through change and intermediate outcomes rather than straight to performance.
