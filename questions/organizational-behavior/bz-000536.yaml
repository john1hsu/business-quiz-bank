true_statement: Mark Hughes reviewed five published sources for the claim that about 70% of change initiatives fail and found that none gives valid, reliable evidence for it.
false_statement: Mark Hughes reviewed five published sources for the claim that about 70% of change initiatives fail and found that all five give valid, reliable evidence for it.
explanation: The 70% failure rate is widely repeated, but Hughes traced it to sources that lack sound empirical support. It is a useful caution against treating a popular statistic as established fact.
