topic: Devil's Advocate Method
topic_type: Practice
true_statement: Nemeth, Rogers and Brown reported in 2001 that no role-played dissent generates as much divergent thinking as authentic dissent.
false_statement: Nemeth, Rogers and Brown reported in 2001 that role-played devil's advocacy generates more divergent thinking than authentic dissent.
explanation: Assigned critics are seen as playing a part, so their objections carry less weight than a colleague's real disagreement. That is why assigning a critic should complement, not replace, a climate where people voice their own concerns.
