topic: Groupthink
topic_type: Theory
true_statement: Among Janis's symptoms of groupthink, mindguards are self-appointed members who screen the group from unwelcome information.
false_statement: Among Janis's symptoms of groupthink, mindguards are self-appointed members who argue against the group's preferred option to test it.
explanation: Mindguards protect the emerging consensus, alongside other symptoms such as self-censorship and an illusion of unanimity. Arguing against the favoured option is structured dissent, the devil's advocacy remedy for groupthink, not a symptom of it.
