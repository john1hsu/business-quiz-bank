topic: 'Group Decision Making: How Groups Combine Individual Judgments into Choices'
topic_type: Concept
true_statement: A contingency rule says a group should decide when no single person holds the needed information, while one individual should decide in emergencies.
false_statement: A contingency rule says one individual should decide when no single person holds the needed information, while a group should decide in emergencies.
explanation: Groups pool dispersed knowledge and win commitment from those who must implement, but they are slow. Under acute time pressure, or when one person already has the facts, an individual decision is better.
