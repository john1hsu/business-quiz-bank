true_statement: A 2017 meta-analysis found psychological safety correlated far more with subjectively rated performance than with objective performance.
false_statement: A 2017 meta-analysis found psychological safety correlated far more with objective performance than with subjectively rated performance.
explanation: Frazier and colleagues found a correlation of .40 with subjective ratings but only .07 with objective measures. Single-source, single-time designs also inflated effects, so causal claims stay weak.
