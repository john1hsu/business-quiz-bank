true_statement: Hackman's study of symphony orchestras found many musicians unhappy at work and pointed to governance that left players out of decisions.
false_statement: Hackman's study of symphony orchestras found many musicians unhappy at work and pointed to pay that lagged behind other skilled professions.
explanation: The study covered orchestras in the United States, Britain and Germany; Hackman's team model was also applied in aviation, surgery and intelligence analysis. The orchestra work traced dissatisfaction to how the organizations were governed, and the findings were presented to U.S. orchestra and musicians' associations in 1995.
