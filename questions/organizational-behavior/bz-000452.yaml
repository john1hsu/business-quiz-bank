true_statement: Hannan and Freeman argued in 1984 that organizational inertia is a product of selection, and found older organizations more inert than younger ones.
false_statement: Hannan and Freeman argued in 1984 that organizational inertia is a product of selection, and found younger organizations more inert than older ones.
explanation: Environments favor organizations that act reliably and can account for their activities, which requires reproducing structure faithfully, so inertia grows with age. The effect of size was less clear-cut, and this view stresses replacement over adaptation.
