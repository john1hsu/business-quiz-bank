true_statement: In Hackman's design conditions for team effectiveness, a real team is one with clear boundaries and stable membership.
false_statement: In Hackman's design conditions for team effectiveness, a real team is one with flexible boundaries and rotating membership.
explanation: 'Hackman, Wageman and Fisher treated performance as a design problem: a real team, a compelling direction, an enabling structure, a supportive context and expert coaching. Hackman also observed that members often disagree even about who belongs to the team.'
