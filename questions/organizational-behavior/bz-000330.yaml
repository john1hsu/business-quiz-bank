id: bz-000330
area: organizational-behavior
kind: evidence
topic: 'Goal-Setting Theory: Specific, Difficult Goals and Performance'
topic_type: Theory
true_statement: On complex tasks where people lack the needed knowledge, a specific learning goal outperforms both a specific high performance goal and a do-your-best goal.
false_statement: On complex tasks where people lack the needed knowledge, a specific high performance goal outperforms both a specific learning goal and a do-your-best goal.
explanation: A performance goal pushes people to execute before they know how, which can backfire. A learning goal, such as finding a set number of strategies, directs effort to building the knowledge first, as a 2004 business-simulation study showed.
