true_statement: Jeffrey Pfeffer and Gerald Salancik set out resource dependence theory in The External Control of Organizations in 1978.
false_statement: Paul DiMaggio and Walter Powell set out resource dependence theory in The External Control of Organizations in 1978.
explanation: Pfeffer and Salancik argued that needing resources held by others makes outside control nearly inevitable, so managers respond politically or through alliances, board interlocks and mergers. DiMaggio and Powell are the institutional theorists behind the 1983 isomorphism paper.
