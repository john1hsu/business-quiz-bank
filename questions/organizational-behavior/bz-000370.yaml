topic: 'Organizational Learning: How Organizations Acquire, Retain and Transfer Knowledge'
topic_type: Concept
true_statement: In Huber's 1991 review, grafting means acquiring knowledge by bringing in members or units that already hold it, unlike vicarious learning from watching other firms.
false_statement: In Huber's 1991 review, vicarious learning means acquiring knowledge by bringing in members or units that already hold it, unlike grafting from watching other firms.
explanation: 'Huber listed five routes to knowledge: what the firm knew at founding, its own experience, observing others (vicarious), grafting on people or units, and searching the environment. Grafting imports knowledge with its carriers; vicarious learning copies by observation.'
