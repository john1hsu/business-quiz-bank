id: bz-000411
area: organizational-behavior
kind: evidence
topic: 'Group Decision Making: How Groups Combine Individual Judgments into Choices'
topic_type: Concept
true_statement: In Stasser and Titus's 1985 hidden-profile experiment, groups seldom chose the best candidate when its favorable facts were split among members, since discussion rarely surfaced unshared facts.
false_statement: In Stasser and Titus's 1985 hidden-profile experiment, groups usually chose the best candidate when its favorable facts were split among members, since discussion readily surfaced unshared facts.
explanation: When everyone saw all the facts, most groups picked the best option; when facts were scattered, few did, and initial majorities simply grew. Unstructured discussion tends to reinforce what members already share.
