topic: 'Organizational Learning: How Organizations Acquire, Retain and Transfer Knowledge'
topic_type: Concept
true_statement: Argyris's double-loop learning both corrects an action after an error and questions the assumptions and goals that lay behind the action.
false_statement: Argyris's single-loop learning both corrects an action after an error and questions the assumptions and goals that lay behind the action.
explanation: Single-loop learning only fixes the action, like a thermostat switching on heat below 68 degrees. Double-loop learning also asks why the setting is 68, which is harder because it challenges the learner's own reasoning.
