topic: Amy Edmondson
topic_type: Person
true_statement: In Edmondson's failure framework, intelligent failures are well-intentioned experiments in new territory, while basic failures are preventable slips.
false_statement: In Edmondson's failure framework, complex failures are well-intentioned experiments in new territory, while basic failures are preventable slips.
explanation: Right Kind of Wrong (2023) separates basic, complex and intelligent failures. Complex failures have multiple causes and are reduced by catching small problems early; only intelligent failures generate useful knowledge worth encouraging.
