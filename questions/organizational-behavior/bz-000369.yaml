area: organizational-behavior
kind: evidence
topic: 'Organizational Learning: How Organizations Acquire, Retain and Transfer Knowledge'
topic_type: Concept
true_statement: In a competency trap, good results with an inferior routine build so much experience with it that a superior alternative is never adopted.
false_statement: In superstitious learning, good results with an inferior routine build so much experience with it that a superior alternative is never adopted.
explanation: Levitt and March named both pathologies. The competency trap is about experience locking in a second-best routine; superstitious learning is drawing confident but wrong conclusions about what caused an outcome.
