true_statement: In Hackman and Oldham's job characteristics model, autonomy and feedback act as multipliers in a job's motivating potential score.
false_statement: In Hackman and Oldham's job characteristics model, skill variety and task identity act as multipliers in a job's motivating potential score.
explanation: 'The model rates five job features: skill variety, task identity, task significance, autonomy and feedback. Because autonomy and feedback multiply the score, a job that lacks either one has low motivating potential however varied or significant it is.'
