true_statement: In Project Aristotle, team size, colocation and seniority did not significantly predict team effectiveness at Google.
false_statement: In Project Aristotle, team size, colocation and seniority were the strongest predictors of team effectiveness at Google.
explanation: The study's headline was that how a team works together matters more than who is on it. Google cautioned that these composition factors might still matter in other organizations.
