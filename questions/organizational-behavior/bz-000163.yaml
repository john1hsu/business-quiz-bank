true_statement: In Callaway and Esser's laboratory test, groups of intermediate cohesiveness made the best decisions, while highly cohesive groups lacking sound procedures did worst.
false_statement: In Callaway and Esser's laboratory test, highly cohesive groups made the best decisions, while groups of intermediate cohesiveness lacking sound procedures did worst.
explanation: 'The 1984 study gave groupthink only mixed support: the worst groups showed little disagreement and high confidence, as the theory predicts. It suggests that sound decision procedures, not just less cohesion, are the practical safeguard.'
