true_statement: Hartnell, Ou and Kinicki's 2011 meta-analysis linked clan cultures most closely to job satisfaction and commitment, and market cultures to profit.
false_statement: Hartnell, Ou and Kinicki's 2011 meta-analysis linked market cultures most closely to job satisfaction and commitment, and clan cultures to profit.
explanation: The meta-analysis of 84 studies found clan, adhocracy and market cultures all tied to better outcomes, but clan cultures mattered most for employee attitudes and market cultures for profit. It also found clan and market traits correlated positively, though the Competing Values Framework treats them as opposites.
