topic: 'Goal-Setting Theory: Specific, Difficult Goals and Performance'
topic_type: Theory
true_statement: Goal-setting theory began with Edwin Locke's laboratory research in the late 1960s, and Gary Latham carried it into the field, starting with pulpwood logging crews.
false_statement: Goal-setting theory began with Gary Latham's laboratory research in the late 1960s, and Edwin Locke carried it into the field, starting with pulpwood logging crews.
explanation: Locke's lab studies found specific high goals beat instructions to do one's best; Latham tested the idea with real crews, where productivity and attendance rose within a week. The two consolidated the program into a formal theory in 1990.
