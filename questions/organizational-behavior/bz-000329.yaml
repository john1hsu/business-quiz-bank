topic: 'Goal-Setting Theory: Specific, Difficult Goals and Performance'
topic_type: Theory
true_statement: Latham's field work found that when goal difficulty was held constant, assigned goals performed as well as participatively set ones, especially when a rationale was given.
false_statement: Latham's field work found that even when goal difficulty was held constant, participatively set goals clearly outperformed assigned ones, especially when a rationale was given.
explanation: Participation tended to produce higher goals, and that is where its advantage came from. Once difficulty was equal, the source of the goal mattered little, so explaining the reason behind an assigned goal can work just as well.
