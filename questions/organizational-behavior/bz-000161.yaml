true_statement: Irving Janis set out the theory of groupthink in his 1972 book Victims of Groupthink, drawing on cases such as Pearl Harbor and the Bay of Pigs invasion.
false_statement: Irving Janis set out the theory of groupthink in his 1977 book Victims of Groupthink, drawing on cases such as Pearl Harbor and the Bay of Pigs invasion.
explanation: Janis asked why groups of highly capable people made poor foreign-policy decisions, and the Bay of Pigs became his signature case. The 1977 date belongs to the later elaboration of the model by Janis and Mann, not the original book.
