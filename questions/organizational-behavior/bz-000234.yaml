true_statement: A 1976 bank study by Oldham, Hackman and Pearce found enriched jobs paid off most for employees with high growth needs who were satisfied with pay, security, co-workers and supervision.
false_statement: A 1976 bank study by Oldham, Hackman and Pearce found enriched jobs paid off most for employees with low growth needs who were dissatisfied with pay, security, co-workers and supervision.
explanation: 'The study of 201 clerical employees showed enrichment is not universally good: for dissatisfied people with low growth needs, richer jobs were sometimes linked to worse results. The authors noted the design was correlational, so it could not prove causation.'
