topic: Psychological Safety
topic_type: Concept
true_statement: Psychological safety differs from group cohesiveness, which can suppress disagreement the way groupthink describes.
false_statement: Psychological safety is essentially group cohesiveness, which reliably encourages disagreement and dissent.
explanation: 'Edmondson separated the two: a cohesive team may feel comfortable yet discourage dissent. Psychological safety is defined by the freedom to dissent, admit errors and challenge plans without punishment.'
