topic: 'Organizational Culture: Shared Assumptions, Values and Artifacts in Firms'
topic_type: Concept
true_statement: Schein held that basic underlying assumptions, not espoused values or visible artifacts, are the unconscious core of an organization's culture.
false_statement: Schein held that espoused values, not basic underlying assumptions or visible artifacts, are the unconscious core of an organization's culture.
explanation: Espoused values are what members say they believe and can be surveyed; underlying assumptions are taken for granted and need deep joint inquiry to uncover. A gap between the two explains why a firm's stated values can differ from its behavior, as at Enron.
