true_statement: Stoner's 1961 work found individuals became riskier after group discussion, a result later research generalized into group polarization.
false_statement: Stoner's 1961 work found individuals became more cautious after group discussion, a result later research generalized into group polarization.
explanation: 'The ''risky shift'' turned out to be one case of a broader pattern: discussion pushes like-minded members further in whatever direction they already leaned. More than 200 studies document it.'
