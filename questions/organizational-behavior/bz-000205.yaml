id: bz-000205
area: organizational-behavior
kind: evidence
topic: High-Performance Teams
topic_type: Concept
true_statement: Hackman's studies found that real-time process coaching did not rescue poorly designed self-managing teams, while well-designed teams benefited from modest help.
false_statement: Hackman's studies found that real-time process coaching rescued poorly designed self-managing teams, while well-designed teams gained little from modest help.
explanation: Coaching helps only once the other design conditions are in place, so it amplifies good design rather than substituting for it. That is why managers using the model fix team design and launch first and save coaching for breakpoints such as the project midpoint.
