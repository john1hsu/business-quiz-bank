topic: 'Change Management: From Lewin''s Unfreezing to Kotter''s Eight Steps'
topic_type: Practice
true_statement: Kotter judged a sense of urgency sufficient only when roughly 75% of a company's management is convinced that business as usual is unacceptable.
false_statement: Kotter judged a sense of urgency sufficient only when roughly 50% of a company's management is convinced that business as usual is unacceptable.
explanation: Kotter set a high bar, about three quarters of management, for the first step of establishing urgency. He found that well over half of the companies he watched failed at this first phase.
