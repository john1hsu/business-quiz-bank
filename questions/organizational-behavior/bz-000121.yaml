topic: Google Project Aristotle
topic_type: Case
true_statement: Google's Project Oxygen, which preceded Aristotle, set out to prove managers did not matter and found instead that better managers were linked to lower turnover.
false_statement: Google's Project Oxygen, which preceded Aristotle, set out to prove managers mattered and found instead that manager quality had no link to turnover.
explanation: Oxygen began in 2009 as a skeptical test and ended by distilling eight behaviors of good managers that Google built into feedback and training. Aristotle then applied the same evidence-driven approach to teams.
