topic: Devil's Advocate Method
topic_type: Practice
true_statement: A 1986 laboratory study found devil's advocacy and dialectical inquiry groups made better strategic recommendations than consensus groups, but consensus groups were more satisfied.
false_statement: A 1986 laboratory study found consensus groups made better strategic recommendations than devil's advocacy and dialectical inquiry groups, but were less satisfied.
explanation: 'Structured conflict raised decision quality and scrutiny of assumptions at a social cost: consensus groups reported more satisfaction and more acceptance of the final decision. Managers using the method have to manage that trade-off.'
