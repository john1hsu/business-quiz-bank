topic: 'Change Management: From Lewin''s Unfreezing to Kotter''s Eight Steps'
topic_type: Practice
true_statement: John Kotter based his eight-step change advice, in a 1995 Harvard Business Review article, on watching more than 100 companies such as Ford and British Airways attempt transformation.
false_statement: John Kotter based his eight-step change advice, in a 1975 Harvard Business Review article, on watching more than 100 companies such as Ford and British Airways attempt transformation.
explanation: Kotter's 1995 article framed its advice as eight errors to avoid, from insufficient urgency to failing to anchor change in culture. He found a few efforts very successful, a few outright failures, and most in between, tilted toward the lower end.
