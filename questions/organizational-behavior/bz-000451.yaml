true_statement: In DiMaggio and Powell's account of isomorphism, mimetic pressure is copying rivals under uncertainty, while coercive pressure comes from powerful outsiders such as regulators.
false_statement: In DiMaggio and Powell's account of isomorphism, coercive pressure is copying rivals under uncertainty, while mimetic pressure comes from powerful outsiders such as regulators.
explanation: 'Mimetic means imitation: when unsure what works, organizations copy peers. Coercive pressure comes from funders and regulators who can force conformity, and the third, normative pressure, comes from professionalization and staff moving between organizations.'
