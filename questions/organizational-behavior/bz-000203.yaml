topic: High-Performance Teams
topic_type: Concept
true_statement: Katzenbach and Smith separated a team, with shared leadership and mutual accountability, from a working group, where a strong leader assigns work and members answer only for their own results.
false_statement: Katzenbach and Smith separated a working group, with shared leadership and mutual accountability, from a team, where a strong leader assigns work and members answer only for their own results.
explanation: In their 1993 HBR article a real team is judged directly by the collective work products members create together. A working group's performance is the sum of individual outputs and is judged only indirectly, by its influence on the wider business.
