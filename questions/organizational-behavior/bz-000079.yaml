true_statement: In Edmondson's 1996 hospital study, better-led nursing units recorded more medication errors, because their staff were more willing to report mistakes.
false_statement: In Edmondson's 1996 hospital study, better-led nursing units recorded fewer medication errors, because their staff made fewer mistakes.
explanation: A detected error rate mixes how many errors happen with how willing people are to report them. This anomaly led to her work on psychological safety, and it warns managers not to read low reported numbers as good performance.
