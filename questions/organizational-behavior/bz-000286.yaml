topic: Devil's Advocate Method
topic_type: Practice
true_statement: The devil's advocate was the popular name for the Catholic Church's Promoter of the Faith, an office Pope Sixtus V formally established in 1587 to argue against canonization candidates.
false_statement: The devil's advocate was the popular name for the Catholic Church's Promoter of the Faith, an office Pope John Paul II formally established in 1983 to argue against canonization candidates.
explanation: Sixtus V created the office in the 16th century; John Paul II's 1983 reform of canonization procedure is when its influence faded. Management researchers later borrowed the idea of an assigned critic for strategic planning.
