true_statement: In Edmondson's 1999 study of 51 work teams, team learning behavior mediated the link between psychological safety and team performance.
false_statement: In Edmondson's 1999 study of 51 work teams, team efficacy mediated the link between psychological safety and team performance.
explanation: Safety made teams more willing to ask, admit errors and experiment, and that learning behavior is what improved performance. Team efficacy, by contrast, had no association with learning once safety was controlled for.
