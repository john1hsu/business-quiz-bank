true_statement: Judge and colleagues' 2002 meta-analysis found extraversion the most consistent Big Five correlate of leadership (.31), ahead of conscientiousness (.28).
false_statement: Judge and colleagues' 2002 meta-analysis found conscientiousness the most consistent Big Five correlate of leadership (.31), ahead of extraversion (.28).
explanation: 'Pooling 222 correlations from 73 samples, the study revived trait research: extraversion held up across settings and for both leader emergence and effectiveness. Conscientiousness came second, then openness and low neuroticism, with a multiple correlation of .48 for all five.'
