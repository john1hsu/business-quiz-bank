topic: Contingency Theory of Leadership
topic_type: Theory
true_statement: A main critique of Fiedler's model is that test-retest reliabilities of the LPC scale ranged from .01 to .92 across 23 studies.
false_statement: A main critique of Fiedler's model is that test-retest reliabilities of the LPC scale stayed above .90 across 23 studies.
explanation: The model rests on LPC being a stable measure of style, so wildly varying reliability undercuts it. The scale also drew at least five different interpretations, from social distance to cognitive complexity.
