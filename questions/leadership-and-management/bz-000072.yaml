topic: Objectives and Key Results (OKRs)
topic_type: Framework
true_statement: Ordóñez, Schweitzer, Galinsky and Bazerman argued in 2009 that specific, challenging goals can narrow focus and increase unethical behaviour, so they need careful dosing.
false_statement: Ordóñez, Schweitzer, Galinsky and Bazerman argued in 2009 that specific, challenging goals broaden focus and reduce unethical behaviour, so they need little oversight.
explanation: They likened goals to prescription-strength medication whose side effects were overlooked, citing cases like the Ford Pinto. OKRs blunt part of this by decoupling goals from pay, but the narrow-focus risk remains.
