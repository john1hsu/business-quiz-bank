topic: 'Performance Management: Planning, Appraising and Developing Employee Performance'
topic_type: Practice
true_statement: In Deloitte's 2015 redesign, team leaders answered questions about future actions they would take for each person instead of rating that person's skills.
false_statement: In Deloitte's 2015 redesign, team leaders rated each person's skills on a detailed scale instead of answering questions about future actions they would take.
explanation: Research on idiosyncratic rater effects showed skill ratings say more about the rater than the person rated. Asking about the leader's own intended actions, such as promotion, aimed to give more reliable, forward-looking data.
