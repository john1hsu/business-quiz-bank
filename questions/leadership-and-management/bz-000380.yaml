topic: 'Performance Management: Planning, Appraising and Developing Employee Performance'
topic_type: Practice
true_statement: Performance appraisal, the periodic rating of an individual, is one step within performance management, which also covers what managers do before and after the rating.
false_statement: Performance management, the periodic rating of an individual, is one step within performance appraisal, which also covers what managers do before and after the rating.
explanation: OPM's cycle runs from planning and monitoring through developing, rating and rewarding. Appraisal is just the rating stage, so a firm can drop or redesign ratings while still managing performance.
