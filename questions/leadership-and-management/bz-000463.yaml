topic: Strategy Execution
topic_type: Concept
true_statement: Kaplan and Norton advise an Office of Strategy Management that holds strategy reviews separately from operational meetings, so strategy is not crowded out by firefighting.
false_statement: Kaplan and Norton advise an Office of Strategy Management that folds strategy reviews into operational meetings, so strategy stays tied to daily firefighting.
explanation: In The Execution Premium, strategy reviews are one stage of a six-stage loop running from developing the strategy to testing and adapting it. Keeping them apart from operational meetings protects time for strategic questions that urgent problems would otherwise push aside.
