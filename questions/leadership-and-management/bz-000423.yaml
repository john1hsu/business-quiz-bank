id: bz-000423
area: leadership-and-management
kind: evidence
topic: 'Span of Control: Number of Direct Reports per Manager'
topic_type: Concept
true_statement: Wulf found that flattening in large firms moved some decision rights up to top functional managers, so it looked more like centralization than empowerment.
false_statement: Wulf found that flattening in large firms moved most decision rights down to division heads, so it looked more like empowerment than centralization.
explanation: As CEOs took on more direct reports and layers disappeared, CEOs became more involved with those reports. Wider spans alone do not push decisions down the hierarchy.
