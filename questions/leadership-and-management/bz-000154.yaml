true_statement: W. Edwards Deming's point 11b called on managers to eliminate management by objective and numerical goals and substitute leadership.
false_statement: W. Edwards Deming's point 11b called on managers to eliminate leadership by example and substitute management by objective and numerical goals.
explanation: Deming rejected goal-driven control in favour of improving the system, which made point 11b a direct challenge to Drucker's best-known technique. Drucker is credited with the MBO concept, with GE executive Harold Smiddy helping put it into practice.
