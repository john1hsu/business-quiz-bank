topic: 'Performance Management: Planning, Appraising and Developing Employee Performance'
topic_type: Practice
true_statement: Kluger and DeNisi's 1996 meta-analysis found feedback had a positive average effect on performance, yet over one-third of feedback interventions reduced it.
false_statement: Kluger and DeNisi's 1996 meta-analysis found feedback had a negative average effect on performance, though over one-third of feedback interventions improved it.
explanation: Across 607 effect sizes the average gain was moderate, but the spread was wide enough that feedback often backfired. That is why feedback, the core of most systems, cannot be assumed to help.
