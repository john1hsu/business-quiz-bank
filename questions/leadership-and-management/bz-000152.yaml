true_statement: Peter Drucker coined the term knowledge worker in the late 1950s, for an economy where more people work with their minds than their hands.
false_statement: Peter Drucker coined the term knowledge worker in the late 1970s, for an economy where more people work with their minds than their hands.
explanation: Drucker named the knowledge worker in the late 1950s and spent decades analysing what that shift meant for management. The Drucker Institute also credits him with foreseeing the need for lifelong learning.
