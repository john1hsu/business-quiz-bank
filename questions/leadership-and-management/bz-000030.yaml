area: leadership-and-management
kind: evidence
topic: Balanced Scorecard
topic_type: Framework
true_statement: In a 2003 study of a bank's scorecard bonus plan, supervisors put more weight on financial measures, and the bank eventually dropped the scorecard.
false_statement: In a 2003 study of a bank's scorecard bonus plan, supervisors put more weight on nonfinancial measures, and the bank expanded the scorecard firm-wide.
explanation: Ittner, Larcker and Meyer found supervisors favoured financial measures and used subjectivity to add or ignore others, prompting complaints of favouritism. It shows the risk of tying pay to an unweighted set of measures.
