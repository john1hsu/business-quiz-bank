true_statement: In Google's OKR playbook, committed OKRs are expected to score 1.0, while aspirational OKRs are expected to average about 0.7.
false_statement: In Google's OKR playbook, aspirational OKRs are expected to score 1.0, while committed OKRs are expected to average about 0.7.
explanation: Committed OKRs are promises, so a miss calls for an explanation and a blameless postmortem. Aspirational OKRs describe a future without a clear path yet, so partial scores are normal and they roll forward until done.
