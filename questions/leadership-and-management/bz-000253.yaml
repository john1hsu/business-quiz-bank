topic: Hersey-Blanchard Situational Leadership Model
topic_type: Theory
true_statement: 'In Situational Leadership, follower readiness is task-specific: the same engineer can be highly ready at debugging and low in readiness at presenting to the board.'
false_statement: 'In Situational Leadership, follower readiness is a stable personality trait: an engineer highly ready at debugging is equally ready at presenting to the board.'
explanation: Readiness means ability and willingness to direct one's own work on a given task, so a leader may need different styles with the same person. The 1969 article also stressed it reflects experience and education, not age.
