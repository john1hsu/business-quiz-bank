true_statement: 'Henri Fayol described management through five elements: forecasting and planning, organising, commanding, coordinating and controlling.'
false_statement: 'Henri Fayol described management through five elements: planning, organising, staffing, directing and controlling.'
explanation: These are the five elements Fayol set out in his 1916 treatise, alongside his fourteen principles. The staffing-and-directing list is a later textbook adaptation (OpenStax uses one), so it should not be mistaken for Fayol's original wording.
