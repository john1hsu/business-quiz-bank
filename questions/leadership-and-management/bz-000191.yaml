true_statement: Fiedler predicted that task-oriented, low-LPC leaders do best in very favorable or very unfavorable situations, and relationship-oriented leaders in moderately favorable ones.
false_statement: Fiedler predicted that relationship-oriented, high-LPC leaders do best in very favorable or very unfavorable situations, and task-oriented leaders in moderately favorable ones.
explanation: 'The prediction is curvilinear: situational favorableness depends on leader-member relations, task structure and position power, and task focus pays off at both extremes. Relationship-oriented leaders do best in the mixed middle band.'
