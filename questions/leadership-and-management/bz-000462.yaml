topic: Strategy Execution
topic_type: Concept
true_statement: Lawrence Hrebiniak argued in Making Strategy Work (2005) that executing strategy is harder than making it, and that MBA programmes taught planning but not execution.
false_statement: Robert Kaplan argued in Making Strategy Work (2005) that executing strategy is harder than making it, and that MBA programmes taught planning but not execution.
explanation: Wharton's Hrebiniak helped make execution a topic of its own because formulation dominated the literature and curricula. Kaplan, with David Norton, wrote The Execution Premium (2008), which proposes a closed-loop execution system.
