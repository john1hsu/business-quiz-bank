topic: 'Management by Objectives: Goal-Setting Through Superior-Subordinate Agreement'
topic_type: Practice
true_statement: Rodgers and Hunter found MBO's productivity gains were largest where top management was committed to it and used it themselves, and smallest where leaders paid it lip service.
false_statement: Rodgers and Hunter found MBO's productivity gains were largest where front-line employees designed the program, and smallest where top management drove it themselves.
explanation: Of 70 cases they reviewed, 68 showed gains, but the size depended on executive commitment. That is why textbooks conclude MBO should be launched from the top down.
