topic: Strategy Execution
topic_type: Concept
true_statement: In Hrebiniak's surveys of more than 400 managers, inability to manage change and overcome resistance ranked as the top obstacle to executing strategy.
false_statement: In Hrebiniak's surveys of more than 400 managers, conflicts with the power structure ranked as the top obstacle to executing strategy, ahead of managing change.
explanation: Both survey groups put managing change and resistance first; power-structure conflicts, poor information sharing, unclear accountability and vague strategy followed. This is why execution is said to depend on change management.
