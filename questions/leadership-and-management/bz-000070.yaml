area: leadership-and-management
kind: origin
topic: Objectives and Key Results (OKRs)
topic_type: Framework
true_statement: Andy Grove adapted OKRs at Intel from Peter Drucker's management by objectives, shifting the cycle from an annual rhythm to a quarterly one.
false_statement: Andy Grove adapted OKRs at Intel from Peter Drucker's management by objectives, shifting the cycle from a quarterly rhythm to an annual one.
explanation: Drucker's 1950s MBO ran annually and was often tied to pay. Grove's version linked each objective to verifiable key results and ran faster, quarterly, so goals could track a fast-moving chip business.
