id: bz-000113
area: leadership-and-management
kind: definition
topic: Hoshin Kanri
topic_type: Practice
true_statement: Hoshin kanri separates breakthrough objectives that need cross-functional change from daily management of routine indicators like quality, cost and delivery.
false_statement: Hoshin kanri merges breakthrough objectives that need cross-functional change into daily management of routine indicators like quality, cost and delivery.
explanation: The few breakthrough objectives get deployed and reviewed through the strategy cycle, while routine KPIs are run as daily management. Keeping them apart stops a handful of strategic priorities from drowning among many operational metrics.
