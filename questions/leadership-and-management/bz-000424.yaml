topic: 'Span of Control: Number of Direct Reports per Manager'
topic_type: Concept
true_statement: Gallup reports the mean number of direct reports for U.S. managers rose from 8.2 in 2013 to 12.1 in 2025, while the median stayed at about five to six.
false_statement: Gallup reports the mean number of direct reports for U.S. managers rose from 8.2 in 2013 to 12.1 in 2025, and the median rose by a similar amount.
explanation: A flat median with a rising mean means a minority of very large teams is pulling the average up; in 2025, 13% of managers had 25 or more reports. Typical teams did not grow much.
