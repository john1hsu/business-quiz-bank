topic: 'Management Theory: From Classical Administration to Systems and Contingency Thinking'
topic_type: Field
true_statement: Max Weber's ideal type of bureaucracy rests on legal authority, with authority vested in the office rather than in the person who holds it.
false_statement: Max Weber's ideal type of bureaucracy rests on charismatic authority, with authority vested in the person rather than in the office they hold.
explanation: Weber's bureaucracy combines specialized roles, merit-based hiring, a clear hierarchy and written rules, so authority survives a change of officeholder. Merton later warned that such rules can become ends in themselves.
