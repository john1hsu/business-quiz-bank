true_statement: Witcher notes that hoshin kanri is nearly absent from mainstream strategy texts, partly because outsiders see it as mechanistic and tool-heavy.
false_statement: Witcher notes that hoshin kanri dominates mainstream strategy texts, partly because insiders see it as flexible and light on tools.
explanation: Its literature sits mainly in quality and operations management. Its inside-out, process-driven logic also fits awkwardly with market-positioning views of strategy, which dominate strategy textbooks.
