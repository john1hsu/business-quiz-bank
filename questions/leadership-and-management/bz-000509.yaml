topic: 'Leadership: Influencing People Toward Shared Goals'
topic_type: Concept
true_statement: Meindl, Ehrlich and Dukerich's 1985 romance-of-leadership thesis holds that scholars, media and the public over-credit leaders for organizational success and failure.
false_statement: Meindl, Ehrlich and Dukerich's 1985 romance-of-leadership thesis holds that scholars, media and the public under-credit leaders for organizational success and failure.
explanation: The thesis says leadership offers a reassuring but simplified explanation of complex events, so people attribute too much to leaders. This critique later seeded shared, distributed and follower-centred theories of leadership.
