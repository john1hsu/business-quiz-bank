true_statement: In a 1970 HBR article, Harry Levinson argued that MBO wrongly assumes employees' personal aims already match corporate goals, and proposed starting from the employee's own objectives.
false_statement: In a 1970 HBR article, Harry Levinson argued that MBO wrongly assumes corporate goals can be broken into individual targets, and proposed replacing it with team-level quotas.
explanation: 'Levinson''s critique was psychological: MBO leaves individual needs out of performance measurement and piles pressure on an assumed alignment. He later added that its focus on quantifiable results crowds out qualitative work.'
