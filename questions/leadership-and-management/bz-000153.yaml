true_statement: Drucker's theory of the business holds that a firm falters when its assumptions about customers, competitors, technology and core strengths stop matching reality.
false_statement: Drucker's theory of the business holds that a firm falters when its managers stop steering their work through explicitly set, measurable objectives.
explanation: Set out in a 1994 HBR article and sketched as early as a 1958 memo for General Electric, the idea is that every organization runs on such assumptions, and trouble starts when they go out of date. Steering work through explicit objectives describes his separate idea, management by objectives.
