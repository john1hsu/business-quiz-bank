topic: 'Management by Objectives: Goal-Setting Through Superior-Subordinate Agreement'
topic_type: Practice
true_statement: Peter Drucker first set out management by objectives in The Practice of Management in 1954.
false_statement: Peter Drucker first set out management by objectives in The Effective Executive in 1966.
explanation: In his 1954 book, Drucker argued that effective managers focus on results rather than activity and delegate by agreeing objectives with each subordinate. The idea draws on McGregor's Theory Y view that people can direct their own work.
