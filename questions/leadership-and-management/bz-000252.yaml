topic: Hersey-Blanchard Situational Leadership Model
topic_type: Theory
true_statement: Hersey and Blanchard first published their model in 1969 as the life cycle theory of leadership, building on the Ohio State studies' two dimensions of leader behavior.
false_statement: Hersey and Blanchard first published their model in 1969 as the life cycle theory of leadership, building on Blake and Mouton's Managerial Grid of leader attitudes.
explanation: They relabeled Ohio State's initiating structure and consideration as task and relationship behavior. They criticized the Managerial Grid for describing attitudes and for implying one best style.
