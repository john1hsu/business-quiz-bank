topic: Hoshin Kanri
topic_type: Practice
true_statement: In hoshin kanri, catchball passes draft goals down, across and back up the organization so each level negotiates what it can achieve and what resources it needs.
false_statement: In hoshin kanri, catchball passes final goals down the organization once, so each level accepts its targets without negotiating what it can achieve or needs.
explanation: 'Catchball is the method''s distinctive mechanism: goals can change as levels push back. It is often run with an X-matrix and one-page A3 plans, which is also why it can be slow, as at Land Rover where it took 12 months.'
