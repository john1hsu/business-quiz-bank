true_statement: A 1998 study of senior executives at a Fortune 100 firm found only 18 leader-follower pairs matched the model's prescribed fit, against 126 that did not.
false_statement: A 1998 study of senior executives at a Fortune 100 firm found 126 leader-follower pairs matched the model's prescribed fit, against only 18 that did not.
explanation: Most real pairings did not follow the prescription, and the study called the theory intuitively appealing but empirically contradictory. That fits a broader pattern of weak support despite the model's popularity in training.
