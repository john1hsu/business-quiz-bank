false_statement: In 1961 Harold Koontz described a management theory jungle of six competing schools and blamed too little theorizing and an excess of empirical testing.
explanation: Koontz called for clearer definitions and for testing fundamental principles, not less testing. His critique shows the field's own scholars were among its sharpest critics.
