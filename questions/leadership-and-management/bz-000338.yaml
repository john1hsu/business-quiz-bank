topic: 'Management Theory: From Classical Administration to Systems and Contingency Thinking'
topic_type: Field
true_statement: 'Contingency theory, associated with Joan Woodward, rejects universal rules: the right structure depends on the situation, such as a firm''s production technology.'
false_statement: 'Contingency theory, associated with Joan Woodward, seeks universal rules: the right structure is the same whatever a firm''s production technology.'
explanation: Classical theorists looked for one best way to organize. Woodward's view is that the best design varies with circumstances, which is why managers today ask how technology, environment or strategy change the answer.
