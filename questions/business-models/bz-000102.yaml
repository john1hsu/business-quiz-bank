topic: Razor and Blades
topic_type: BusinessModel
true_statement: Schmalensee's 2015 analysis found pricing the razor below cost is never optimal in a standard continuum model and optimal only in a narrow two-type case.
false_statement: Schmalensee's 2015 analysis found pricing the razor below cost is always optimal in a standard continuum model and suboptimal only in a narrow two-type case.
explanation: Building on Oi's 1971 result that the consumable should be priced above cost, he concluded below-cost razors are unlikely to be optimal in practice. He also argued such pricing, when used to discriminate, should not automatically be treated as predatory.
