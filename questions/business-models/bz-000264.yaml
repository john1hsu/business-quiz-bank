topic: Membership Warehouse Club
topic_type: BusinessModel
true_statement: Sol Price opened the first Price Club in San Diego in 1976, initially selling only to small businesses holding business licences or resale permits.
false_statement: Sol Price opened the first Price Club in San Diego in 1976, initially selling only to government employees before admitting small businesses.
explanation: Price Club started with business members and widened eligibility over time to groups such as government and credit-union employees, then to ordinary consumers. The government-employees-only format was Price's earlier venture, Fed-Mart.
