topic: 'Aggregation Theory: How Internet Aggregators Capture Value by Owning Demand'
topic_type: Theory
true_statement: In Thompson's grading, Netflix is a Level 1 aggregator that must buy its supply, while Google search is a Level 3 aggregator that gets its supply at no cost.
false_statement: In Thompson's grading, Google search is a Level 1 aggregator that must buy its supply, while Netflix is a Level 3 aggregator that gets its supply at no cost.
explanation: 'Levels rank aggregators by what supply costs them: Netflix pays for programming, Uber and Airbnb (Level 2) pay to onboard and vet suppliers, and web pages come to Google free. Lower supply cost means a purer, more scalable aggregator.'
