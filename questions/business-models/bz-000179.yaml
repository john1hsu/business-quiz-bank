area: business-models
kind: evidence
topic: Business Format Franchising
topic_type: BusinessModel
true_statement: Lafontaine's 1992 study of 548 U.S. franchisors found the data best fit a two-sided moral hazard model, where both franchisee and franchisor effort shape outlet results.
false_statement: Lafontaine's 1992 study of 548 U.S. franchisors found the data best fit a one-sided moral hazard model, where only franchisee effort shapes outlet results.
explanation: In the two-sided model neither party can be left without an incentive, which fits franchisees keeping residual profit while franchisors earn sales-based royalties. The models explained how much firms franchise better than their exact royalty and fee levels.
