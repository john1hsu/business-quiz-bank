area: business-models
kind: definition
topic: Software as a Service
topic_type: BusinessModel
true_statement: In NIST's cloud models, PaaS customers deploy their own applications on the provider's platform, while IaaS customers rent raw computing, storage and networking.
false_statement: In NIST's cloud models, IaaS customers deploy their own applications on the provider's platform, while PaaS customers rent raw computing, storage and networking.
explanation: The three models differ by how much the customer controls. In SaaS it controls almost nothing beyond user settings, in PaaS it brings its own applications, and in IaaS it runs whatever software it likes on rented infrastructure.
