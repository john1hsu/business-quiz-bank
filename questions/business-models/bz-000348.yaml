area: business-models
kind: evidence
topic: 'Subscription Business Model: Selling Ongoing Access'
topic_type: BusinessModel
true_statement: Lambrecht and Skiera found that internet customers who picked a flat rate when pay-per-use was cheaper did not churn significantly more, while those wrongly on pay-per-use churned much more.
false_statement: Lambrecht and Skiera found that internet customers who picked a flat rate when pay-per-use was cheaper churned much more, while those wrongly on pay-per-use did not churn significantly more.
explanation: Customers paid extra for a flat rate to insure against variable bills, enjoy usage without a running meter, or because they overestimated use. That bias raised profit without raising churn, which is part of why flat-rate subscriptions can beat their unit economics.
