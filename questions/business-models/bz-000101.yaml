topic: Razor and Blades
topic_type: BusinessModel
true_statement: 'The razor-and-blades model works as price discrimination: a low base price draws in light users, while consumable margins extract more from heavy users.'
false_statement: 'The razor-and-blades model works as price discrimination: a low consumable price draws in heavy users, while base-product margins extract more from light users.'
explanation: Economists treat it as a two-part tariff, with the base product as an entry fee and the consumable as a per-use charge. Since heavy users buy more consumables, they pay more in total for the same base product.
