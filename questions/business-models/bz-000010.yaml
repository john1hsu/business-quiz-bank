true_statement: Jean-Charles Rochet and Jean Tirole formalized two-sided markets in a 2003 paper whose model was built around the payment-card industry.
false_statement: Jean-Charles Rochet and Jean Tirole formalized two-sided markets in a 2003 paper whose model was built around the newspaper industry.
explanation: Their 2003 Journal of the European Economic Association paper modelled how card platforms split prices between cardholders and merchants. Armstrong's 2006 paper later extended the analysis to competing platforms.
