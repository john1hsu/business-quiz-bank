topic: Business Format Franchising
topic_type: BusinessModel
true_statement: Under the FTC Franchise Rule, a deal is a franchise if it involves a trademark, significant control or assistance, and a payment of at least $500 within six months, whatever it is called.
false_statement: Under the FTC Franchise Rule, a deal is a franchise if it involves a trademark, significant control or assistance, and a payment of at least $5,000 within six months, whatever it is called.
explanation: Only these three elements decide whether the Rule applies, so it covers business-format and product franchises alike regardless of the label. Covered franchisors must give prospects a 23-item Franchise Disclosure Document at least 14 days before signing or payment.
