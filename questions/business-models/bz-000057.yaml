true_statement: In a National Academies Press experiment, adding a premium e-book raised paperback revenue more than adding a premium hardback did.
false_statement: In a National Academies Press experiment, adding a premium hardback raised paperback revenue more than adding a premium e-book did.
explanation: Gu, Kannan and Ma found gains of 21.5% with the e-book versus 8.9% with the hardback, which they put down to compromise and attraction effects. They also warned that a cheaper premium option can cannibalize the existing paid product.
