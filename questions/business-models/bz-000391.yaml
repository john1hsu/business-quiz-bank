topic: 'Long Tail: Aggregating Demand for Niche Products'
topic_type: BusinessModel
true_statement: Greater variety at online booksellers raised U.S. consumer welfare by an estimated $731 million to $1.03 billion in 2000, 7 to 10 times the gain from lower prices.
false_statement: Greater variety at online booksellers raised U.S. consumer welfare by an estimated $731 million to $1.03 billion in 2000, about one-tenth the gain from lower prices.
explanation: Brynjolfsson, Hu and Smith found Amazon offered over 23 times the titles of a typical superstore. Access to obscure books, not cheaper prices, was the main benefit of online bookselling to consumers.
