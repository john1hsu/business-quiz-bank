topic: Direct Selling
topic_type: BusinessModel
true_statement: In a 2017 letter, FTC Chairwoman Edith Ramirez said lawful multi-level plans tie pay to profitable retail sales to customers outside the network, not to recruiting.
false_statement: In a 2017 letter, FTC Chairwoman Edith Ramirez said lawful multi-level plans tie pay to recruiting and participants' own purchases, not to outside retail sales.
explanation: Rewards for recruiting or for sellers' own consumption let a plan run on its own participants, the mark of a pyramid scheme. FTC staff turned these principles into formal business guidance in January 2018.
