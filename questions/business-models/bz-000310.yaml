topic: 'Business Model: How a Firm Creates, Delivers and Captures Value'
topic_type: Concept
true_statement: Casadesus-Masanell and Ricart define strategy as a contingent plan for which business model to use, and the business model as the reflection of the firm's realised strategy.
false_statement: Casadesus-Masanell and Ricart define the business model as a contingent plan for which strategy to use, and strategy as the reflection of the firm's realised business model.
explanation: In their view every organization has a business model, but not every one has a strategy. Tactics are the residual choices the business model leaves open.
