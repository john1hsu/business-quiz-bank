topic: Membership Warehouse Club
topic_type: BusinessModel
true_statement: Courtemanche and Carden found that a new Costco is associated with higher prices at nearby grocery stores, while Sam's Club entry had no detectable effect.
false_statement: Courtemanche and Carden found that a new Costco is associated with lower prices at nearby grocery stores, while Sam's Club entry had no detectable effect.
explanation: Prices rose about 1.4% in the short run and 2.7% in the long run. A plausible reason is that incumbents stop chasing the most price-sensitive shoppers, who defect to the club, and target the rest or compete on amenities.
