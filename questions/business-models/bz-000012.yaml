topic: Two-Sided Market
topic_type: Concept
true_statement: In Ohio v. American Express (2018), a 5–4 Supreme Court majority defined the card market to include both cardholders and merchants.
false_statement: In Ohio v. American Express (2018), a 5–4 Supreme Court majority defined the card market to include merchants only, not cardholders.
explanation: The majority treated card networks as two-sided transaction platforms and found no proven net harm from Amex's anti-steering rules. Justice Breyer's dissent argued the two sides are complements and should not be merged into one market.
