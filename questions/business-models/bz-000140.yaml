area: business-models
kind: mechanism
topic: Software as a Service
topic_type: BusinessModel
true_statement: Because SaaS subscription revenue is recognized ratably over the contract term, a slump in new bookings shows up in reported revenue only gradually.
false_statement: Because SaaS subscription revenue is recognized upfront at contract signing, a slump in new bookings shows up in reported revenue immediately.
explanation: Each contract's revenue is spread across its 12 to 36 month term, so reported revenue lags bookings. Cash billed annually in advance meanwhile builds a large deferred revenue balance on the balance sheet.
