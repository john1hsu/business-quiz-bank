id: bz-000011
area: business-models
kind: mechanism
topic: Two-Sided Market
topic_type: Concept
true_statement: When one side of a two-sided market multi-homes, platforms compete hardest for the single-homing side and can charge the multi-homing side more.
false_statement: When one side of a two-sided market multi-homes, platforms compete hardest for the multi-homing side and can charge the single-homing side more.
explanation: A single-homing user is reachable only through the platform it joins, so platforms fight for those users and then charge the other side for access to them. That is Armstrong's 'competitive bottleneck' result.
