true_statement: Fritscher and Pigneur note that most canvas use stays basic, analysing one business model at a single point in time, a weakness they trace to its static ontology.
false_statement: Fritscher and Pigneur note that most canvas use stays basic, analysing one business model at a single point in time, a weakness they trace to its lack of a revenue block.
explanation: The canvas already has a Revenue Streams block; the limit is that its ontology describes a model as a snapshot. Fritscher and Pigneur propose coherence rules, cause-and-effect mechanics and layered versioning to make it dynamic.
