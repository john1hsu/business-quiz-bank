topic: 'Platform Business Model: Value Creation by Orchestrating External Producers and Consumers'
topic_type: BusinessModel
true_statement: Hagiu and Wright argue vertical integration coordinates spillovers better, while a multi-sided platform wins when suppliers' effort and private information matter most.
false_statement: Hagiu and Wright argue a multi-sided platform coordinates spillovers better, while vertical integration wins when suppliers' effort and private information matter most.
explanation: Letting independent suppliers deal directly with customers motivates them and uses what they know, which suits an MSP. When one party's choices spill over onto others, owning the whole chain makes coordination easier.
