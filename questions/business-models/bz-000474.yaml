id: bz-000474
area: business-models
kind: mechanism
topic: 'Aggregation Theory: How Internet Aggregators Capture Value by Owning Demand'
topic_type: Theory
true_statement: 'Ben Thompson''s aggregation theory builds on the conservation of attractive profits: when one stage of a value chain is commoditized, profits migrate to an adjacent stage that stays integrated.'
false_statement: 'Ben Thompson''s aggregation theory builds on the conservation of attractive profits: when one stage of a value chain is commoditized, profits migrate into that stage as its volume grows.'
explanation: In Thompson's account the internet modularized supply, so profit moved to firms that integrated the user relationship with that commoditized supply. A commoditized stage loses pricing power, which is why profits flow away from it, not into it.
