true_statement: The Business Model Canvas grew out of Alexander Osterwalder's 2004 doctoral dissertation at the University of Lausanne, which built a formal business model ontology.
false_statement: The Business Model Canvas grew out of Alexander Osterwalder's 2004 doctoral dissertation at the University of St. Gallen, which built a formal business model ontology.
explanation: Osterwalder's Lausanne thesis aimed to give the field a shared vocabulary, since one survey drew 54 definitions of business model from 62 respondents. A 2005 tutorial with Pigneur and Tucci condensed it into nine blocks, and the 2010 book made the canvas famous.
