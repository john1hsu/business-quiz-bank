true_statement: Chris Anderson, then editor of Wired, introduced the long tail in the magazine's October 2004 issue and later expanded it into a book.
false_statement: Chris Anderson, then editor of Wired, introduced the long tail in the magazine's October 2008 issue and later expanded it into a book.
explanation: Anderson built the idea on 2004 data from Amazon, Netflix and Rhapsody showing large sales outside the titles a physical store could stock. 2008 is the year of Anita Elberse's best-known critique in Harvard Business Review.
