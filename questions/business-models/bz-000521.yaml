true_statement: On the Business Model Canvas, a free newspaper maps both readers and advertisers as separate customer segments, because each group depends on the other.
false_statement: On the Business Model Canvas, a free newspaper maps advertisers as its customer segment and readers as a key resource, because only advertisers pay.
explanation: 'The canvas treats each interdependent group in a multi-sided model as its own segment: readers attract the advertisers whose money funds the paper. The same logic maps cardholders and merchants for a credit card company.'
