true_statement: The word freemium was coined in 2006 by venture capitalist Fred Wilson together with Jarid Lukin, whom Wilson credited with proposing it.
false_statement: The word freemium was coined in 1996 by venture capitalist Fred Wilson together with Jarid Lukin, whom Wilson credited with proposing it.
explanation: The term blends free and premium and dates from the mid-2000s web era of low-cost software distribution. Wilson popularized it but gave Lukin the credit for first suggesting the name.
