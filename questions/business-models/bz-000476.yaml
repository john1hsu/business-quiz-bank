topic: 'Aggregation Theory: How Internet Aggregators Capture Value by Owning Demand'
topic_type: Theory
true_statement: Thibault Schrepel argues antitrust should separate platforms such as Android from aggregators such as Google Search, as aggregators are more prone to exploitative conduct.
false_statement: Thibault Schrepel argues antitrust should separate platforms such as Google Search from aggregators such as Android, as aggregators are more prone to exploitative conduct.
explanation: For Schrepel a platform is a base others build on, like Android, while an aggregator collects and sorts existing offerings for users, like Google Search. Because suppliers depend on reaching an aggregator's users, the two belong in different relevant markets and pose different harms.
