topic: Razor and Blades
topic_type: BusinessModel
true_statement: During its patent years, Gillette sold its razor at a high price, launching a low-priced razor only after the patents expired in 1921.
false_statement: During its patent years, Gillette gave its razor away cheaply, launching a high-priced razor only after the patents expired in 1921.
explanation: Randal Picker showed Gillette charged $5 for a razor with 12 blades from 1904, while rivals sold handles for about $1. The $1 Brownie razor came in 1921, so the founding legend of cheap razors and dear blades does not fit the record.
