true_statement: Hilti moved from selling power tools to leasing managed tool fleets for a monthly fee, which required a new profit formula and much longer sales cycles.
false_statement: Hilti moved from leasing managed tool fleets to selling power tools outright, which required a new profit formula and much shorter sales cycles.
explanation: 'The shift illustrates that business model elements are interdependent: changing how value is captured forced changes in resources, processes and how salespeople worked. Sales staff had to be retrained for the new model.'
