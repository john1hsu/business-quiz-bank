id: bz-000221
area: business-models
kind: definition
topic: Direct Selling
topic_type: BusinessModel
true_statement: Direct selling means face-to-face selling away from a fixed retail location, unlike direct marketing such as catalogs and telemarketing, which uses no personal salesperson.
false_statement: Direct marketing means face-to-face selling away from a fixed retail location, unlike direct selling such as catalogs and telemarketing, which uses no personal salesperson.
explanation: Peterson and Wotruba made the personal salesperson the defining feature of direct selling, which is exactly what direct marketing lacks. They also treated pyramid schemes as a degenerate form of direct selling rather than its definition.
