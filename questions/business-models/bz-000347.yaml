topic: 'Subscription Business Model: Selling Ongoing Access'
topic_type: BusinessModel
true_statement: In the shifted-beta-geometric model, a subscriber cohort's retention rate rises over time because high-churn customers leave first, not because individuals grow more loyal.
false_statement: In the shifted-beta-geometric model, a subscriber cohort's retention rate rises over time because individuals grow more loyal, not because high-churn customers leave first.
explanation: Fader and Hardie give each customer a constant churn probability that varies across customers. As the churn-prone drop out, the survivors are the low-churn types, so aggregate retention climbs even though nobody's own probability changes.
