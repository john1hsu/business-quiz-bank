topic: 'Marketing Mix: The Four Ps of Product, Price, Place and Promotion'
topic_type: Framework
true_statement: For services, Booms and Bitner extended the mix to 7Ps by adding people, physical evidence and process to product, price, place and promotion.
false_statement: For services, Booms and Bitner extended the mix to 7Ps by adding people, packaging and positioning to product, price, place and promotion.
explanation: In a service the staff, the setting and the delivery process are part of what the customer buys, so the original four levers missed them. Their 1981 proposal became the standard services-marketing mix.
