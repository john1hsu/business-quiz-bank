true_statement: E-S-QUAL rates how well a website enables efficient shopping, purchasing and delivery, while E-RecS-QUAL covers customers who had a problem or needed help.
false_statement: E-RecS-QUAL rates how well a website enables efficient shopping, purchasing and delivery, while E-S-QUAL covers customers who had a problem or needed help.
explanation: Parasuraman, Zeithaml and Malhotra's 2005 E-S-QUAL has 22 items on efficiency, fulfillment, system availability and privacy. The smaller companion E-RecS-QUAL handles service recovery, covering responsiveness, compensation and contact, and its authors called it preliminary because small samples limited its validation.
