topic: 'Pricing Strategy: Value-Based, Cost-Based and Competition-Based Pricing'
topic_type: Strategy
true_statement: In pricing practice, unit cost sets the floor, competitors' prices set a reference point, and customer value sets the ceiling a strategy tries to approach.
false_statement: In pricing practice, customer value sets the floor, competitors' prices set a reference point, and unit cost sets the ceiling a strategy tries to approach.
explanation: Pricing below cost loses money on each unit, while buyers will not pay more than the product is worth to them. A supermarket that priced a yogurt from cost alone risked leaving money on the table below that value ceiling.
