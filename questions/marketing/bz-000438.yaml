topic: 'Services Marketing: Managing Intangible, Inseparable, Variable and Perishable Offerings'
topic_type: Field
true_statement: The canonical four service traits (intangibility, inseparability, variability, perishability) come from a 1985 Journal of Marketing review by Zeithaml, Parasuraman and Berry.
false_statement: The canonical four service traits (intangibility, inseparability, variability, perishability) come from a 1966 list of service differences drawn up by Rathmell.
explanation: Zeithaml, Parasuraman and Berry distilled the IHIP list from a systematic literature review in 1985. Rathmell's 1966 list was an earlier, longer attempt naming 13 differences, and Lovelock later proposed seven.
