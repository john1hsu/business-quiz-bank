true_statement: Tellis's 1988 meta-analysis found an average brand price elasticity of about −1.76, making price roughly ten times as powerful as advertising.
false_statement: Tellis's 1988 meta-analysis found an average brand price elasticity of about −1.76, making advertising roughly ten times as powerful as price.
explanation: After bias corrections, average advertising elasticity was only 0.22. Tellis also showed that estimates depend on the model used, so a published average should not be plugged into a firm's own pricing.
