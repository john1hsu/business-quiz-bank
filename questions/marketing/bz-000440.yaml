topic: 'Services Marketing: Managing Intangible, Inseparable, Variable and Perishable Offerings'
topic_type: Field
true_statement: 'Hotels and airlines use off-peak pricing to fill rooms and seats because services are perishable: an unsold night or seat cannot be stored and sold later.'
false_statement: 'Hotels and airlines use off-peak pricing to fill rooms and seats because services are variable: quality depends on who delivers the service, when and how.'
explanation: Perishability means unused capacity is lost for good, so firms shift demand toward slack periods with lower prices, much as bars use happy hours. Variability is a different trait, met with staff training and standards rather than pricing.
