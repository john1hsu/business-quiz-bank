true_statement: Responding to critics in 1994, the gaps model's authors split expectations into desired and adequate levels, with a zone of tolerance between them.
false_statement: Responding to critics in 1994, the gaps model's authors dropped expectations altogether and measured perceived performance alone.
explanation: Critics such as Cronin and Taylor questioned whether expectations were needed at all. Rather than abandon them, the authors refined them, recognizing that customers accept a range of service rather than a single target.
