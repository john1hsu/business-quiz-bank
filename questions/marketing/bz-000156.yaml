topic: Price Elasticity
topic_type: Metric
true_statement: When demand is price elastic, a price cut raises total revenue because the volume gain outweighs the lower price per unit.
false_statement: When demand is price inelastic, a price cut raises total revenue because the volume gain outweighs the lower price per unit.
explanation: 'Total revenue is price times quantity, and elastic demand means quantity moves proportionally more than price. With inelastic demand the opposite holds: a price rise, not a cut, raises revenue.'
