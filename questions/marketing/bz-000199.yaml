true_statement: In Parasuraman and Colby's 2014 TRI 2.0 study of U.S. adults, 38% of consumers were classed as Skeptics and 16% as Pioneers.
false_statement: In Parasuraman and Colby's 2014 TRI 2.0 study of U.S. adults, 16% of consumers were classed as Skeptics and 38% as Pioneers.
explanation: TRI 2.0 trimmed the original 36-item index to 16 items, was tested on 878 U.S. adults, and used the scores to sort consumers into five readiness segments. The cautious Skeptics outnumbered the eager Pioneers by more than two to one in that sample.
