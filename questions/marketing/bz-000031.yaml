true_statement: Market segmentation is usually traced to Wendell Smith's 1956 Journal of Marketing article on differentiation and segmentation.
false_statement: Market segmentation is usually traced to Al Ries and Jack Trout's 1956 Journal of Marketing article on differentiation and segmentation.
explanation: Wendell R. Smith argued in 1956 that products find their best markets by recognising differences between segments. Ries and Trout contributed positioning, first published in 1969 and popularised in the 1970s and 1980s.
