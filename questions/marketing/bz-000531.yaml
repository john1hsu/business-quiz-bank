topic: 'Churn Rate: Measuring Customer Attrition and Retention'
topic_type: Metric
true_statement: Reichheld and Sasser argued in a 1990 Harvard Business Review article that retaining just 5% more customers could raise profits by nearly 100% in the service businesses they studied.
false_statement: Reichheld and Sasser argued in a 1990 Harvard Business Review article that retaining just 5% more customers could raise profits by nearly 10% in the service businesses they studied.
explanation: Their point was that defections can matter more to profit than scale, market share or unit cost, so the defection rate works as a leading indicator. A gain of only about 10% would not have supported that bold claim.
