id: bz-000075
area: marketing
kind: application
topic: Customer Lifetime Value
topic_type: Metric
true_statement: In a newspaper study, subscribers acquired with a steep discount renewed at half the rate of regular-price subscribers and were worth about half as much.
false_statement: In a newspaper study, subscribers acquired with a steep discount renewed at twice the rate of regular-price subscribers and were worth about twice as much.
explanation: Deep discounts attract customers who value the product less, so they lapse sooner. CLV makes this visible, which is why it is used to discipline promotions rather than judging them by sign-up volume alone.
