topic: 'Brand Equity: The Marketing Value of a Brand Name'
topic_type: Concept
true_statement: Customer-based brand equity is the differential effect brand knowledge has on how consumers respond to a brand's marketing, while the financial view measures incremental cash flow.
false_statement: Customer-based brand equity is the incremental cash flow branded products earn over unbranded ones, while the financial view measures consumers' differential response to marketing.
explanation: 'Keller''s customer-based view looks inside buyers'' heads: a brand has positive equity when people react better to its price or advertising than to an unnamed offer. The financial view, used by Simon and Sullivan, isolates the extra cash the brand earns.'
