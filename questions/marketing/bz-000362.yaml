topic: 'Pricing Strategy: Value-Based, Cost-Based and Competition-Based Pricing'
topic_type: Strategy
true_statement: Averaging pricing studies from 1983–2006, Hinterhuber found only about 17% of firms set prices from customer value, versus about 44% from competition.
false_statement: Averaging pricing studies from 1983–2006, Hinterhuber found about 44% of firms set prices from customer value, versus only about 17% from competition.
explanation: Competition-based pricing was most common and cost-based came second at about 37%, leaving value-based pricing last even though scholars rate it the strongest approach. Hinterhuber traced the gap to obstacles such as hard-to-assess value and discount-prone sales forces.
