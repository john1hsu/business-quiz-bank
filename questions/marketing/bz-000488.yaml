topic: 'Customer Satisfaction: Expectations, Disconfirmation and the Link to Loyalty and Profit'
topic_type: Concept
true_statement: Oliver argued in 1999 that satisfaction is a necessary step toward loyalty but an unreliable predictor of it, since many satisfied customers still defect.
false_statement: Oliver argued in 1999 that satisfaction is a reliable predictor of loyalty, since satisfied customers almost always buy again unless a rival undercuts them on price.
explanation: Satisfaction is a judgment after consumption, while loyalty is a commitment to buy again. In Oliver's view satisfaction grows into loyalty only with extra ingredients such as personal commitment and social bonds, so a high score is no proof of retention.
