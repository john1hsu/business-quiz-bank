id: bz-000324
area: marketing
kind: evidence
topic: 'Brand Equity: The Marketing Value of a Brand Name'
topic_type: Concept
true_statement: Ailawadi, Lehmann and Neslin proposed the revenue premium, the extra revenue a brand earns over a comparable private-label product, as a middle-path brand equity measure.
false_statement: Ailawadi, Lehmann and Neslin proposed the price premium, the extra price a brand charges over a comparable private-label product, as a middle-path brand equity measure.
explanation: Revenue captures both price and volume, so it avoids the subjectivity of mindset surveys and the assumptions of market-value methods. They found it reliable and responsive to real changes in brand strength.
