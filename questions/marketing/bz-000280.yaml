true_statement: A pizza chain promising 30-minute delivery without the operations to back it illustrates the gaps model's communication gap.
false_statement: A pizza chain promising 30-minute delivery without the operations to back it illustrates the gaps model's listening gap.
explanation: The communication gap (Gap 4) is between the service delivered and what external messages promised. The listening gap is about misreading what customers expect, which IKEA addressed with focus groups for a Chicago store.
