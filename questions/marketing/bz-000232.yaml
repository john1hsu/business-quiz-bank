topic: SERVQUAL
topic_type: Metric
true_statement: Cronin and Taylor found that a performance-only measure, later called SERVPERF, captured service quality better than SERVQUAL's gap scores.
false_statement: Cronin and Taylor found that an expectations-only measure, later called SERVPERF, captured service quality better than SERVQUAL's gap scores.
explanation: Cronin and Taylor argued in 1992 that subtracting expectations blends satisfaction with attitude, so they dropped expectations and used perceived performance alone. SERVPERF became SERVQUAL's main alternative.
