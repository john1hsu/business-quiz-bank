true_statement: SERVQUAL's five dimensions of service quality are tangibles, reliability, responsiveness, assurance and empathy.
false_statement: SERVQUAL's five dimensions of service quality are tangibles, reliability, responsiveness, competence and empathy.
explanation: Focus groups first surfaced ten criteria, but scale purification collapsed them into five dimensions. Competence was one of the original ten but did not survive as a dimension, because assurance and empathy absorbed items from seven of those criteria.
