id: bz-000032
area: marketing
kind: mechanism
topic: Segmentation, Targeting and Positioning
topic_type: Framework
true_statement: Good segmentation bases explain differences in how customers buy or use a product; demographics mostly serve as descriptors to find and reach segments.
false_statement: Good segmentation bases are demographics such as age and sex; buying and usage behavior mostly serve as descriptors to find and reach segments.
explanation: Wind and Bell separate bases, which should predict response to marketing (usage, benefits sought, price sensitivity), from descriptors used to locate those customers. Age or sex alone often predicts response poorly.
