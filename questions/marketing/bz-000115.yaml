topic: Cannibalization
topic_type: Concept
true_statement: Cannibalization slows incumbents' adoption of new technology, while preemption, the motive to launch before rivals can, speeds it up.
false_statement: Preemption slows incumbents' adoption of new technology, while cannibalization, the motive to launch before rivals can, speeds it up.
explanation: An incumbent launching a new technology mostly replaces its own profit stream, so its net gain is smaller than a start-up's. Preemption pushes the other way, since waiting lets rivals take the new market.
