true_statement: Parasuraman's Technology Readiness Index pairs two motivators, optimism and innovativeness, with two inhibitors, discomfort and insecurity.
false_statement: Parasuraman's Technology Readiness Index pairs two motivators, optimism and insecurity, with two inhibitors, discomfort and innovativeness.
explanation: The index measures a person's propensity to embrace new technology at home and at work, so it nets the forces pulling people toward it (optimism, innovativeness) against those holding them back (discomfort, insecurity). Insecurity is a brake on adoption, not a motivator.
