topic: 'Customer Satisfaction: Expectations, Disconfirmation and the Link to Loyalty and Profit'
topic_type: Concept
true_statement: Re-running the ACSI stock-return analysis, Jacobson and Mizik found significant mispricing only among computer and Internet firms, not a market-wide failure to price satisfaction.
false_statement: Re-running the ACSI stock-return analysis, Jacobson and Mizik found significant mispricing across nearly every sector, confirming a market-wide failure to price satisfaction.
explanation: Fornell and colleagues had read their high-ACSI portfolio's excess returns as a market imperfection. Jacobson and Mizik traced the effect to a small group of high-satisfaction tech firms in that window, which weakens the claim against the efficient-market hypothesis.
