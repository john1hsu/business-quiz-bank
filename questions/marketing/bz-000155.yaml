true_statement: Alfred Marshall formalized price elasticity of demand in Principles of Economics, first published in 1890, in a chapter titled "The Elasticity of Wants."
false_statement: Alfred Marshall formalized price elasticity of demand in Principles of Economics, first published in 1920, in a chapter titled "The Elasticity of Wants."
explanation: Marshall's chapter already set out most determinants still taught, such as necessities being inelastic and close substitutes raising elasticity. The 1920 date is the book's 8th edition, not its first.
