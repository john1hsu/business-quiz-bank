topic: Customer Lifetime Value
topic_type: Metric
true_statement: With constant margins and an infinite horizon, CLV equals margin times r/(1 + i − r), a multiple of about 4 at 90% retention and a 12% discount rate.
false_statement: With constant margins and an infinite horizon, CLV equals margin times r/(1 + i − r), a multiple of about 9 at 90% retention and a 12% discount rate.
explanation: Plugging in gives 0.9 / (1.12 − 0.9) = 0.9 / 0.22, or roughly 4.1. The 9 confuses the retention rate with the multiple; discounting and the chance of defection both shrink the value of future margins.
