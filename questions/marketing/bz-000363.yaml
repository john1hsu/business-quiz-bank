topic: 'Pricing Strategy: Value-Based, Cost-Based and Competition-Based Pricing'
topic_type: Strategy
true_statement: A study of digital camera launches found plain market pricing was far more common than either price skimming or penetration pricing.
false_statement: A study of digital camera launches found price skimming was far more common than either plain market pricing or penetration pricing.
explanation: Spann, Fischer and Tellis found skimming and penetration each described only about a fifth of launch paths, with market pricing covering the rest. Crowded markets and late entry left little room for a distinct strategic price.
