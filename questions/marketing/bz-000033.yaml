topic: Segmentation, Targeting and Positioning
topic_type: Framework
true_statement: Yankelovich and Meer argued in 2006 that firms should keep segmentations for building brand identity separate from those for choosing markets and products.
false_statement: Yankelovich and Meer argued in 2006 that firms should use one psychographic segmentation for both building brand identity and choosing markets and products.
explanation: They found demographic and psychographic segments, often reduced to ad personas, predicted purchases poorly. Their fix was to use different segmentations for different decisions rather than one for everything.
