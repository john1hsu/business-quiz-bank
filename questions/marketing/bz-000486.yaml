topic: 'Customer Satisfaction: Expectations, Disconfirmation and the Link to Loyalty and Profit'
topic_type: Concept
true_statement: Richard Oliver's 1980 expectancy-disconfirmation model, tested on a flu inoculation programme, makes satisfaction depend on prior expectations and how far experience departs from them.
false_statement: Claes Fornell's 1996 expectancy-disconfirmation model, tested on a flu inoculation programme, makes satisfaction depend on prior expectations and how far experience departs from them.
explanation: Oliver set out the model in the Journal of Marketing Research in 1980, so the same performance can delight one customer and disappoint another who expected more. Fornell's 1996 contribution was the American Customer Satisfaction Index, a measurement system, not this model.
