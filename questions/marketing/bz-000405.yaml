topic: 'Marketing Mix: The Four Ps of Product, Price, Place and Promotion'
topic_type: Framework
true_statement: 'Constantinides'' 2006 review found two weaknesses of the 4Ps common across marketing fields: an internal, seller-side orientation and no room for personalisation.'
false_statement: 'Constantinides'' 2006 review found two weaknesses of the 4Ps common across marketing fields: an external, customer-side orientation and too much room for personalisation.'
explanation: The mix was built for mass markets and describes what the seller controls, not what customers need. That gap is why relationship and services marketers proposed alternatives or extensions.
