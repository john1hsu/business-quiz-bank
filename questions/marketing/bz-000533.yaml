topic: 'Churn Rate: Measuring Customer Attrition and Retention'
topic_type: Metric
true_statement: T-Mobile US reported branded postpaid phone churn of 1.18% for 2017, far below its branded prepaid churn of 4.04% that year.
false_statement: T-Mobile US reported branded prepaid churn of 1.18% for 2017, far below its branded postpaid phone churn of 4.04% that year.
explanation: Postpaid phone customers left at roughly a quarter of the prepaid rate in 2017. T-Mobile credited part of that year's postpaid improvement to moving higher-churn customers to a wholesale partner, so reported churn can also change through who is counted.
