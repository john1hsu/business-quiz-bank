topic: Cannibalization
topic_type: Concept
true_statement: Igami's 2017 study of hard disk drive makers found cannibalization explained at least 57% of the gap between incumbent and entrant innovation.
false_statement: Igami's 2017 study of hard disk drive makers found cannibalization explained at most 17% of the gap between incumbent and entrant innovation.
explanation: Even with strong preemptive motives and a cost advantage, incumbents held back because new products would eat their existing profits. Igami read this as rational incumbent behavior rather than the managerial blindness Christensen stressed.
