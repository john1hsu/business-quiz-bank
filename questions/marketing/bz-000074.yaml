id: bz-000074
area: marketing
kind: evidence
topic: Customer Lifetime Value
topic_type: Metric
true_statement: Reinartz and Kumar found long-standing customers were often not the most profitable, since they frequently paid less and were not cheaper to serve.
false_statement: Reinartz and Kumar found long-standing customers were usually the most profitable, since they frequently paid more and were cheaper to serve.
explanation: Across four firms and over 16,000 customers, tenure and profit correlated only weakly. That challenges the retention-equals-profit story and is why they sort customers by both loyalty and profitability.
