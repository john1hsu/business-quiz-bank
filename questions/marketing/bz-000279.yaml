topic: Gaps Model of Service Quality
topic_type: Framework
true_statement: In the gaps model, a hotel rule that phones be answered quickly is too vague and creates a standards gap; staff ignoring a clear two-ring rule create a delivery gap.
false_statement: In the gaps model, a hotel rule that phones be answered quickly is too vague and creates a delivery gap; staff ignoring a clear two-ring rule create a standards gap.
explanation: The standards gap (Gap 2) lies between what management knows customers want and the specifications it sets. The delivery gap (Gap 3) opens when a clear specification exists but service falls short of it, often from weak training or understaffing.
