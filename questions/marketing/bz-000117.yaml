true_statement: Newspapers whose websites closely copied the print edition were far more likely to lose circulation, suggesting differentiation, not abstention, limits channel cannibalization.
false_statement: Newspapers whose websites differed most from the print edition were far more likely to lose circulation, suggesting abstention, not differentiation, limits channel cannibalization.
explanation: Deleersnyder and colleagues found most papers suffered no significant slowdown from adding a website. Those that did had much higher content overlap with print, about 78% versus 45%.
