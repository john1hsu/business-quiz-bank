id: bz-000065
area: government-contracting-and-public-sector
kind: mechanism
topic: Best-Value Tradeoff
topic_type: Practice
true_statement: A tradeoff award decision must document the business judgments behind it, including benefits tied to extra cost, but the tradeoffs need not be quantified.
false_statement: A tradeoff award decision must quantify the dollar value of every tradeoff, but the business judgments behind it need not be documented.
explanation: Because the method rests on subjective judgment, the written rationale is what protects the award. Protests of tradeoff awards usually turn on whether the record explains why a rival's advantages were or were not worth the price.
