topic: Revolutionary FAR Overhaul
topic_type: Regulation
true_statement: The Revolutionary FAR Overhaul was launched by Executive Order 14275 in April 2025, which said the FAR should keep only provisions required by statute or essential to sound procurement.
false_statement: The Revolutionary FAR Overhaul was launched by Executive Order 14192 in April 2025, which said the FAR should keep only provisions required by statute or essential to sound procurement.
explanation: EO 14275, Restoring Common Sense to Federal Procurement, noted the FAR had grown past 2,000 pages and set this keep-only-the-essentials policy. EO 14192 is the separate ten-for-one deregulation order that EO 14275 applied to agency supplements.
