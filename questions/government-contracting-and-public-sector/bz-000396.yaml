topic: 'DFARS: Defense Department Rules Layered on Top of the FAR'
topic_type: Regulation
true_statement: In the DFARS, purely supplemental text uses section numbers of 70 and up, while military department supplements use numbers of 90 and up.
false_statement: In the DFARS, purely supplemental text uses section numbers of 90 and up, while military department supplements use numbers of 70 and up.
explanation: Text that implements a FAR rule keeps the FAR's numbering, so DFARS 201.3 parallels FAR 1.3. Reserved number ranges let readers tell at a glance whether a section implements the FAR, adds a DoD-wide rule or comes from a component.
