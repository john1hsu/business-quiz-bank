area: government-contracting-and-public-sector
kind: evidence
topic: 'Small Business Set-Asides: Reserving Federal Contracts for Small Firms'
topic_type: Practice
true_statement: Nakabayashi estimated that removing set-asides in Japanese public construction would drive out about 40% of small firms and raise procurement costs overall.
false_statement: Nakabayashi estimated that removing set-asides in Japanese public construction would drive out about 40% of small firms but lower procurement costs overall.
explanation: In that market the protected firms would exit without set-asides, and the lost competition costs more than the efficiency gained. US timber-sale evidence points the other way, so a set-aside's cost depends on whether small firms would otherwise stay in.
