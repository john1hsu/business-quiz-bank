topic: 'Government Contract Types: Fixed-Price, Cost-Reimbursement and Incentive Arrangements'
topic_type: Framework
true_statement: Executive Order 14402, signed in April 2026, makes fixed-price contracts with performance-based elements the federal default and requires written justification for any other type.
false_statement: Executive Order 14402, signed in April 2026, makes cost-reimbursement contracts with award fees the federal default and requires written justification for any fixed-price type.
explanation: The order pushes risk toward contractors by defaulting to fixed price, and it adds agency-head approval for large non-fixed-price awards, with exemptions for emergencies and early development of major systems. It continues a line of policy, going back to GAO's 2009 warning, that treats cost-reimbursement as high risk for the government.
