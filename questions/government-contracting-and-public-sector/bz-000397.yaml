topic: 'DFARS: Defense Department Rules Layered on Top of the FAR'
topic_type: Regulation
true_statement: The Section 809 Panel reported in 2018 that, of 165 government clauses for commercial-item buys under the FAR and DFARS, 122 came from statute.
false_statement: The Section 809 Panel reported in 2018 that, of 165 government clauses for commercial-item buys under the FAR and DFARS, 122 came from agency policy.
explanation: The clause count had nearly tripled from 57 in 1995, but only 23 came from agency policy. So much of the complexity contractors blame on DoD actually rests on laws Congress passed.
