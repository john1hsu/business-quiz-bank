id: bz-000238
area: government-contracting-and-public-sector
kind: application
topic: Lowest Price Technically Acceptable
topic_type: Practice
true_statement: Civilian agencies must avoid LPTA as far as practicable for knowledge-based work such as IT, cybersecurity, audit and health-care services.
false_statement: Civilian agencies must use LPTA as far as practicable for knowledge-based work such as IT, cybersecurity, audit and health-care services.
explanation: LPTA gives no credit for exceeding the minimum, which suits simple, repeatable services like telephone maintenance or mail sorting but not knowledge-based work. The FAR therefore steers civilian buyers away from it for those services.
