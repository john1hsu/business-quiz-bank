topic: Federal Acquisition Regulation
topic_type: Regulation
true_statement: Under the FAR, only warranted contracting officers may sign contracts for the government, and only within their written limits.
false_statement: Under the FAR, any agency program manager may sign contracts for the government, as long as funds are available.
explanation: Contracting authority is personal and delegated through a written warrant, and a contracting officer can bind the government only within those limits. Program managers shape requirements but cannot obligate the government.
