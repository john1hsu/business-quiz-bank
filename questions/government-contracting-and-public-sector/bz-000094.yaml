area: government-contracting-and-public-sector
kind: definition
topic: Indefinite Delivery, Indefinite Quantity (IDIQ) Contract
topic_type: Concept
true_statement: Under an IDIQ contract, the government must order a stated minimum that is more than nominal but no more than it is fairly certain to need.
false_statement: Under an IDIQ contract, the government must order the stated maximum, which is set at the most it could conceivably need.
explanation: The minimum is the only quantity the government owes; anything beyond it is ordered through task or delivery orders as needs arise. The maximum is a reasonable ceiling based on market research, not a commitment.
