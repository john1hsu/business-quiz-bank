topic: Indefinite Delivery, Indefinite Quantity (IDIQ) Contract
topic_type: Concept
true_statement: The Federal Acquisition Streamlining Act of 1994 created a preference for multiple-award IDIQs and gave each holder a fair opportunity to be considered for orders.
false_statement: The Federal Acquisition Streamlining Act of 1994 created a preference for single-award IDIQs and gave the incumbent holder first claim on all orders.
explanation: FASA pushed agencies to award several contracts so orders would still be competed among holders. Its exceptions, such as unusual urgency or logical follow-on orders, remain the core of today's fair-opportunity rules.
