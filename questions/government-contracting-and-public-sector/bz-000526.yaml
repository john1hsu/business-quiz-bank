topic: 'Bid Protest: Challenging Federal Contract Awards at GAO'
topic_type: Practice
true_statement: In fiscal 2025 (FY2025), GAO sustained 53 of its 380 bid protest merit decisions, a sustain rate of about 14%.
false_statement: In fiscal 2025 (FY2025), GAO sustained 198 of its 380 bid protest merit decisions, a sustain rate of about 52%.
explanation: Only about one merit decision in seven went the protester's way, which is why protests are rarer winners than their reputation suggests. The 52% figure is GAO's broader effectiveness rate, which also counts voluntary corrective action by agencies.
