topic: 'Contracting Officer: Warranted Authority to Bind the Government'
topic_type: Concept
true_statement: In Federal Crop Insurance Corp. v. Merrill (1947), the Supreme Court held that anyone dealing with the government bears the risk of confirming an official acts within his authority.
false_statement: In Federal Crop Insurance Corp. v. Merrill (1947), the Supreme Court held that the government bears the risk when its official wrongly assures a private party he acts within his authority.
explanation: Idaho farmers relied on an agent's wrong assurance that reseeded wheat was covered and were refused payment. Published regulations count as notice to all, a principle the FAR now codifies in its contracting-authority rules.
