topic: 'DFARS: Defense Department Rules Layered on Top of the FAR'
topic_type: Regulation
true_statement: Before the FAR took effect in 1984, DoD bought under the Defense Acquisition Regulation, which had been called the Armed Services Procurement Regulation until 1978.
false_statement: Before the FAR took effect in 1984, DoD bought under the Defense Acquisition Regulation, which had been called the Federal Procurement Regulations until 1978.
explanation: The Federal Procurement Regulations were the civilian agencies' rules. When the single FAR replaced both systems, DoD's remaining unique rules moved into the DFARS, codified right after the FAR in Title 48.
