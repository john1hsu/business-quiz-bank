area: government-contracting-and-public-sector
kind: definition
topic: 'Contracting Officer: Warranted Authority to Bind the Government'
topic_type: Concept
true_statement: A contracting officer's representative handles day-to-day technical oversight but has no power to change a contract's price, quantity, quality or delivery terms.
false_statement: A contracting officer's representative handles day-to-day technical oversight and may change a contract's price, quantity, quality or delivery terms within delegated limits.
explanation: The COR is delegated monitoring duties in writing, cannot redelegate and can be personally liable for unauthorized acts. Changing contract terms stays with the warranted contracting officer.
