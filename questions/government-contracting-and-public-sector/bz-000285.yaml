id: bz-000285
area: government-contracting-and-public-sector
kind: mechanism
topic: Truth in Negotiations Act
topic_type: Regulation
true_statement: Under TINA's defective-pricing rules, liability for overpricing stays with the contractor even if the contracting officer should have caught the error in its data.
false_statement: Under TINA's defective-pricing rules, liability for overpricing shifts to the government if the contracting officer should have caught the error in its data.
explanation: The FAR bars that defense, along with claims of sole-source status, superior bargaining power or an unsigned certificate. The burden of accurate, complete and current data stays with the seller, and the government can recover the overpayment plus interest.
