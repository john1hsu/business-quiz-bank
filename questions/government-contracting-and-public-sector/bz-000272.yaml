true_statement: A 2016 Naval Postgraduate School analysis argued TINA curbs adverse selection but ignores moral hazard, since beating certified estimates can invite a defective-pricing audit.
false_statement: A 2016 Naval Postgraduate School analysis argued TINA curbs moral hazard but ignores adverse selection, since beating certified estimates can invite a defective-pricing audit.
explanation: Forcing cost disclosure limits the information rents a sole-source seller can extract, which is the adverse-selection problem. But under a fixed price, cutting costs far below the certified estimate looks suspicious, which can dull effort or encourage padding.
