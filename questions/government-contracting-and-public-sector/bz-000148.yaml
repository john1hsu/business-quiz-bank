true_statement: The OECD Recommendation on Public Procurement, adopted in 2015, replaced an earlier recommendation focused on integrity and set out twelve principles.
false_statement: The OECD Recommendation on Public Procurement, adopted in 2008, replaced an earlier recommendation focused on integrity and set out twelve principles.
explanation: The 2015 Recommendation is the main international benchmark, with principles running from transparency and integrity to balance and integration. The 2008 date belongs to the integrity-focused recommendation it replaced.
