true_statement: In DRS Technical Services (2015), GAO denied the protest because the agency's record explained why DRS's technical strengths did not justify a premium of nearly $20 million.
false_statement: In DRS Technical Services (2015), GAO sustained the protest because the agency's record failed to explain why DRS's technical strengths did not justify a premium of nearly $20 million.
explanation: DISA chose General Dynamics at about $132 million over the higher-rated DRS at about $152 million. GAO stressed that a selection official has broad discretion as long as the record explains the judgment.
