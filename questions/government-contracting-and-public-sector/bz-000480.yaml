topic: 'Public Value: Mark Moore''s Strategic Triangle for Public Managers'
topic_type: Framework
true_statement: Mark H. Moore of Harvard's Kennedy School set out the public value framework in Creating Public Value, published by Harvard University Press in 1995.
false_statement: Gerry Stoker of Harvard's Kennedy School set out the public value framework in Creating Public Value, published by Harvard University Press in 1995.
explanation: Moore wrote the 1995 book that framed the public manager's job as creating value for citizens collectively, much as private managers create value for shareholders. Stoker came later, arguing in 2006 that public value management suits networked governance.
