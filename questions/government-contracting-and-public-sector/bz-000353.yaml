area: government-contracting-and-public-sector
kind: definition
topic: 'Small Business Set-Asides: Reserving Federal Contracts for Small Firms'
topic_type: Practice
true_statement: Under the federal rule of two, work must be set aside when a contracting officer expects offers from two or more responsible small businesses at fair market prices.
false_statement: Under the federal rule of two, work must be set aside when a contracting officer expects offers from three or more responsible small businesses at fair market prices.
explanation: 'The rule''s name is its threshold: two credible small-business offers are enough to expect real price competition among small firms. Market research and past buying history inform the judgment, but the test itself is the reasonable expectation of two such offers.'
