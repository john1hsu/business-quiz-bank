id: bz-000444
area: government-contracting-and-public-sector
kind: mechanism
topic: 'Government Contract Types: Fixed-Price, Cost-Reimbursement and Incentive Arrangements'
topic_type: Framework
true_statement: In a cost-plus-fixed-fee contract, the government reimburses allowable costs and pays a fee that stays the same whether costs come in high or low.
false_statement: In a cost-plus-fixed-fee contract, the government reimburses allowable costs and pays a fee that rises in proportion to the costs incurred.
explanation: The fee is fixed at the outset and does not move with cost, which is why this type leaves the contractor minimal cost responsibility at the far end of the FAR Part 16 spectrum. A fee that grew with costs would reward overruns, the opposite of what the fixed fee is meant to avoid.
