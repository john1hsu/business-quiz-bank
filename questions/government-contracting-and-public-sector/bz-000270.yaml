topic: Truth in Negotiations Act
topic_type: Regulation
true_statement: The Truth in Negotiations Act was enacted in 1962 to put contracting officers on an equal factual footing with sellers in deals without real price competition.
false_statement: The Truth in Negotiations Act was enacted in 1982 to put contracting officers on an equal factual footing with sellers in deals without real price competition.
explanation: TINA, Public Law 87-653, dates from 1962. It targets the information gap that favors a contractor in sole-source deals by requiring certified cost or pricing data above a dollar threshold.
