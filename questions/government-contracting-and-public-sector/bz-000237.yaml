true_statement: GAO estimated that about 26% of DoD contracts and orders of $5 million or more competitively awarded in FY2017 used LPTA.
false_statement: GAO estimated that about 62% of DoD contracts and orders of $5 million or more competitively awarded in FY2017 used LPTA.
explanation: The estimate shows LPTA was substantial but far from dominant in defense buying, covering items from fuel and equipment to IT and construction services. A narrower GAO review found only 9 of 133 large IT and support-services contracts used it.
