topic: 'Government Contract Types: Fixed-Price, Cost-Reimbursement and Incentive Arrangements'
topic_type: Framework
true_statement: McAfee and McMillan's 1986 model of contract bidding under moral hazard found the optimal linear contract is never cost-plus and is usually an incentive contract.
false_statement: McAfee and McMillan's 1986 model of contract bidding under moral hazard found the optimal linear contract is never an incentive contract and is usually cost-plus.
explanation: The optimal contract has to balance cost-control incentives against sharing risk with risk-averse bidders and the gains from competition, so it lands between the extremes, usually as an incentive contract and sometimes fixed-price. Pure cost-plus gives the seller no reason to control costs, so the model rules it out.
