true_statement: Across OECD countries, public procurement averaged 12.7% of GDP in 2023, down slightly from 13.0% in 2021.
false_statement: Across OECD countries, public procurement averaged 29.9% of GDP in 2023, down slightly from 30.2% in 2021.
explanation: OECD data put procurement at 12.7% of GDP in 2023, a dip caused mainly by GDP growing faster than procurement spending. The 29.9% figure is procurement's share of total government expenditure, not of GDP, an easy pair to mix up.
