area: government-contracting-and-public-sector
kind: application
topic: 'Small Business Set-Asides: Reserving Federal Contracts for Small Firms'
topic_type: Practice
true_statement: In Kingdomware (2016), a unanimous Supreme Court held that the VA's veteran-business rule of two applies to every covered contract, even after its annual goals are met.
false_statement: In Kingdomware (2016), a unanimous Supreme Court held that the VA's veteran-business rule of two becomes optional for contracts once its annual goals are met.
explanation: The VA had treated the rule as a target it could stop applying after hitting its goals. Justice Thomas's opinion read the statute's 'shall' as a duty covering each contract, including Federal Supply Schedule orders.
