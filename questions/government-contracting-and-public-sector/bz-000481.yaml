topic: 'Public Value: Mark Moore''s Strategic Triangle for Public Managers'
topic_type: Framework
true_statement: In Moore's strategic triangle, "big hat and no cattle" describes an agency that has political support but lacks the operational capacity to deliver.
false_statement: In Moore's strategic triangle, "big hat and no cattle" describes an agency that has the operational capacity to deliver but lacks political support.
explanation: The triangle requires public value, legitimacy and support, and operational capacity to line up; the big hat is the backing from the authorizing environment and the missing cattle is the ability to produce results. Moore's other failure mode is funding that keeps flowing to activities that no longer create value.
