topic: Revolutionary FAR Overhaul
topic_type: Regulation
true_statement: In the Army's MAPS protests, GAO denied all four challenges to a solicitation mixing overhaul deviation clauses with legacy FAR clauses, yet acknowledged the version confusion.
false_statement: In the Army's MAPS protests, GAO sustained all four challenges to a solicitation mixing overhaul deviation clauses with legacy FAR clauses, citing the version confusion.
explanation: GAO found the challenged clauses unchanged or substantively identical, so the protests failed, but it noted the deviation process can leave offerors unsure which version applies. That transitional confusion is the main practical critique of the overhaul so far.
