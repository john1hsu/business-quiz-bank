topic: Lowest Price Technically Acceptable
topic_type: Practice
true_statement: Under LPTA, a small business found unacceptable on past performance is referred to the Small Business Administration for a Certificate of Competency decision.
false_statement: Under LPTA, a small business found unacceptable on past performance is referred to the Government Accountability Office for a Certificate of Competency decision.
explanation: FAR 15.101-2 sends that question to the SBA instead of letting the past-performance rating end the offer outright, which ties LPTA to small-business policy. GAO has reviewed how agencies use LPTA, but the competency decision belongs to the SBA.
