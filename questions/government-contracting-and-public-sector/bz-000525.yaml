topic: 'Bid Protest: Challenging Federal Contract Awards at GAO'
topic_type: Practice
true_statement: A GAO bid protest triggers an automatic stay of performance if GAO notifies the agency within 10 days after award, or within 5 days after a required debriefing.
false_statement: A GAO bid protest triggers an automatic stay of performance if GAO notifies the agency within 30 days after award, or within 15 days after a required debriefing.
explanation: 'The short window is what makes the stay powerful: a protest filed quickly forces the contracting officer to suspend or terminate performance unless agency leadership finds urgent and compelling reasons to override. Thirty days is the deadline for the agency''s report to GAO, not the stay window.'
