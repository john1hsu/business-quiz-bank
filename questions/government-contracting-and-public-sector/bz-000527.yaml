true_statement: Penn State finance researchers found that firms winning a bid protest face a 68% lower chance of getting contracts from the contested agency over the next four years.
false_statement: Penn State finance researchers found that firms winning a bid protest enjoy a 68% higher chance of getting contracts from the contested agency over the next four years.
explanation: 'The finding points to a hidden cost of protesting: even a successful challenge can sour the relationship with the buying agency. It sits alongside critiques that protests push agencies to over-document and favour price-driven or existing contract vehicles.'
