id: bz-000315
area: government-contracting-and-public-sector
kind: application
topic: 'Contracting Officer: Warranted Authority to Bind the Government'
topic_type: Concept
true_statement: An unauthorized commitment can be ratified only if, among other tests, the government received a benefit and a contracting officer finds the price fair and reasonable.
false_statement: An unauthorized commitment can be ratified only if, among other tests, the official who made it held a warrant and a contracting officer finds the price fair and reasonable.
explanation: By definition, an unauthorized commitment is made by someone without authority, so a warrant cannot be a condition. Ratification also requires that a proper contract would have been lawful and that funds were available; otherwise the claim goes to claims procedures.
