true_statement: GAO found that about 60% of IDIQ dollars in FY2011–FY2015 went through single-award contracts, despite the FAR's preference for multiple awards.
false_statement: GAO found that about 60% of IDIQ dollars in FY2011–FY2015 went through multiple-award contracts, in line with the FAR's preference for multiple awards.
explanation: 'This gap is the main critique of IDIQs: weak competition. Single awards raise the risk of vendor lock-in, and GAO also found that 10 of 18 sampled DoD single-award contracts were not competed.'
