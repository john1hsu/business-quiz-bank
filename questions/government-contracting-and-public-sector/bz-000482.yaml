true_statement: Rhodes and Wanna (2009) questioned whether public value suits Westminster governments, with their strong ministers, tight accountability and disciplined party politics.
false_statement: Rhodes and Wanna (2009) questioned whether public value suits networked governance, with its many partners and its reliance on dialogue and exchange across sectors.
explanation: Rhodes and Wanna worried that encouraging unelected managers to define public value could weaken democratic accountability under ministerial government. Networked governance is where supporters such as Stoker argued the approach fits best, so the false version flips critic and supporter.
