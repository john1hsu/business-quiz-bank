topic: Best-Value Tradeoff
topic_type: Practice
true_statement: On the FAR's best value continuum, the tradeoff process lets an agency pay more for a better proposal, while LPTA forbids tradeoffs altogether.
false_statement: On the FAR's best value continuum, LPTA lets an agency pay more for a better proposal, while the tradeoff process forbids paying above the lowest price.
explanation: 'Tradeoff sits at the judgment-heavy end: an agency can award to a pricier offeror if the benefits merit the extra cost. LPTA sits at the price-driven end: among proposals that meet the technical bar, the lowest price wins.'
