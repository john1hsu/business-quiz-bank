true_statement: Bandiera, Prat and Valletti found that passive waste, which benefits no one, made up about 83% of waste in Italian public purchasing, far more than active waste.
false_statement: Bandiera, Prat and Valletti found that active waste, which benefits the official, made up about 83% of waste in Italian public purchasing, far more than passive waste.
explanation: Studying Italian public bodies buying standardised goods, they found persistent price gaps that tracked governance structure. Most of the loss was passive, which is why research suggests procurement waste stems more from incompetence than from graft.
