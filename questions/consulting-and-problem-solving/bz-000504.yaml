topic: 'Kepner-Tregoe Method: Rational Processes for Problem and Decision Analysis'
topic_type: Framework
true_statement: Kepner and Tregoe built their method after studying decision breakdowns at the U.S. Air Force's Strategic Air Command in the late 1950s.
false_statement: Kepner and Tregoe built their method after studying decision breakdowns at NASA mission control during the Apollo program in the 1960s.
explanation: At Strategic Air Command they concluded good decisions depended more on a disciplined sequence of reasoning than on rank or experience, then codified effective managers' habits; they founded their firm in 1958. NASA mission control used the processes later, in the Apollo era.
