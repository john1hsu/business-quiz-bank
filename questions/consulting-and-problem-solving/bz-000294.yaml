topic: 'Pyramid Principle: Top-Down Structured Communication'
topic_type: Framework
true_statement: Business communication texts advise an indirect opening, with a buffer before the news, when a message will strongly affect the reader or the writer does not know them well.
false_statement: Business communication texts advise an indirect opening, with a buffer before the news, when the audience values brevity or already expects the news.
explanation: Answer-first suits readers who want speed or expect the message. Bad news or an unfamiliar reader can call for explanation first, which is the main limit on applying the pyramid everywhere.
