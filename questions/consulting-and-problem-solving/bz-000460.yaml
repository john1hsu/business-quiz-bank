topic: 'Five Whys: Iterative Why-Questioning to Trace a Problem to Its Root Cause'
topic_type: Practice
true_statement: Eric Ries's proportional investment makes a small fix at each of the five levels of a why-chain, adding a further increment every time the problem recurs.
false_statement: Eric Ries's proportional investment makes one large fix at the deepest level of a why-chain, launching a full prevention programme the first time a problem occurs.
explanation: Ries wanted a middle path between ignoring an incident and starting a months-long prevention effort. Spreading small fixes across every level, and investing more only when a problem keeps coming back, matches the effort to how costly the problem proves to be.
