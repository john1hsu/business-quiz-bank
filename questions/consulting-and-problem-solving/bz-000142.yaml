topic: Issue Tree
topic_type: Framework
true_statement: Chevallier advises building the diagnostic why tree before the solution how tree, because understanding causes sharpens the question the solution tree answers.
false_statement: Chevallier advises building the solution how tree before the diagnostic why tree, because listing options sharpens the question the diagnostic tree answers.
explanation: A why tree maps root causes of an outcome, and a how tree maps options for reaching a goal. Neither is superior, but solving before diagnosing risks answering the wrong question, and each tree should hold only one type of question.
