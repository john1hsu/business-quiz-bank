true_statement: Practitioner guides label NGT items with letters rather than numbers so the list order is not mistaken for a ranking.
false_statement: Practitioner guides label NGT items with numbers rather than letters so the list order can be read directly as a ranking.
explanation: Ideas are recorded in round-robin order, which says nothing about their merit. Letters avoid implying a priority before members have voted privately.
