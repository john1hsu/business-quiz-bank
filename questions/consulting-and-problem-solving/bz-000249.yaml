topic: Nominal Group Technique
topic_type: Practice
true_statement: 'The nominal group technique is so named because members are a group in name only while generating ideas: they sit together but write silently before any discussion.'
false_statement: 'The nominal group technique is so named because members are a group in name only while generating ideas: they work remotely and never meet face to face.'
explanation: NGT keeps people in the same room but has them write ideas independently first, which protects idea volume from early group pressure. Working remotely over several rounds describes the Delphi method instead.
