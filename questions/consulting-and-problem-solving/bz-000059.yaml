true_statement: Barbara Minto coined the MECE acronym but attributes the underlying idea to Aristotle, claiming only its label and application to business writing.
false_statement: Barbara Minto coined the MECE acronym and claims the underlying idea as her own, rather than tracing it to an earlier thinker.
explanation: Minto developed the rule while editing McKinsey reports and set it out in The Pyramid Principle (1985). She is explicit that the logic of exclusive, exhaustive groupings is ancient; her contribution was the shorthand and how she applied it.
