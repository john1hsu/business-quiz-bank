topic: Ishikawa Diagram
topic_type: Framework
true_statement: A fishbone diagram organizes a team's hypotheses about causes rather than testing them, so teams turn to data tools such as Pareto and control charts to judge which causes matter.
false_statement: A fishbone diagram tests a team's hypotheses about causes rather than just organizing them, so teams seldom need data tools such as Pareto and control charts to judge which causes matter.
explanation: The chart records what participants believe, so teams can drift into listing symptoms or assume they understand a problem. Guidance pairs it with the five whys to deepen branches and with data-based tools to rank candidate causes.
