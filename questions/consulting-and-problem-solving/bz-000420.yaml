true_statement: The RCA² action hierarchy ranks forcing functions and physical redesign as strong actions, and new policies and retraining as weak ones.
false_statement: The RCA² action hierarchy ranks new policies and retraining as strong actions, and forcing functions and physical redesign as weak ones.
explanation: Fixes are ranked by how little they rely on people remembering to do the right thing. A design that makes the error impossible beats a reminder, so teams are urged to pair each root cause with at least one strong or intermediate action.
