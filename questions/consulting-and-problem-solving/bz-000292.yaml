topic: 'Pyramid Principle: Top-Down Structured Communication'
topic_type: Framework
true_statement: Barbara Minto developed the Pyramid Principle while editing consultants' reports at McKinsey in London, where she kept rearranging their ideas into the same shape.
false_statement: Barbara Minto developed the Pyramid Principle while teaching business writing at Harvard, where she kept rearranging students' essays into the same shape.
explanation: Minto worked at McKinsey from 1963 to 1973 and turned her editing pattern into an internal course and manual. Her first book on it is dated to 1985, and she later taught it to firms such as Accenture and Bain.
