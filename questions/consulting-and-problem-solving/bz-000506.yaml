true_statement: James Guyot argued in 1978 that evaluations of Kepner-Tregoe training leaned on participants' self-reports, which reflect intentions more than actual behaviour.
false_statement: James Guyot argued in 1978 that evaluations of Kepner-Tregoe training leaned on observed job behaviour, which reflects actual practice more than intentions.
explanation: 'Writing in California Management Review, Guyot doubted that packaged programs had shown benefits large enough to matter. The 1963 USDA study illustrates his point: its gains came from small-sample, self-reported questionnaires.'
