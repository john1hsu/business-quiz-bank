topic: Ishikawa Diagram
topic_type: Framework
true_statement: 'Manufacturing teams often seed a fishbone with the 6 Ms: materials, machinery, methods, measurement, manpower and Mother Nature, meaning the environment.'
false_statement: 'Manufacturing teams often seed a fishbone with the 6 Ms: materials, machinery, methods, money, manpower and Mother Nature, meaning the environment.'
explanation: Measurement is one of the six standard headings; money is sometimes added as a seventh. Ishikawa encouraged renaming categories to fit the setting, and service teams often use headings like policies and procedures, and people.
