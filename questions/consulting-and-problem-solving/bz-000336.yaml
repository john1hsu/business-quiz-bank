true_statement: Baer, Dirks and Nickerson argue that diverse teams facing complex, ill-structured problems tend to formulate them too narrowly, which narrows the search for solutions.
false_statement: Baer, Dirks and Nickerson argue that diverse teams facing complex, ill-structured problems tend to formulate them too broadly, which scatters the search for solutions.
explanation: Their research supports the method's emphasis on the problem-definition step. They propose collaborative structured inquiry to broaden formulation, and the theory implies a fixed sequence will not help if step one is rushed.
