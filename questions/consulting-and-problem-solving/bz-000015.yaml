true_statement: Michael Porter argued that heavy benchmarking makes rivals more alike, a process he called competitive convergence.
false_statement: Michael Porter argued that heavy benchmarking makes rivals more distinct, a process he called competitive divergence.
explanation: Porter saw benchmarking as improving operational effectiveness, but because best practices spread and are easy to copy, it pushes firms toward sameness. A sustainable advantage needs a distinct strategic position instead.
