topic: 'Root Cause Analysis: Tracing Problems to Their Underlying Causes'
topic_type: Practice
true_statement: Peerally and colleagues criticised root cause analysis for a bias toward weak administrative fixes, such as reminders and training, that rarely prevent recurrence.
false_statement: Peerally and colleagues criticised root cause analysis for a bias toward costly physical redesigns, such as new equipment, that rarely prevent recurrence.
explanation: Their 2017 critique gave the example of a wrong cataract lens answered with a protocol, training and a poster, followed by the same error a year later. Administrative fixes are cheap to write but easy to forget.
