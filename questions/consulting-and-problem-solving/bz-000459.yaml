topic: 'Five Whys: Iterative Why-Questioning to Trace a Problem to Its Root Cause'
topic_type: Practice
true_statement: In Ohno's stopped-machine example, the fix that removes the root cause is fitting a strainer to keep out metal scrap, not replacing the fuse or the pump.
false_statement: In Ohno's stopped-machine example, the fix that removes the root cause is replacing the worn pump shaft, not fitting a strainer to keep out metal scrap.
explanation: The chain runs from a blown fuse to a dry bearing, a weak lubrication pump, a worn shaft and finally the missing strainer that let scrap in. Replacing the fuse, pump or shaft treats symptoms, so the failure would recur; only the strainer stops it.
