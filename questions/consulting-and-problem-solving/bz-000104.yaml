true_statement: In a randomized trial of 116 Italian startups, founders taught to test hypotheses performed better early on and were more likely to pivot to a different idea.
false_statement: In a randomized trial of 116 Italian startups, founders taught to test hypotheses performed better early on and were less likely to pivot to a different idea.
explanation: Camuffo, Cordova and Gambardella found the scientific approach helped founders read market signals with less bias, so they abandoned weak ideas sooner. Treated firms did not, however, drop out less often than the control group.
