topic: 'Delphi Method: Iterative Anonymous Expert Consensus'
topic_type: Practice
true_statement: In a classical Delphi, panellists stay anonymous to one another and the group answer is computed statistically rather than negotiated in discussion.
false_statement: In a classical Delphi, panellists meet face to face and the group answer is negotiated in discussion rather than computed statistically.
explanation: Anonymity and statistical aggregation, such as a median with quartiles, stop eloquent speakers or senior figures from swaying the panel. Experts see the group summary between rounds and may revise their own answers.
