topic: Nominal Group Technique
topic_type: Practice
true_statement: A 1978 experiment on estimation tasks found nominal groups less accurate than Delphi groups, even though NGT members rated their process the most satisfying.
false_statement: A 1978 experiment on estimation tasks found nominal groups more accurate than Delphi groups, even though NGT members rated their process the least satisfying.
explanation: Confidence and satisfaction rose without a gain in accuracy, which the authors read as a hint of groupthink-like effects. NGT's strength in experiments has been idea generation, not judgement accuracy.
