kind: definition
topic: MECE Principle
topic_type: Framework
true_statement: A breakdown that is not mutually exclusive double-counts, while one that is not collectively exhaustive leaves gaps.
false_statement: A breakdown that is not mutually exclusive leaves gaps, while one that is not collectively exhaustive double-counts.
explanation: Mutually exclusive means no item overlaps another, so overlap is what causes double-counting. Collectively exhaustive means the items cover the whole, so missing coverage is what leaves gaps.
