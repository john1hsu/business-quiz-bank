topic: 'Root Cause Analysis: Tracing Problems to Their Underlying Causes'
topic_type: Practice
true_statement: In a health-care root cause analysis, active errors happen at the point of care, while latent errors are hidden conditions such as staffing or task design that explain why.
false_statement: In a health-care root cause analysis, latent errors happen at the point of care, while active errors are hidden conditions such as staffing or task design that explain why.
explanation: Separating the two keeps an investigation from stopping at the person who made the visible mistake. The fixes that last usually target the latent conditions that let the active error happen.
