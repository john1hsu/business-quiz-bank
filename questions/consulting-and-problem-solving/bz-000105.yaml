topic: Hypothesis-Driven Problem Solving
topic_type: Practice
true_statement: Confirmation bias threatens hypothesis-driven teams because people testing a favored hypothesis tend to pick tests that can only return yes, as in Wason's 2-4-6 task.
false_statement: Confirmation bias threatens hypothesis-driven teams because people testing a favored hypothesis tend to pick tests that can only return no, as in Wason's 2-4-6 task.
explanation: Committing early to an answer invites seeking only supporting evidence and explaining away contrary data. The standard remedy is to generate alternative hypotheses and design tests capable of refuting them.
