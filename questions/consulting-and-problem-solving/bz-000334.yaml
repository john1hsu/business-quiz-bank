topic: 'Structured Problem Solving: The Consultant''s Stepwise Method'
topic_type: Practice
true_statement: In Conn and McLean's seven-step cycle, teams prioritize by pruning the issue tree to branches that most affect the outcome and that they can actually influence.
false_statement: In Conn and McLean's seven-step cycle, teams prioritize by pruning the issue tree to branches that are easiest to measure, whether or not they can influence them.
explanation: Prioritizing comes right after disaggregation and before planning the work. It keeps scarce analysis effort on drivers that both matter and are actionable, rather than on what is merely convenient to analyze.
