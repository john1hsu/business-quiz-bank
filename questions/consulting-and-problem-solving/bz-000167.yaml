topic: 80/20 Rule
topic_type: Concept
true_statement: Joseph Juran named the Pareto principle and later called the name a mistake, since Vilfredo Pareto had studied only the distribution of wealth.
false_statement: Joseph Juran named the Pareto principle and later called the name a mistake, since Vilfredo Pareto had studied only the distribution of quality losses.
explanation: Pareto's law concerned income and wealth. Juran generalised the pattern to quality losses in his 1951 Quality Control Handbook, and in 1974 admitted Pareto never proposed a universal and that his cumulative curves should have been credited to M. O. Lorenz.
