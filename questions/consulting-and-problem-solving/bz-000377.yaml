topic: 'Delphi Method: Iterative Anonymous Expert Consensus'
topic_type: Practice
true_statement: The Delphi method was developed at the RAND Corporation in the 1950s, and Norman Dalkey and Olaf Helmer described an experiment with it in 1963.
false_statement: The Delphi method was developed at the RAND Corporation in the 1970s, and Norman Dalkey and Olaf Helmer described an experiment with it in 1983.
explanation: Their 1963 Management Science article framed the aim as reaching the most reliable consensus of experts through questionnaires with controlled feedback. RAND's 1964 long-range forecasting study then showed the method at scale.
