topic: 'Pyramid Principle: Top-Down Structured Communication'
topic_type: Framework
true_statement: One of Minto's three pyramid rules is that an idea at any level must summarize the ideas grouped below it.
false_statement: One of Minto's three pyramid rules is that an idea at any level must introduce a new point not covered by the ideas grouped below it.
explanation: The other two rules are that grouped ideas must be of the same logical kind and follow a logical order. Summarizing upward is what lets a reader stop at the top and still have the main message.
