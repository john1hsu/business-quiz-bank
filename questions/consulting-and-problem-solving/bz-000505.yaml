topic: 'Kepner-Tregoe Method: Rational Processes for Problem and Decision Analysis'
topic_type: Framework
true_statement: In Kepner-Tregoe Decision Analysis, an alternative failing any MUST objective is dropped, while WANT objectives are weighted and used to score the survivors.
false_statement: In Kepner-Tregoe Decision Analysis, an alternative failing any WANT objective is dropped, while MUST objectives are weighted and used to score the survivors.
explanation: MUSTs are mandatory, measurable screens, so they eliminate rather than score. WANTs carry importance weights, typically 1 to 10, and the surviving options' weighted scores are summed to reach a tentative choice before its risks are assessed.
