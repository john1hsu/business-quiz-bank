topic: MECE Principle
topic_type: Framework
true_statement: Charles Conn recommends making two or three different MECE cuts of the same problem, because a MECE breakdown is not unique and each cut surfaces different insights.
false_statement: Charles Conn recommends settling on a single MECE cut of a problem, because a correct MECE breakdown is unique and other cuts only repeat it.
explanation: 'Many valid partitions exist for the same whole, and each highlights different levers. That is one limit of MECE: being exclusive and exhaustive guarantees clean addition, not the most useful framing.'
