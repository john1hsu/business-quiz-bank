topic: 80/20 Rule
topic_type: Concept
true_statement: For Pareto-distributed data, the share held by the top 20% depends on the distribution's exponent, so an exact 80/20 split is not guaranteed.
false_statement: For Pareto-distributed data, the share held by the top 20% is fixed at 80% whatever the exponent, so an exact 80/20 split is guaranteed.
explanation: Mark Newman's power-law math gives about 80% for the exponents reported for wealth but about 86% when the exponent is 2.1. For data that are not heavy-tailed, the rule can fail entirely.
