true_statement: Testing the long-tail thesis with music and home-video sales data, Anita Elberse found blockbusters were capturing a larger share of the market than before.
false_statement: Testing the long-tail thesis with music and home-video sales data, Anita Elberse found niche titles were capturing a larger share of the market than before.
explanation: The long tail predicted that unlimited online shelf space would shift demand toward niches. Elberse found concentration on hits growing and little strong preference for niche titles, so the vital-few logic still holds in hit-driven businesses.
