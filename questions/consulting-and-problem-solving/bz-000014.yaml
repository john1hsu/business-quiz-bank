topic: Benchmarking
topic_type: Practice
true_statement: Functional benchmarking compares a function, such as logistics or billing, with firms in other industries that run similar processes.
false_statement: Functional benchmarking compares a function, such as logistics or billing, with similar units inside the same organization.
explanation: Comparing similar units within one organization is internal benchmarking. Functional benchmarking looks outside the industry at firms that perform the same function well, which can surface bigger ideas but is harder to translate.
