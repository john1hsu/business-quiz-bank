area: managerial-economics
kind: mechanism
topic: 'Adverse Selection: Hidden Information Before a Contract'
topic_type: Concept
true_statement: In Rothschild and Stiglitz's separating equilibrium, high-risk buyers get full insurance at fair odds, while low-risk buyers get only partial cover.
false_statement: In Rothschild and Stiglitz's separating equilibrium, low-risk buyers get full insurance at fair odds, while high-risk buyers get only partial cover.
explanation: Insurers cannot see risk, so they ration cover for the cheap policy to make it unattractive to high-risk buyers, who would otherwise mimic the low-risk type. The low-risk group bears the cost, and nobody gains from it.
