id: bz-000016
area: managerial-economics
kind: mechanism
topic: Economies of Scale
topic_type: Concept
true_statement: If minimum average cost is reached only at a large share of market demand, an industry tends toward oligopoly.
false_statement: If minimum average cost is reached only at a small share of market demand, an industry tends toward oligopoly.
explanation: Where the cost curve bottoms out relative to demand predicts how many efficient firms fit in the market. A small efficient size leaves room for many rivals; a large one supports only a few, and one bigger than demand points to a single producer.
