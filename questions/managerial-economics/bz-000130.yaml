true_statement: 'Indirect network effects work through complements: as more of a hardware product sells, more software or content is made for it, raising the hardware''s value.'
false_statement: 'Direct network effects work through complements: as more of a hardware product sells, more software or content is made for it, raising the hardware''s value.'
explanation: Katz and Shapiro separated direct effects, from physical connection as with telephones or fax machines, from indirect ones that flow through complementary goods. They also named a third channel, denser post-purchase service for larger installed bases.
