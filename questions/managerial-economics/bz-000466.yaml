topic: 'Automotive Industry: Vehicle Manufacturers, Suppliers and Industry Structure'
topic_type: Industry
true_statement: Grieco, Murry and Yurukoglu found that from 1980 to 2018 U.S. car market concentration and market power fell substantially, and consumers captured a growing share of surplus.
false_statement: Grieco, Murry and Yurukoglu found that from 1980 to 2018 U.S. car market concentration and market power rose substantially, and producers captured a growing share of surplus.
explanation: Prices rose over the period, but better quality and lower marginal costs meant buyers gained more than firms. The authors link the decline in market power to import competition, the growth of SUVs and changing vehicle features, a warning against reading rising prices as rising market power.
