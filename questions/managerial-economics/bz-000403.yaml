topic: 'Adverse Selection: Hidden Information Before a Contract'
topic_type: Concept
true_statement: Cutler and Reber found that Harvard's mid-1990s switch to equal health-plan contributions set off adverse selection, yet lower premiums meant welfare rose overall.
false_statement: Cutler and Reber found that Harvard's mid-1990s switch to equal health-plan contributions set off adverse selection, and its losses outweighed lower premiums so welfare fell overall.
explanation: Selection cost about 2% of baseline health spending, but competition cut Harvard's premiums nearly 10% relative to the Boston area. It is the cleanest documented death spiral, and still a net gain.
