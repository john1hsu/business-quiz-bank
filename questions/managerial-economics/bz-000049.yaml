true_statement: Under the Sherman Act, naked price fixing among competitors is illegal per se, while most other restraints are judged under the rule of reason.
false_statement: Under the Sherman Act, naked price fixing among competitors is judged under the rule of reason, while most other restraints are illegal per se.
explanation: Since Standard Oil (1911), courts ban only unreasonable restraints. Price fixing, market division and bid rigging are treated as so harmful that no justification is heard, while other conduct is weighed for its procompetitive and anticompetitive effects.
