topic: 'Adverse Selection: Hidden Information Before a Contract'
topic_type: Concept
true_statement: Besides used cars, Akerlof's 1970 lemons paper analysed health insurance for people over 65, an argument he used in favour of a public scheme like Medicare.
false_statement: Besides used cars, Akerlof's 1970 lemons paper analysed health insurance for low-income families, an argument he used in favour of a public scheme like Medicaid.
explanation: As premiums for older people rise, those who remain are increasingly the ones expecting to need care, so there may be no price at which policies sell. A public scheme sidesteps that unravelling.
