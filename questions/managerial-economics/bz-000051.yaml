true_statement: Lina Khan's 2017 Yale Law Journal note argued that antitrust's focus on short-term prices cannot see the structural power of platforms such as Amazon.
false_statement: Carl Shapiro's 2017 Yale Law Journal note argued that antitrust's focus on short-term prices cannot see the structural power of platforms such as Amazon.
explanation: 'Khan argued a platform can rationally price below cost to win lock-in and data, so a price test misses the harm. Shapiro was the cautious counterpoint: he backed tougher merger review but warned against stretching antitrust to target political power or inequality.'
