area: managerial-economics
kind: mechanism
topic: Principal-Agent Problem
topic_type: Theory
true_statement: Holmström's informativeness principle says to tie an agent's pay to any measure carrying information about effort, such as share price relative to peers.
false_statement: Holmström's informativeness principle says to tie an agent's pay only to final output, ignoring other measures such as share price relative to peers.
explanation: Holmström's 1979 paper showed when an imperfect extra signal of behaviour improves on a contract based only on output. Measures like relative share price help because they filter out noise the agent cannot influence, so pay tracks effort more closely.
