id: bz-000131
area: managerial-economics
kind: mechanism
topic: Network Effect
topic_type: Concept
true_statement: In Katz and Shapiro's model, firms with large networks tend to resist compatibility even when it would raise welfare, while firms with small networks favor it.
false_statement: In Katz and Shapiro's model, firms with small networks tend to resist compatibility even when it would raise welfare, while firms with large networks favor it.
explanation: Compatibility shares the benefit of a big installed base with rivals, so the leader loses an advantage and the laggard gains one. That is why standards fights pit large incumbents against smaller challengers.
