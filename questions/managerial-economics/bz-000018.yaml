kind: evidence
topic: Economies of Scale
topic_type: Concept
true_statement: Christensen and Greene's 1976 study found no significant scale economies for U.S. electricity generators above about 19 billion kWh a year.
false_statement: Christensen and Greene's 1976 study found scale economies kept growing for U.S. electricity generators well beyond 19 billion kWh a year.
explanation: Their work is a classic sign that scale economies run out sooner than intuition suggests. Later studies questioned their data and assumptions, and a 2019 replication found returns to scale in U.S. generation declined from 1955 to 1996.
