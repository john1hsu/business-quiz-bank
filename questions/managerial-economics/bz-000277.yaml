true_statement: Holmström's career-concerns model implies older workers respond less to implicit incentives, because they have fewer future career payoffs from a better reputation.
false_statement: Holmström's career-concerns model implies younger workers respond less to implicit incentives, because they have fewer future career payoffs from a better reputation.
explanation: In the model, the market infers ability from performance and sets future wages accordingly, so effort today buys a better reputation tomorrow. The closer someone is to retirement, the less that future is worth, so the implicit motive weakens.
