topic: Economies of Scale
topic_type: Concept
true_statement: Diseconomies of scale arise mainly from coordination problems, as extra management layers and communication failures disrupt work.
false_statement: Diseconomies of scale arise mainly from spreading fixed costs over more units as output grows.
explanation: Spreading fixed costs is a source of economies of scale, which lower unit cost. Diseconomies push average cost up as a firm grows, chiefly because coordinating a larger organization gets harder.
