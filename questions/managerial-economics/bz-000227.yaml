area: managerial-economics
kind: definition
topic: Principal-Agent Problem
topic_type: Theory
true_statement: In a principal-agent problem, moral hazard arises when the agent's action is hidden, while adverse selection arises from information the agent holds before contracting.
false_statement: In a principal-agent problem, adverse selection arises when the agent's action is hidden, while moral hazard arises from information the agent holds before contracting.
explanation: The two forms differ in what the principal cannot see and when. Moral hazard concerns unobserved actions such as effort once the contract is in place; adverse selection concerns private information the agent already has when signing.
