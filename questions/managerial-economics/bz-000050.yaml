true_statement: The 1976 Hart-Scott-Rodino amendment to the Clayton Act requires parties to large mergers to notify the US government before closing.
false_statement: The 1936 Robinson-Patman amendment to the Clayton Act requires parties to large mergers to notify the US government before closing.
explanation: Hart-Scott-Rodino created premerger notification so agencies can review big deals before they are done. Robinson-Patman is the earlier amendment, and it deals with price discrimination between merchants, not merger filings.
