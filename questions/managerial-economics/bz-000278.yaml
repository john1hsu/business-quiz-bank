true_statement: With Gorton and Dang, Holmström argued that opacity in money markets can be the result of optimal contracting rather than a flaw.
false_statement: With Gorton and Dang, Holmström argued that opacity in money markets is a flaw of poor contracting that more transparency would cure.
explanation: The claim is contrarian because the usual post-crisis prescription for banking is more transparency. Holmström says the view has gained support, but it runs against that common call.
