topic: 'Moral Hazard: Risk-Taking When Others Bear the Cost'
topic_type: Concept
true_statement: Kenneth Arrow's 1963 article on medical care brought moral hazard into economics, noting insurance works best when the insured event is beyond the policyholder's control.
false_statement: Bengt Holmström's 1963 article on medical care brought moral hazard into economics, noting insurance works best when the insured event is beyond the policyholder's control.
explanation: Arrow observed that medical costs depend partly on patients' and doctors' choices, so insurance raises demand for care. Holmström came later, recasting the problem in 1979 as a principal-agent contract with hidden action.
