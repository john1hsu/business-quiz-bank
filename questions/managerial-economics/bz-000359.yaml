true_statement: Ronald Coase's 1937 article The Nature of the Firm argued that firms exist because using the market carries costs of negotiating and monitoring contracts.
false_statement: Ronald Coase's 1937 article The Nature of the Firm argued that firms exist because managerial authority carries costs of negotiating and monitoring contracts.
explanation: 'Coase asked why so much allocation happens by command inside firms if prices allocate resources. His answer: markets are not free to use, so a firm grows until one more internal transaction would cost more than buying it outside.'
