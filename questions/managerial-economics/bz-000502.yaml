topic: 'Contract Theory: How Incentives and Ownership Shape Agreements'
topic_type: Field
true_statement: Holmström and Milgrom's multitask model implies that easy-to-measure and hard-to-measure work should go to different people, with one responsible agent per task.
false_statement: Holmström and Milgrom's multitask model implies that easy-to-measure and hard-to-measure work should go to the same person, so measured output disciplines the rest.
explanation: When one agent does both, incentive pay on the measurable task pulls limited attention away from the unmeasured one, so separating them lets each job carry incentives that suit it. The same logic explains when firms use employees rather than independent contractors.
