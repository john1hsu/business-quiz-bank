topic: 'Transaction Cost Economics: Markets, Hierarchies and the Make-or-Buy Decision'
topic_type: Theory
true_statement: In transaction cost economics, high asset specificity turns competitive bidding into small-numbers bargaining, which makes hierarchy more attractive than market buying.
false_statement: In transaction cost economics, high asset specificity turns small-numbers bargaining into competitive bidding, which makes market buying more attractive than hierarchy.
explanation: Once investments are tailored to one relationship, they lose value elsewhere, so each side can hold the other up. Williamson predicted generic inputs get bought while specific ones are better made in-house or protected by contract.
