true_statement: Hart, Shleifer and Vishny (1997) concluded that the case against privatising prisons is strongest for maximum-security facilities.
false_statement: Hart, Shleifer and Vishny (1997) concluded that the case against privatising prisons is strongest for minimum-security facilities.
explanation: A private operator holds residual control and keeps its savings, so it cuts costs harder than a public manager, but it may also cut quality the contract cannot specify, such as restraint in the use of force. That non-contractible quality matters most in maximum-security settings.
