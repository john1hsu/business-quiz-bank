topic: 'Information Asymmetry: Unequal Knowledge Between Transacting Parties'
topic_type: Theory
true_statement: Emons and George found privately sold used cars in Basle were more likely than average to have defects while dealer-sold cars were less likely, yet judged the lemons problem not widespread.
false_statement: Emons and George found dealer-sold used cars in Basle were more likely than average to have defects while privately sold cars were less likely, yet judged the lemons problem not widespread.
explanation: Private sales were about 27% more likely to have defects and dealer sales about 10% less, consistent with dealer reputation acting as a quality guarantee. Few cars were resold at all, so institutions seem to absorb much of the problem.
