topic: 'Contract Theory: How Incentives and Ownership Shape Agreements'
topic_type: Field
true_statement: Grossman and Hart's 1986 Journal of Political Economy paper defined ownership as the purchase of residual rights of control over whatever a contract leaves out.
false_statement: Grossman and Hart's 1986 Journal of Political Economy paper defined ownership as the purchase of specific rights of control that a contract spells out in advance.
explanation: Because no contract can foresee every contingency, Grossman and Hart argued that what matters is who decides in the gaps, and owning an asset means holding those residual rights. Specific rights are the ones written into the contract, which is exactly what ownership adds to.
