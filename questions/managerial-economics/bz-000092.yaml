true_statement: The SCP paradigm was criticized as descriptive rather than analytic, because its links between structure, conduct and performance were seldom derived from explicit models.
false_statement: The SCP paradigm was criticized as too abstract, because its links between structure, conduct and performance came from game-theoretic models rather than industry data.
explanation: Without a model of how firms behave, cross-industry correlations could not show cause and effect. Critics like Stigler pushed for models built on maximizing behavior, and the field later rebuilt itself on game theory and structural econometrics.
