true_statement: Liebowitz and Margolis disputed that QWERTY was demonstrably inferior to Dvorak or that Betamax was clearly better than VHS, challenging famous lock-in stories.
false_statement: Liebowitz and Margolis confirmed that QWERTY was demonstrably inferior to Dvorak and that Betamax was clearly better than VHS, supporting famous lock-in stories.
explanation: They argued network externalities that cause real market failure are theoretically fragile and empirically undocumented. Many networks need only a critical mass, and participants can often internalize the benefits.
