true_statement: Edward Mason introduced the structure-conduct-performance paradigm through case studies of single industries, and Joe Bain first applied it empirically across many industries.
false_statement: Joe Bain introduced the structure-conduct-performance paradigm through case studies of single industries, and Edward Mason first applied it empirically across many industries.
explanation: Mason developed SCP at Harvard in 1939 and 1949 by studying industries one at a time. Bain's 1951 and 1956 work compared outcomes across many industries, turning the framework into cross-industry evidence.
