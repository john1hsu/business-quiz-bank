topic: Airline Industry
topic_type: Industry
true_statement: Because airline labor and fuel costs are largely fixed in the short run, moderate swings in demand produce large swings in profit.
false_statement: Because airline labor and fuel costs are largely fixed in the short run, moderate swings in demand produce only small swings in profit.
explanation: When most costs are committed in advance, losing passengers cuts revenue without cutting costs much, so profit amplifies demand changes. This helps explain the industry's chronic financial instability and its recurring merger waves.
