true_statement: 'Wells Fargo''s 2016 case fits the multitask warning: sales targets rewarded a countable output, new accounts, without measuring whether customers wanted them.'
false_statement: 'Wells Fargo''s 2016 case fits the adverse selection warning: sales targets rewarded a countable output, new accounts, without measuring whether customers wanted them.'
explanation: 'Holmström and Milgrom''s multitask model predicts that strong pay for a measurable task pulls effort from hard-to-measure ones. The CFPB found employees, spurred by sales targets and pay incentives, opened accounts that may not have been authorized: a hidden-action problem, not one of information held before contracting.'
