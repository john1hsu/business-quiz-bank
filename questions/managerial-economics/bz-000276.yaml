true_statement: Bengt Holmström shared the 2016 economics Nobel with Oliver Hart for their contributions to contract theory.
false_statement: Bengt Holmström shared the 2016 economics Nobel with Jean Tirole for their contributions to contract theory.
explanation: Holmström and Hart were honored together for work on how contracts can be designed when effort and outcomes are hard to observe. Tirole was Holmström's co-author on liquidity, but he won his own Nobel separately.
