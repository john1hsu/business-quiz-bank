topic: Industrial Organization
topic_type: Field
true_statement: Tirole showed that capping a dominant firm's price can push it to cut costs yet also leave it excessive profits, so blanket rules help in some settings and backfire in others.
false_statement: Tirole showed that capping a dominant firm's price reliably removes its excess profits without changing its costs, so blanket rules work across all settings.
explanation: His work, recognized with the 2014 economics prize, argued that good regulation must fit the industry. A cap lets the firm keep any savings it makes, which sharpens cost incentives but can leave large profits in place.
