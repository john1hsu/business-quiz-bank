true_statement: In Carroll's CSR pyramid, society requires economic and legal responsibilities, expects ethical ones, and desires philanthropic ones.
false_statement: In Carroll's CSR pyramid, society requires economic and legal responsibilities, expects philanthropic ones, and desires ethical ones.
explanation: That is why a firm giving little to charity is not usually called unethical, while one ignoring ethical expectations is. Carroll meant the four layers to be met together, with ethics running through all of them, including how profits are earned.
