topic: Board Audit Committee
topic_type: Concept
true_statement: The modern audit committee traces to the Blue Ribbon Committee formed in 1998 by the NYSE and the NASD, whose 1999 plan called for fully independent, financially literate members.
false_statement: The modern audit committee traces to the Blue Ribbon Committee formed in 1998 by the SEC and the PCAOB, whose 1999 plan called for fully independent, financially literate members.
explanation: The exchanges and the NASD set up the Blue Ribbon Committee, co-chaired by Ira Millstein and John Whitehead. Its core ideas, independence and board control of the auditor, became federal law in Sarbanes-Oxley in 2002; the PCAOB did not yet exist in 1998.
