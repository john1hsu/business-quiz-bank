kind: mechanism
topic: Fiduciary Duty
topic_type: Concept
true_statement: Delaware's Section 102(b)(7) lets a charter eliminate directors' personal monetary liability for breaches of the duty of care, but not of the duty of loyalty.
false_statement: Delaware's Section 102(b)(7) lets a charter eliminate directors' personal monetary liability for breaches of the duty of loyalty, but not of the duty of care.
explanation: The provision aims to encourage good-faith risk-taking by directors. Combined with the deferential business judgment rule, it means director liability in practice turns largely on loyalty and bad faith rather than careless decisions.
