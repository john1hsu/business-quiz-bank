area: business-ethics-and-governance
kind: mechanism
topic: Agency Costs
topic_type: Concept
true_statement: Agency costs are the sum of the principal's monitoring costs, the agent's bonding costs and the residual loss that remains after both.
false_statement: Agency costs are the sum of the principal's monitoring costs, the agent's salary and the residual loss that remains after both.
explanation: Jensen and Meckling split agency costs into monitoring (spent by the principal), bonding (spent by the agent to reassure the principal) and residual loss, the welfare still lost because the agent's choices differ. An agent's ordinary pay is not one of the three.
