true_statement: The Business Roundtable's August 2019 purpose statement, signed by 181 CEOs, replaced statements issued since 1997 that had endorsed shareholder primacy.
false_statement: The Business Roundtable's August 2019 purpose statement, signed by 181 CEOs, reaffirmed statements issued since 1997 that had endorsed shareholder primacy.
explanation: The statement committed signers to customers, employees, suppliers, communities and shareholders. Supporters called it a long-term commitment, while the Council of Institutional Investors warned it would give CEOs cover to evade shareholder oversight.
