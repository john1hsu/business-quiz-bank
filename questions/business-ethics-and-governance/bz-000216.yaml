kind: evidence
topic: Fiduciary Duty
topic_type: Concept
true_statement: Easterbrook and Fischel's contractarian view treats fiduciary duties as default contract terms that explicit agreements should generally override.
false_statement: Easterbrook and Fischel's contractarian view treats fiduciary duties as mandatory rules that explicit agreements should never override.
explanation: On their 1993 view, courts fill gaps by asking what informed, rational parties would have agreed to. Critics answer that dependence and entrusted power justify duties parties cannot contract away, which is why the SEC bars investment advisers from blanket waivers.
