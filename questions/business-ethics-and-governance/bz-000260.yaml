topic: Board Audit Committee
topic_type: Concept
true_statement: At WorldCom, internal audit's capital-expenditure review uncovered the improper capitalization in June 2002 and took it to the audit committee, which pressed for prompt action.
false_statement: At WorldCom, the external auditor's capital-expenditure review uncovered the improper capitalization in June 2002 and took it to the audit committee, which pressed for prompt action.
explanation: 'The case shows both failure and value: the committee met only a few hours a year and missed the fraud, yet it acted once internal audit brought the evidence. Arthur Andersen, the outside auditor, had not caught it.'
