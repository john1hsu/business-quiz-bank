true_statement: Of the ISSB's June 2023 standards, IFRS S1 sets general sustainability disclosure requirements, while IFRS S2 adds climate-specific disclosures.
false_statement: Of the ISSB's June 2023 standards, IFRS S2 sets general sustainability disclosure requirements, while IFRS S1 adds climate-specific disclosures.
explanation: S1 covers sustainability-related risks and opportunities over the short, medium and long term, and S2 fully incorporates the TCFD recommendations. Both are built around investor decision-usefulness, like financial-reporting standards.
