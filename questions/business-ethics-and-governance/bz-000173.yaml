topic: Business Roundtable Statement on the Purpose of a Corporation
topic_type: Case
true_statement: The 2019 Business Roundtable purpose statement changed no legal duty, so corporate law still keeps many boards from treating stakeholder interests as ends in themselves.
false_statement: The 2019 Business Roundtable purpose statement changed directors' legal duties, so corporate law now lets boards treat stakeholder interests as ends in themselves.
explanation: The pledge is a declaration by CEOs, not a change to charters or statutes. Bebchuk and Tallarita note it is also silent on whether stakeholders should get anything beyond what also serves shareholder value.
