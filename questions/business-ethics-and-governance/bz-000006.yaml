topic: Agency Costs
topic_type: Concept
true_statement: Jensen's 1986 free cash flow argument holds that debt can discipline managers by committing excess cash to creditors, much like paying dividends.
false_statement: Jensen's 1986 free cash flow argument holds that equity issues can discipline managers by committing excess cash to creditors, much like paying dividends.
explanation: Jensen argued conflicts are worst where cash exceeds positive-NPV projects, and debt forces that cash out to lenders. He used this to explain 1980s takeovers and LBOs in cash-rich industries such as oil.
