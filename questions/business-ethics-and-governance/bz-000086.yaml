topic: Stakeholder Theory
topic_type: Theory
true_statement: Donaldson and Preston's instrumental claim is that firms managing stakeholder relationships well perform better; their normative claim is that stakeholder interests have intrinsic value.
false_statement: Donaldson and Preston's normative claim is that firms managing stakeholder relationships well perform better; their instrumental claim is that stakeholder interests have intrinsic value.
explanation: Their 1995 article split the theory into descriptive, instrumental and normative claims that must not be conflated. They saw the normative base as the most fundamental, which is why evidence that stakeholder management pays cannot settle whether it is right.
