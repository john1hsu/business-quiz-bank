id: bz-000498
area: business-ethics-and-governance
kind: evidence
topic: 'Executive Compensation: Pay-for-Performance, Equity Incentives and Say on Pay'
topic_type: Practice
true_statement: Bebchuk and Fried's managerial power view holds that boards cannot bargain at arm's length with CEOs, so executives favor pay that is less visible and less tied to performance.
false_statement: Bebchuk and Fried's managerial power view holds that boards cannot bargain at arm's length with CEOs, so executives favor pay that is more visible and more tied to performance.
explanation: If executives shape their own pay, they prefer less visible forms such as stealth compensation, executive loans and large exit payments. This rival to efficient contracting explains pay features that are puzzling if boards simply maximize shareholder value.
