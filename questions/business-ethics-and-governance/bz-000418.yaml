area: business-ethics-and-governance
kind: evidence
topic: 'Shareholder Primacy: The Corporate Objective of Maximizing Shareholder Value'
topic_type: Theory
true_statement: Hart and Zingales argued that when shareholders care about social outcomes tied to production, maximizing their welfare is not the same as maximizing market value.
false_statement: Hart and Zingales argued that even when shareholders care about social outcomes tied to production, maximizing their welfare is the same as maximizing market value.
explanation: If some harms cannot be separated from how a firm makes money, investors cannot undo them with their own giving. Hart and Zingales suggested firms follow shareholders' preferences, for instance through votes on corporate policy.
