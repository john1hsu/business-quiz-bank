topic: Agency Costs
topic_type: Concept
true_statement: Michael Jensen and William Meckling formalized agency costs in a 1976 Journal of Financial Economics paper on the theory of the firm.
false_statement: Ronald Coase and Oliver Williamson formalized agency costs in a 1976 Journal of Financial Economics paper on the theory of the firm.
explanation: Jensen and Meckling's 1976 'Theory of the Firm' paper defined agency costs and tied them to the separation of ownership and control. It also recast the firm as a nexus of contracts among individuals.
