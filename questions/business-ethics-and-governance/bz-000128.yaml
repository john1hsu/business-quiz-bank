true_statement: Berg, Kölbel and Rigobon found that measurement differences, not weighting, explained most of the divergence among six major ESG ratings.
false_statement: Berg, Kölbel and Rigobon found that weighting differences, not measurement, explained most of the divergence among six major ESG ratings.
explanation: Measurement accounted for 56% of the disagreement, scope for 38% and weighting for only 6%. Raters disagree mainly on how they assess the same attribute, which is why ESG labels can give investors noisy signals.
