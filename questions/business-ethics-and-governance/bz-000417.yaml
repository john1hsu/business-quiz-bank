area: business-ethics-and-governance
kind: mechanism
topic: 'Shareholder Primacy: The Corporate Objective of Maximizing Shareholder Value'
topic_type: Theory
true_statement: Jensen argued multi-measure tools like the balanced scorecard can help managers understand value drivers but should not be used to set their pay.
false_statement: Jensen argued multi-measure tools like the balanced scorecard should be used to set managers' pay but cannot help them understand value drivers.
explanation: His enlightened value maximization insists on one criterion, long-run firm value, because nobody can maximize in several dimensions at once. A scorecard has no single score, so tying pay to it leaves trade-offs unresolved.
