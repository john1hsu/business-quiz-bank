topic: 'Separation of Ownership and Control: Dispersed Shareholders and Managerial Power'
topic_type: Concept
true_statement: Fama and Jensen argued open corporations contain agency problems by separating decision management, initiating choices, from decision control, ratifying and monitoring them.
false_statement: Fama and Jensen argued open corporations contain agency problems by separating decision control, initiating choices, from decision management, ratifying and monitoring them.
explanation: Managers propose and implement, while boards, internal hierarchies and ultimately the takeover market approve and check. Splitting these roles lets dispersed shareholders bear risk without trusting managers to police themselves.
