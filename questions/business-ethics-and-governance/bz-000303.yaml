true_statement: In July 2022 the SEC rescinded the advance-access conditions on proxy advisors' exemptions but kept their conflict-disclosure requirement and anti-fraud liability.
false_statement: In July 2022 the SEC rescinded the conflict-disclosure requirement on proxy advisors' exemptions but kept the advance-access conditions and anti-fraud liability.
explanation: The 2020 rules had required advisors to disclose conflicts and give companies early access to their advice. The 2022 rollback dropped only the company-access part, showing how US policy has swung back and forth.
