true_statement: Archie Carroll dates the modern era of corporate social responsibility to Howard Bowen's 1953 book Social Responsibilities of the Businessman.
false_statement: Archie Carroll dates the modern era of corporate social responsibility to Theodore Levitt's 1953 book Social Responsibilities of the Businessman.
explanation: Bowen's 1953 book is credited with launching the modern CSR concept. Levitt was an early opponent, arguing in 1958 that a firm's main duty is profit, and Friedman objected in 1962.
