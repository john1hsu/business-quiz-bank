area: business-ethics-and-governance
kind: definition
topic: Stakeholder Theory
topic_type: Theory
true_statement: Freeman defined a stakeholder as any group or individual that can affect, or is affected by, the achievement of an organization's objectives.
false_statement: Freeman defined a stakeholder as any group or individual that holds a legal or financial claim on an organization's assets.
explanation: The definition is deliberately broad, covering customers, employees, suppliers and communities as well as financiers. Its aim was to widen strategic management beyond a purely economic, owner-centred view.
