topic: 'Corporate Social Responsibility (CSR): A Firm''s Obligations Beyond Profit and Law'
topic_type: Concept
true_statement: Orlitzky, Schmidt and Rynes's 2003 meta-analysis of 52 studies found social performance positively linked to financial performance, more strongly for accounting-based than market-based returns.
false_statement: Orlitzky, Schmidt and Rynes's 2003 meta-analysis of 52 studies found social performance positively linked to financial performance, more strongly for market-based than accounting-based returns.
explanation: The study supports a business case for CSR, with reputation as a key mediator. The size of the payoff is debated, because the average correlation shrinks markedly once survey- and reputation-based measures, which may carry halo effects, are excluded.
