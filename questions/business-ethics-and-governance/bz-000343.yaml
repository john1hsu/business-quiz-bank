topic: 'Board of Directors: The Corporation''s Elected Monitors'
topic_type: Concept
true_statement: Under Delaware's default rules, directors on a classified board can be removed by shareholders only for cause, while other directors can be removed with or without cause.
false_statement: Under Delaware's default rules, directors on a classified board can be removed by shareholders with or without cause, while other directors can be removed only for cause.
explanation: A staggered board puts only part of its seats up for election each year, and the for-cause default adds further protection. Together they make it harder for shareholders to replace a board quickly.
