topic: 'Separation of Ownership and Control: Dispersed Shareholders and Managerial Power'
topic_type: Concept
true_statement: La Porta and colleagues found widely held large firms are rare outside countries with very good shareholder protection; elsewhere most are controlled by families or the state.
false_statement: La Porta and colleagues found widely held large firms are rare outside countries with weak shareholder protection; elsewhere most are controlled by families or the state.
explanation: Their 1999 study of 27 wealthy economies showed the Berle-Means dispersed firm is mostly an American and British pattern. Where investors are poorly protected, controlling owners, often via pyramids, keep control instead.
