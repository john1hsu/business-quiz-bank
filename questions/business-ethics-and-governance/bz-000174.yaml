true_statement: Raghunandan and Rajgopal (2024) found that BRT signatories had more environmental and labor-law violations than industry peers, with no improvement after signing.
false_statement: Raghunandan and Rajgopal (2024) found that BRT signatories had fewer environmental and labor-law violations than industry peers, with further improvement after signing.
explanation: They also found higher carbon emissions and greater reliance on government subsidies among signatories, and concluded the statement was not a credible commitment. The study shows why stated ESG commitments are tested against measurable conduct.
