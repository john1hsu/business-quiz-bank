topic: 'Shareholder Primacy: The Corporate Objective of Maximizing Shareholder Value'
topic_type: Theory
true_statement: In Dodge v. Ford, the Michigan court in 1919 sided with minority shareholders and ordered a dividend after Ford withheld profits to cut prices and expand.
false_statement: In Dodge v. Ford, the Michigan court in 1919 sided with Henry Ford and let him withhold dividends so he could cut prices and expand.
explanation: The court said a business exists for the profit of its stockholders and ordered about $19.3 million paid out. Ford then bought out the minority holders, which freed him from the constraint.
