topic: 'Executive Compensation: Pay-for-Performance, Equity Incentives and Say on Pay'
topic_type: Practice
true_statement: Under SEC rules adopted in 2011 under Dodd-Frank, companies hold an advisory say-on-pay vote at least once every three years, and vote on its frequency at least every six.
false_statement: Under SEC rules adopted in 2011 under Dodd-Frank, companies hold an advisory say-on-pay vote at least once every six years, and vote on its frequency at least every three.
explanation: The pay vote comes at least every three years and the frequency vote at least every six, with a separate advisory vote on merger golden parachutes. All three votes are non-binding, so they work through pressure on the board.
