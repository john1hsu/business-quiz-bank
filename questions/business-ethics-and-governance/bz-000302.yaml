true_statement: Using a cutoff in ISS's own guidelines, Malenko and Shen estimated that a negative ISS say-on-pay recommendation in 2010-2011 cut shareholder support by about 25 percentage points.
false_statement: Using a cutoff in ISS's own guidelines, Malenko and Shen estimated that a negative ISS say-on-pay recommendation in 2010-2011 cut shareholder support by about 2 percentage points.
explanation: The regression-discontinuity design compares firms just either side of an ISS threshold, isolating the recommendation's causal effect. The large effect is why boards design pay plans with advisor policies in mind.
