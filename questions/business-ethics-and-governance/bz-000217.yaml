topic: Fiduciary Duty
topic_type: Concept
true_statement: In Marchand v. Barnhill (2019), Delaware's Supreme Court let an oversight claim proceed against Blue Bell's board, which allegedly had no board-level food safety monitoring.
false_statement: In Marchand v. Barnhill (2019), Delaware's Supreme Court dismissed an oversight claim against Blue Bell's board, which allegedly had no board-level food safety monitoring.
explanation: After a listeria outbreak, the court reversed dismissal, holding that failing to make a good-faith effort to monitor a mission-critical compliance risk breaches the duty of loyalty. Since Caremark claims are notoriously hard to win, the case is read as sharpening the oversight standard.
