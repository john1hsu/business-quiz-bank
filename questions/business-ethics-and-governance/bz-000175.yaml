true_statement: Of 48 signatory companies that answered Bebchuk and Tallarita, 47 said the CEO alone decided to sign the BRT statement; only one reported board approval.
false_statement: Of 48 signatory companies that answered Bebchuk and Tallarita, 47 said the board approved signing the BRT statement; only one reported a CEO-only decision.
explanation: Board involvement matters because a stakeholder commitment binds only if written into charters, board guidelines, executive pay and shareholder voting. With boards largely absent, the authors concluded the pledge was mostly a matter of public relations.
