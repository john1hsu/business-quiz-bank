true_statement: The UK's 1992 Cadbury Report followed the 1991 collapses of BCCI and Maxwell, which strengthened the case for common standards of accountability.
false_statement: The UK's 1992 Cadbury Report followed the 2001 collapses of Enron and WorldCom, which strengthened the case for common standards of accountability.
explanation: Cadbury is seen as the starting point of modern UK governance codes, and it was a reaction to British scandals of 1991. Enron and WorldCom came a decade later and shaped US reform instead.
