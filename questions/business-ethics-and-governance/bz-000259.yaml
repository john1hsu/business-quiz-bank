id: bz-000259
area: business-ethics-and-governance
kind: evidence
topic: Board Audit Committee
topic_type: Concept
true_statement: April Klein found larger abnormal accruals when fewer than half of audit committee members were independent, but no significant extra benefit from a fully independent committee.
false_statement: April Klein found larger abnormal accruals when fewer than all audit committee members were independent, with a significant extra benefit only from a fully independent committee.
explanation: In her study of S&P 500 firms in 1991-1993, the effect appeared at the majority threshold. That cut against the 1999 exchange rules, which demanded committees made up entirely of independent directors.
