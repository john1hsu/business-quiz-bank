topic: 'Executive Compensation: Pay-for-Performance, Equity Incentives and Say on Pay'
topic_type: Practice
true_statement: When Citigroup became the first Wall Street bank to lose a say-on-pay vote in April 2012, the result did not oblige it to change pay, but its board said it would consult shareholders.
false_statement: When Citigroup became the first Wall Street bank to lose a say-on-pay vote in April 2012, the result legally obliged it to change pay, so its board cut the CEO's package.
explanation: Say-on-pay votes are advisory, so the Citigroup defeat over Vikram Pandit's pay, including a retention award without financial metrics, carried no legal force. It shows these votes work through shareholder pressure and board engagement rather than as binding orders.
