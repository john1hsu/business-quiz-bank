true_statement: The ESG label grew out of the UN Global Compact's Who Cares Wins report, endorsed in 2004 by 18 financial institutions from nine countries.
false_statement: The ESG label grew out of the UN Global Compact's Who Cares Wins report, endorsed in 1994 by 18 financial institutions from nine countries.
explanation: The report's signatories, including Goldman Sachs, HSBC and UBS, managed over $6 trillion. Its aim was to bring environmental, social and governance issues into mainstream analysis rather than leave them to ethical-investing niches.
