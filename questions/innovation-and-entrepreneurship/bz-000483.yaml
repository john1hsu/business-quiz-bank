topic: 'Technology Adoption Life Cycle: Adopter Segments and the Chasm'
topic_type: Framework
true_statement: The adoption life cycle began in a 1957 Iowa State report in which sociologists George Beal and Joe Bohlen grouped farmers by how early they took up new practices.
false_statement: The adoption life cycle began in a 1957 study of early computer buyers in which George Beal and Joe Bohlen grouped firms by how early they took up new machines.
explanation: The model came from agricultural extension research, not technology marketing; hybrid seed corn took about 13 years to reach most Iowa farmers. Everett Rogers generalized it in 1962, and Geoffrey Moore later adapted it to high-tech buyers.
