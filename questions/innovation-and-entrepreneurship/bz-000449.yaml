area: innovation-and-entrepreneurship
kind: evidence
topic: 'Creative Destruction: Schumpeter''s Process of Innovation-Driven Industrial Change'
topic_type: Theory
true_statement: Foster and colleagues found surges of U.S. business entry are followed by a brief productivity slowdown, then faster growth as successful entrants expand and weak firms exit.
false_statement: Foster and colleagues found surges of U.S. business entry are followed by a brief productivity speedup, then slower growth as entrants crowd the market and strong firms exit.
explanation: Using Census microdata, they saw productivity dispersion widen after entry waves, then reallocation toward the more productive firms lift growth, especially in high tech. Creative destruction pays off with a lag, not immediately.
