true_statement: Andy Grove recommended the book at Intel's 1998 sales conference, the year Intel launched its cheaper, less sophisticated Celeron chip to avoid being disrupted from below.
false_statement: Andy Grove recommended the book at Intel's 1998 sales conference, the year Intel launched its costlier, more sophisticated Celeron chip to avoid being disrupted from below.
explanation: 'Celeron is the classic early corporate response to the book: Intel attacked the low end itself with a cheaper, simpler processor rather than leave that space to an entrant. A premium chip would not answer a threat that starts with inferior, low-priced products.'
