area: innovation-and-entrepreneurship
kind: evidence
topic: 'Open Innovation: Purposive Inflows and Outflows of Knowledge'
topic_type: Concept
true_statement: Laursen and Salter's 2006 study of UK manufacturers found that drawing on more external knowledge sources helps innovation only up to a point, forming an inverted U.
false_statement: Laursen and Salter's 2006 study of UK manufacturers found that drawing on more external knowledge sources hurts innovation only up to a point, forming a U shape.
explanation: Broader and deeper external search both raised innovation at first and then turned negative, implying firms can over-search and spread attention too thin. The study of 2,707 firms is the best-known empirical test of open innovation.
