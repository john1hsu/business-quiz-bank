true_statement: Critics of The Innovator's Dilemma note that disruption can also come from above, as when the iPhone displaced the iPod.
false_statement: Critics of The Innovator's Dilemma note that disruption can also come from below, as when the iPhone displaced the iPod.
explanation: Christensen's cases centre on cheaper, initially inferior products climbing from below. The iPhone shows a more capable product displacing an incumbent from above, one of several findings that the book generalised further than the record supports.
