topic: Jobs to Be Done
topic_type: Theory
true_statement: In the milkshake case, morning commuters hired a shake to make a long, dull drive more interesting, so it competed with bagels and bananas rather than other shakes.
false_statement: In the milkshake case, morning commuters hired a shake to make a long, dull drive more interesting, so it competed with other chains' shakes rather than bagels and bananas.
explanation: Surveying target customers about an ideal shake had changed nothing; watching who bought shakes, and when, revealed the job. Because competition is defined by the job, the rivals were other commute foods, not other milkshakes.
