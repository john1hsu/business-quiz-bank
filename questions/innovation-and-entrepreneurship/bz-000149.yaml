id: bz-000149
area: innovation-and-entrepreneurship
kind: definition
topic: The Innovator's Dilemma
topic_type: Work
true_statement: The innovator's dilemma is that habits keeping a leader healthy, like listening to major customers and investing where margins are high, make it neglect new segments.
false_statement: The innovator's dilemma is that habits keeping a leader healthy, like listening to fringe customers and investing where margins are low, make it neglect its core segments.
explanation: 'Christensen''s trap is that good management itself is the problem: serving the best customers and chasing high margins steers a leader away from segments where an initially inferior product keeps improving. The false version reverses those behaviours and what gets neglected.'
