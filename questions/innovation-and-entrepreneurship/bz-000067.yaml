topic: Organizational Ambidexterity
topic_type: Concept
true_statement: James March's 1991 paper argued that adaptive processes tend to refine exploitation faster than exploration, which pays off short term but becomes self-destructive long term.
false_statement: James March's 1991 paper argued that adaptive processes tend to refine exploration faster than exploitation, which pays off short term but becomes self-destructive long term.
explanation: Exploitation pays back sooner and more surely, so organizations drift toward it. March's point is that this bias starves the search for new possibilities, the trade-off that ambidexterity later tried to solve.
