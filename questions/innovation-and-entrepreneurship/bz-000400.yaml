topic: 'Lean Startup: Validated Learning Through the Build-Measure-Learn Loop'
topic_type: Practice
true_statement: Felin, Gambardella, Stern and Zenger argue lean startup's reliance on quick customer feedback steers founders toward incremental rather than truly novel opportunities.
false_statement: Felin, Gambardella, Stern and Zenger argue lean startup's reliance on quick customer feedback steers founders toward truly novel rather than incremental opportunities.
explanation: Customers find it hard to judge products unlike anything they know, so fast validation favours safe ideas. The authors suggest starting from a theory of value and running critical experiments, a stance known as the theory-based view.
