true_statement: Jobs to be done draws on Theodore Levitt's remark that people buying a quarter-inch drill really want a quarter-inch hole.
false_statement: Jobs to be done draws on Anthony Ulwick's remark that people buying a quarter-inch drill really want a quarter-inch hole.
explanation: Levitt's outcome-over-product insight is the root that Christensen and Intuit's Scott Cook built on. Ulwick is behind Outcome-Driven Innovation, a parallel, more quantitative school built on the same job concept.
