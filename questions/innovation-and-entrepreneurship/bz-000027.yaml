true_statement: A 2015 study by King and Baatartogtokh found only 9% of 77 cited disruption cases met all four core conditions they tested.
false_statement: A 2015 study by King and Baatartogtokh found 90% of 77 cited disruption cases met all four core conditions they tested.
explanation: Their experts judged most of Christensen and Raynor's example cases a poor fit, though the authors suggested blending the theory with classic strategy rather than discarding it. Defenders replied that the theory has more than four elements.
