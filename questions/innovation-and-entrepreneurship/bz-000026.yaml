true_statement: Christensen built disruptive innovation theory from evidence in the rigid disk-drive industry.
false_statement: Christensen built disruptive innovation theory from evidence in the semiconductor chip industry.
explanation: In disk drives, incumbents led on capacity improvements their customers wanted, but entrants won each shift to smaller, initially weaker drives. That pattern became The Innovator's Dilemma (1997).
