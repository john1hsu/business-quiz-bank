topic: 'Technology Adoption Life Cycle: Adopter Segments and the Chasm'
topic_type: Framework
true_statement: Moore's way to cross the chasm is to dominate a single vertical niche with a complete solution, then knock down adjacent niches before a mass-market tornado.
false_statement: Moore's way to cross the chasm is to launch across the whole mass market at once with a basic product, then retreat to vertical niches once growth slows.
explanation: Pragmatists buy only what peers already use, so a startup first wins one niche where a broken, mission-critical process makes buyers willing to try something unproven. Those references then help it win neighbouring niches, the bowling alley, before hypergrowth.
