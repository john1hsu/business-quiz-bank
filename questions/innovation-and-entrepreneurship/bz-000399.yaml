area: innovation-and-entrepreneurship
kind: definition
topic: 'Lean Startup: Validated Learning Through the Build-Measure-Learn Loop'
topic_type: Practice
true_statement: Steve Blank defines a startup as a temporary organization searching for a repeatable, scalable business model, not a small company executing a known one.
false_statement: Steve Blank defines a startup as a temporary organization executing a known, scalable business model, not a small company still searching for one.
explanation: Because a startup does not yet know its customers, channels or revenue model, writing a detailed plan is premature. Blank's definition is why lean startup treats the business model as hypotheses to test.
