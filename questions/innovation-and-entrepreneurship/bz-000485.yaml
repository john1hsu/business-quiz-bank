id: bz-000485
area: innovation-and-entrepreneurship
kind: evidence
topic: 'Technology Adoption Life Cycle: Adopter Segments and the Chasm'
topic_type: Framework
true_statement: Chandrasekaran and Tellis found a sales saddle after takeoff across many products, but business and technological cycles explained it as well as or better than chasms in some categories.
false_statement: Chandrasekaran and Tellis found a sales saddle after takeoff across many products, and chasms between adopter segments explained it better than business cycles in every category.
explanation: Across 148 product-country cases the saddle was real, starting around nine years after takeoff and cutting sales by about 29% at its trough. Yet a chasm was only one possible cause, so a post-launch slump should not automatically be read as one.
