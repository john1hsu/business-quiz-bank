area: innovation-and-entrepreneurship
kind: definition
topic: Disruptive Innovation
topic_type: Theory
true_statement: In new-market disruption, an entrant first serves people who previously did without the product, as early personal computers did.
false_statement: In new-market disruption, an entrant first takes the least profitable customers of an existing market, as early personal computers did.
explanation: Taking an incumbent's least profitable customers is low-end disruption, the path of steel minimills and discount retailers. New-market disruption competes against non-consumption, as PCs and Sony's pocket radios did.
