topic: 'Customer Development: Steve Blank''s Search for a Repeatable Business Model'
topic_type: Practice
true_statement: In customer development, a startup whose validation evidence is weak pivots by changing one or more hypotheses and loops back to customer discovery.
false_statement: In customer development, a startup whose validation evidence is weak pivots by changing one or more hypotheses and moves ahead to customer creation.
explanation: Customer creation, the push from a few customers to many, only makes sense once a repeatable sales roadmap and workable financial model have been validated. Weak evidence sends the team back to discovery to test revised hypotheses about the problem and solution.
