topic: Organizational Ambidexterity
topic_type: Concept
true_statement: Fujifilm began repositioning around 2000, when global film sales peaked, using film-related capabilities to enter cosmetics and pharmaceuticals, while Kodak stayed focused on film.
false_statement: Kodak began repositioning around 2000, when global film sales peaked, using film-related capabilities to enter cosmetics and pharmaceuticals, while Fujifilm stayed focused on film.
explanation: The two firms had comparable technologies, yet Fujifilm grew into new businesses and Kodak went bankrupt in 2012. The contrast supports the view that incumbents fail through leadership and design, not missing technology.
