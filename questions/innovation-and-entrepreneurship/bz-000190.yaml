topic: Jobs to Be Done
topic_type: Theory
true_statement: A study of 109 business customers of one chemical firm found that how well their important jobs were solved explained only 22.8% of the variance in their performance.
false_statement: A study of 109 business customers of one chemical firm found that how well their important jobs were solved explained about 82.8% of the variance in their performance.
explanation: The link was positive but modest, and it came from a single company and industry. Most support for jobs to be done is case-based work by its own proponents, so peer-reviewed tests remain thin.
