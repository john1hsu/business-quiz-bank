true_statement: Steve Blank began outlining customer development in a Berkeley course in 2003 and set it out in detail that year in The Four Steps to the Epiphany.
false_statement: Steve Blank began outlining customer development in a Stanford course in 2011 and set it out in detail that year in The Four Steps to the Epiphany.
explanation: 'Blank developed the method in 2003 after about two decades in startups, when he concluded the usual product development sequence ignored the biggest risk: having no customers. 2011 is when NSF launched its Innovation Corps program built on his ideas, not when he wrote the book.'
