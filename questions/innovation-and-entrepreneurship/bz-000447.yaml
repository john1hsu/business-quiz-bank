topic: 'Creative Destruction: Schumpeter''s Process of Innovation-Driven Industrial Change'
topic_type: Theory
true_statement: Joseph Schumpeter named creative destruction in Capitalism, Socialism, and Democracy (1942), describing capitalism as a perennial gale of industrial mutation.
false_statement: Joseph Schumpeter named creative destruction in Capitalism, Socialism, and Democracy (1962), describing capitalism as a perennial gale of industrial mutation.
explanation: Schumpeter, who died in 1950, gave the idea a short chapter in his 1942 book. His point was that the competition that matters is not price-cutting among similar firms but new goods, technologies and forms of organization that threaten incumbents' existence.
