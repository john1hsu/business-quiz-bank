true_statement: In Competing Against Luck (2016), Christensen argued that understanding the job customers hire a product to do, rather than their demographics, makes innovation more predictable.
false_statement: In Competing Against Luck (2016), Christensen argued that understanding customers' demographics, rather than the job they hire a product to do, makes innovation more predictable.
explanation: Jobs to be done shifts the focus from who the customer is to the progress they are trying to make. Christensen illustrated it with firms like Intuit, Airbnb and Chobani, and it was his second big idea after disruption.
