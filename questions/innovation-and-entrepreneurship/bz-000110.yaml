true_statement: Historian Tom Nicholas argues that Christensen's disruption research drew on Alfred Chandler's account of the large, vertically integrated enterprise.
false_statement: Historian Tom Nicholas argues that Christensen's disruption research drew on Joseph Schumpeter's account of creative destruction.
explanation: Christensen built theory from business history, starting with a 1993 Business History Review study of integrated disk-drive makers. Nicholas places that method in Chandler's tradition; creative destruction is a related idea, not the source he identifies.
