false_statement: Chanda, Ray and McKelvey's 2018 replication found that below a critical level of a group's collective human capital, heavy exploration produces more organizational knowledge.
explanation: Their rerun of March's simulation showed the payoff to exploring versus exploiting depends on what the group already knows. They also found undocumented features in March's original code that conflicted with his stated assumptions.
