true_statement: March argued that when a firm competes to finish first among many rivals, the variance of its performance matters as much as the mean, so reliable knowledge can cut its chance of winning.
false_statement: March argued that when a firm competes to finish first among many rivals, the mean of its performance matters far more than the variance, so reliable knowledge raises its chance of winning.
explanation: With enough competitors, only an unusually high draw wins, so the mean becomes almost irrelevant. Knowledge makes results more reliable, lowering the odds of finishing last but also of finishing first, which argues for several independent projects when the prize goes only to the leader.
