true_statement: Van de Ven's 1986 Management Science article named managing attention, so that people notice the need for novelty, as the human problem of innovation management.
false_statement: Van de Ven's 1986 Management Science article named managing part-whole relationships, so that people notice the need for novelty, as the human problem of innovation management.
explanation: 'He listed four problems: attention (human), turning ideas into accepted practice (process), part-whole relationships as an innovation spreads (structural) and institutional leadership (strategic). The attention problem explains why efficient routines dull sensitivity to new needs.'
