true_statement: The Innovation Journey (1999) concluded that innovation is a nonlinear cycle of divergence and convergence that managers can learn to navigate but not control.
false_statement: The Innovation Journey (1999) concluded that innovation is a neat sequence of stages that managers can learn to plan and control.
explanation: The book synthesised the Minnesota Innovation Research Program, which tracked fourteen innovations as they unfolded. That evidence found neither tidy stages nor pure trial and error, which is why it offers no reliable stage-gate formula.
