topic: 'Innovation Management: Organizing the Innovation Process'
topic_type: Field
true_statement: ISO 56001, published in September 2024, is the first requirements standard for an innovation management system and applies to organizations of any size or sector.
false_statement: ISO 56001, published in September 2024, is the first requirements standard for an innovation management system and applies only to large manufacturers with formal R&D units.
explanation: The standard treats innovation as an organization-wide system rather than an R&D activity. It uses the same harmonized structure as other ISO management-system standards, so it can sit alongside quality or environmental systems.
