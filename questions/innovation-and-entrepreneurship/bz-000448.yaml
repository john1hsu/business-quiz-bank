area: innovation-and-entrepreneurship
kind: mechanism
topic: 'Creative Destruction: Schumpeter''s Process of Innovation-Driven Industrial Change'
topic_type: Theory
true_statement: In Aghion and Howitt's 1992 model, expecting more research in the future shortens the life of today's innovation rents, so firms invest less in research now.
false_statement: In Aghion and Howitt's 1992 model, expecting more research in the future lengthens the life of today's innovation rents, so firms invest more in research now.
explanation: Each quality-improving innovation erodes the rents of the one before it, so future innovation is a threat to today's innovator. That intertemporal link means anticipated research discourages current research, one reason market outcomes can deliver too much or too little growth.
