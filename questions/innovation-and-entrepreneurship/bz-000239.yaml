true_statement: In Van de Ven and Poole's typology of organizational change, the dialectic motor explains change as conflict between opposing entities that produces a synthesis.
false_statement: In Van de Ven and Poole's typology of organizational change, the teleological motor explains change as conflict between opposing entities that produces a synthesis.
explanation: 'Their 1995 typology has four motors: life cycle (prescribed stages), teleology (purposeful goal-setting and adaptation), dialectics (clash and synthesis) and evolution (variation, selection, retention). Teleology is about pursuing goals, not conflict between factions.'
