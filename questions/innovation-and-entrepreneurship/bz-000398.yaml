true_statement: Eric Ries created the lean startup by combining Steve Blank's customer development with agile software practices, naming it after lean manufacturing.
false_statement: Steve Blank created the lean startup by combining Eric Ries's customer development with agile software practices, naming it after lean manufacturing.
explanation: Blank developed customer development and published it in 2003; Ries, a founder Blank advised, added agile methods and the lean label, then wrote The Lean Startup in 2011. The name nods to Toyota's war on waste.
