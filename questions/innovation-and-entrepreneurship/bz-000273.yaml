true_statement: In March's mutual-learning model, slow socialization of individuals combined with fast learning by the organizational code yields the highest equilibrium knowledge.
false_statement: In March's mutual-learning model, fast socialization of individuals combined with slow learning by the organizational code yields the highest equilibrium knowledge.
explanation: Slow learners keep diverse beliefs alive long enough for the code to learn from those that fit reality better. Rapid socialization erases that diversity, so the organization stops improving.
