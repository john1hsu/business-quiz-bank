true_statement: In Gary Pisano's typology, disruptive innovation needs a new business model but little new technology, while radical innovation needs new technology within the same model.
false_statement: In Gary Pisano's typology, radical innovation needs a new business model but little new technology, while disruptive innovation needs new technology within the same model.
explanation: Pisano sorts projects on two axes, technology and business model. Routine needs neither and architectural needs both; he argues most firms should hold a deliberate portfolio, since routine innovation can be very profitable.
